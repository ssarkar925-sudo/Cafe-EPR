services:
  - type: web
    name: sccomm-whatsapp-gateway
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --omit=dev
    # Render's public PORT is owned by the controller. The controller forwards
    # traffic to the WhatsApp child and supports the direct PDF byte handoff.
    startCommand: node scripts/whatsapp-gateway-controller.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://tvxehxnvuwojjbhysajp.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
