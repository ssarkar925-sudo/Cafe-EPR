name: Apply Khata Due Source

on:
  push:
    branches: [feat/pos-khata-due]

permissions:
  contents: write

jobs:
  migrate:
    if: contains(github.event.head_commit.message, 'chore: run one-time Khata source migration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/apply-khata-due-source.mjs
      - run: npx tsc --noEmit
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/pos/item-browser.tsx components/pos/pos-client.tsx components/pos/quick-sale.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat(pos): add Khata due payment flow"
          git push origin HEAD:${{ github.ref_name }}
