name: Quality Gate

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Financial invariants
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee invariant.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload financial invariant diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-invariant-diagnostics
          path: invariant.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Lint
        run: npm run lint

      # Non-SAI production regressions are release-blocking.
      - name: Comprehensive application QA
        run: npm run test:qa
      - name: Cross-module reconciliation
        run: npm run test:reconciliation
      - name: Client idempotency contract
        run: npm run test:idempotency-client
      - name: V1 foundation contract
        run: npm run test:v1-foundation
      - name: V1 phase 2 shell
        run: npm run test:v1-phase2
      - name: V1 phase 3 admin
        run: npm run test:v1-phase3
      - name: V1 services
        run: npm run test:v1-services
      - name: V1 day close
        run: npm run test:v1-day-close
      - name: V1 back entry
        run: npm run test:v1-back-entry
      - name: V1 offline sync
        run: npm run test:v1-offline-sync
      - name: V1 returns and refunds
        run: npm run test:v1-returns-refunds
      - name: Customer search
        run: npm run test:customer-search
      - name: Customer creation
        run: npm run test:customer-creation
      - name: Quick Sale exclusion
        run: npm run test:quick-sale-exclusion
      - name: WhatsApp document flow
        run: npm run test:whatsapp-document
      - name: AI browser safety
        run: npm run test:ai-browser

      - name: SAI POS draft handoff safety
        run: npm run test:sai-pos-draft-handoff

      - name: AI learning control
        run: npm run test:ai-learning
      - name: SAI microphone input
        run: npm run test:sai-microphone

      - name: Electron microphone permission
        run: npm run test:electron-microphone

      - name: SAI server voice pipeline
        run: npm run test:sai-voice-pipeline

      - name: SAI Gemini 3.x root
        run: npm run test:sai-gemini-root

      - name: SAI floating popup
        run: npm run test:sai-floating-popup

      - name: SAI safe recovery
        run: npm run test:sai-recovery
      - name: SAI durable world state
        run: npm run test:sai-world-state
      - name: SAI goals and missions
        run: npm run test:sai-goals-missions
      - name: SAI planner
        run: npm run test:sai-planner

      - name: SAI first-party chat runtime
        run: npm run test:sai-chat-runtime
      - name: SAI Phase 2A domain intelligence
        run: node scripts/test-sai-planner.mjs
      - name: SAI evidence provenance
        run: npm run test:sai-evidence
      - name: SAI execution tracing
        run: npm run test:sai-tracing
      - name: SAI autonomy and attention policy
        run: npm run test:sai-autonomy
      - name: SAI mission runner
        run: npm run test:sai-missions-runner

      - name: SAI Phase 2C finance intelligence
        run: npm run test:sai-finance-intelligence

      - name: SAI POS observation workflow
        run: npm run test:sai-pos-workflow
      - name: SAI typed POS draft safety
        run: npm run test:sai-pos-draft

      - name: SAI simulation and contradiction detection
        run: npm run test:sai-simulation

      - name: SAI Recovery Manager 2.0
        run: npm run test:sai-recovery-manager

      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
