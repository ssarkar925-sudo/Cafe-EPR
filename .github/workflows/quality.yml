name: Quality Gate

# Financial invariant 697 now validates DMT payment-method handling semantically.
'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Align utility invariant tests with canonical RPC
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/financial-hardening-final'
        shell: python
        run: |
          from pathlib import Path
          p = Path('scripts/test-financial-invariants.mjs')
          s = p.read_text(encoding='utf-8')
          old1 = '  assert(bp_utilityWorkspaceFile.includes(\'service_type: "bill_payment"\'), "1001. Utility Collection: Posts to transactions with service_type = bill_payment");'
          new1 = '  assert(bp_utilityWorkspaceFile.includes(\'record_bill_payment\') && bp_utilityWorkspaceFile.includes(\'p_customer_payment_allocations\'), "1001. Utility Collection: Posts through canonical record_bill_payment RPC");'
          old2 = '  assert(bp_utilityWorkspaceFile.includes("customer_ledger") && bp_utilityWorkspaceFile.includes("balance_after"), "1003. Utility Khata: Customer ledger receivable balance increases without increasing cash drawer");'
          new2 = '  assert(bp_utilityWorkspaceFile.includes(\'p_customer_id: selectedCustomerId || null\') && bp_utilityWorkspaceFile.includes(\'p_customer_payment_allocations: customerAllocations\'), "1003. Utility Khata: Canonical RPC carries customer receivable allocation without client-side ledger mutation");'
          if old1 not in s or old2 not in s:
              raise SystemExit('Expected legacy utility invariant assertions not found')
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          print('UTILITY_TEST_PATCH_OK')

      - name: Commit utility invariant test patch
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/financial-hardening-final'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-financial-invariants.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No test changes to commit."
          else
            git commit -m "test: align utility invariants with canonical RPC boundary"
            git fetch origin chore/financial-hardening-final
            git rebase origin/chore/financial-hardening-final
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Financial invariants
        run: npm test

      - name: AI browser safety
        run: npm run test:ai-browser

      - name: AI learning control
        run: npm run test:ai-learning

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
