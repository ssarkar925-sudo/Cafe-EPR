name: Quality Gate

# Financial invariant 697 now validates DMT payment-method handling semantically.
'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Upload resolved lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolved-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3

      - name: Financial invariants
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee invariant.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload financial invariant diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-invariant-diagnostics
          path: invariant.log
          if-no-files-found: ignore
          retention-days: 3

      - name: AI browser safety
        run: npm run test:ai-browser

      - name: AI learning control
        run: npm run test:ai-learning

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
