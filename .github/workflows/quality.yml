name: Quality Gate

# Financial invariant 697 now validates DMT payment-method handling semantically.
'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply utility billing financial-boundary patch
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/financial-hardening-final'
        shell: python
        run: |
          from pathlib import Path

          path = Path('components/business/utility-bill-workspace.tsx')
          text = path.read_text(encoding='utf-8')

          start_marker = '      // 2. Post to Canonical transactions Table\n'
          end_marker = '      // 5. Audit Trail Logging\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0:
              raise SystemExit('Could not locate canonical utility payment block markers')

          replacement = '''      // 2. Canonical financial mutation: SECURITY DEFINER RPC.\n      // No direct transactions/cash_entries writes are permitted from the browser.\n      const customerAllocations = customerPaymentAllocations.filter((row) => Number(row.amount) > 0);\n      const effectiveCustomerMethod =\n        customerCollectionAmount > 0\n          ? (customerAllocations.length === 1\n              ? customerAllocations[0].method\n              : (customerPayMethod === "due" ? "cash" : customerPayMethod))\n          : "due";\n\n      const { data: paymentResult, error: paymentError } = await supabase.rpc("record_bill_payment", {\n        p_transaction_date: todayDate,\n        p_transaction_timestamp: todayIso,\n        p_customer_id: selectedCustomerId || null,\n        p_customer_mobile: customerMobile.replace(/\\D/g, "") || null,\n        p_reference: `${reference.trim() || consumerId.trim()}-${crypto.randomUUID().replace(/-/g, "").slice(0, 10).toUpperCase()}`,\n        p_remarks: remarks.trim() || `${currentCategory.name} - ${billerName} (${consumerId.trim()})`,\n        p_status: "success",\n        p_amount: billAmount,\n        p_service_fee: custFee,\n        p_portal_commission: commissionEarned,\n        p_pay_from_instrument_id: fundingInstId,\n        p_pay_from_method: selectedFundingAccount.type,\n        p_customer_pay_method: effectiveCustomerMethod,\n        p_customer_collection_instrument_id:\n          customerAllocations.length === 1 ? (selectedCustomerPaymentAccount?.id || null) : null,\n        p_customer_payment_allocations: customerAllocations,\n      });\n      if (paymentError) throw paymentError;\n\n      const createdTxnId = paymentResult?.id;\n      if (!createdTxnId) {\n        throw new Error("Canonical bill-payment RPC returned no transaction id.");\n      }\n\n      const { data: newTxn, error: loadTxnError } = await supabase\n        .from("transactions")\n        .select(`*, customers(name, phone), profiles(full_name)`)\n        .eq("id", createdTxnId)\n        .single();\n      if (loadTxnError || !newTxn) {\n        throw loadTxnError || new Error("Bill payment was posted but could not be loaded.");\n      }\n\n      const actualTxnNumber = newTxn.transaction_number || paymentResult.transaction_number || "BILL-PAYMENT";\n\n'''
          text = text[:start] + replacement + text[end:]

          rev_start_marker = '      // Offset cash entries\n'
          rev_end_marker = '      setTransactions((prev) =>\n'
          rev_start = text.find(rev_start_marker)
          rev_end = text.find(rev_end_marker, rev_start + len(rev_start_marker))
          if rev_start < 0 or rev_end < 0:
              raise SystemExit('Could not locate reversal direct-write block markers')
          text = text[:rev_start] + '''      // reverse_business_txn owns the append-only reversal, customer ledger,\n      // and accounting legs. Do not mutate cash_entries/customers/customer_ledger here.\n\n''' + text[rev_end:]

          text = text.replace('      // 1. Generate a collision-resistant transaction number.\n      // Count-based numbering is race-prone: two simultaneous payments can read the same count.\n      const nextNum = `BIL-${todayDate.replace(/-/g, "")}-${crypto.randomUUID().replace(/-/g, "").slice(0, 10).toUpperCase()}`;\n      const txnNumber = nextNum;\n\n', '      // 1. Transaction numbering is generated atomically inside record_bill_payment.\n\n', 1)
          text = text.replace('transaction_number: txnNumber,', 'transaction_number: actualTxnNumber,', 1)
          text = text.replace('description: `Paid Utility Bill ${txnNumber} for ${billerName}', 'description: `Paid Utility Bill ${actualTxnNumber} for ${billerName}', 1)
          text = text.replace('showToast("success", `✓ Bill payment ${txnNumber} processed successfully!`);', 'showToast("success", `✓ Bill payment ${actualTxnNumber} processed successfully!`);', 1)

          path.write_text(text, encoding='utf-8')

          handler_start = text.find('  async function handleCompletePayment()')
          handler_end = text.find('  // Export CSV', handler_start)
          section = text[handler_start:handler_end]
          forbidden = [
              '.from("transactions").insert',
              '.from("cash_entries").insert',
              '.from("customers").update',
              '.from("customer_ledger").insert',
              'apply_transaction_customer_payment_split',
          ]
          for token in forbidden:
              if token in section:
                  raise SystemExit(f'Unsafe financial write remains: {token}')
          if 'supabase.rpc("record_bill_payment"' not in section:
              raise SystemExit('record_bill_payment RPC missing after patch')
          print('UTILITY_PATCH_OK')

      - name: Commit utility billing patch
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/financial-hardening-final'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/business/utility-bill-workspace.tsx
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No utility patch changes to commit."
          else
            git commit -m "chore: apply utility billing safe patch"
            git fetch origin chore/financial-hardening-final
            git rebase origin/chore/financial-hardening-final
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Financial invariants
        run: npm test

      - name: AI browser safety
        run: npm run test:ai-browser

      - name: AI learning control
        run: npm run test:ai-learning

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
