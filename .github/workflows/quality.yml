name: Quality Gate

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Financial invariants
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee invariant.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload financial invariant diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-invariant-diagnostics
          path: invariant.log
          if-no-files-found: ignore
          retention-days: 3
      - name: AI browser safety
        run: npm run test:ai-browser
      - name: AI learning control
        run: npm run test:ai-learning
      - name: SAI microphone input
        run: npm run test:sai-microphone

      - name: Electron microphone permission
        run: npm run test:electron-microphone

      - name: SAI server voice pipeline
        run: npm run test:sai-voice-pipeline

      - name: SAI floating popup
        run: npm run test:sai-floating-popup

      - name: SAI safe recovery
        run: npm run test:sai-recovery
      - name: SAI durable world state
        run: npm run test:sai-world-state
      - name: SAI goals and missions
        run: npm run test:sai-goals-missions
      - name: SAI planner
        run: npm run test:sai-planner
      - name: SAI Phase 2A domain intelligence
        run: node scripts/test-sai-planner.mjs
      - name: SAI evidence provenance
        run: npm run test:sai-evidence
      - name: SAI execution tracing
        run: npm run test:sai-tracing
      - name: SAI autonomy and attention policy
        run: npm run test:sai-autonomy
      - name: SAI mission runner
        run: npm run test:sai-missions-runner

      - name: SAI simulation and contradiction detection
        run: npm run test:sai-simulation

      - name: SAI Recovery Manager 2.0
        run: npm run test:sai-recovery-manager

      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
