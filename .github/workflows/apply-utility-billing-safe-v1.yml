name: Apply Utility Billing Safe V1

on:
  push:
    branches:
      - chore/financial-hardening-final

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'chore: apply utility billing safe patch') && !contains(github.event.head_commit.message, 'chore: remove utility billing patch workflow') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/financial-hardening-final
          fetch-depth: 1

      - name: Apply exact financial-boundary patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('components/business/utility-bill-workspace.tsx')
          text = path.read_text(encoding='utf-8')

          start_marker = '      // 2. Post to Canonical transactions Table\n'
          end_marker = '      // 5. Audit Trail Logging\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0:
              raise SystemExit('Could not locate canonical utility payment block markers')
          if text.find(start_marker, start + 1) >= 0:
              raise SystemExit('Payment start marker appears more than once')

          replacement = '''      // 2. Canonical financial mutation: SECURITY DEFINER RPC.\n      // No direct transactions/cash_entries writes are permitted from the browser.\n      const customerAllocations = customerPaymentAllocations.filter((row) => Number(row.amount) > 0);\n      const effectiveCustomerMethod =\n        customerCollectionAmount > 0\n          ? (customerAllocations.length === 1\n              ? customerAllocations[0].method\n              : (customerPayMethod === "due" ? "cash" : customerPayMethod))\n          : "due";\n\n      const { data: paymentResult, error: paymentError } = await supabase.rpc("record_bill_payment", {\n        p_transaction_date: todayDate,\n        p_transaction_timestamp: todayIso,\n        p_customer_id: selectedCustomerId || null,\n        p_customer_mobile: customerMobile.replace(/\\D/g, "") || null,\n        p_reference: `${reference.trim() || consumerId.trim()}-${crypto.randomUUID().replace(/-/g, "").slice(0, 10).toUpperCase()}`,\n        p_remarks: remarks.trim() || `${currentCategory.name} - ${billerName} (${consumerId.trim()})`,\n        p_status: "success",\n        p_amount: billAmount,\n        p_service_fee: custFee,\n        p_portal_commission: commissionEarned,\n        p_pay_from_instrument_id: fundingInstId,\n        p_pay_from_method: selectedFundingAccount.type,\n        p_customer_pay_method: effectiveCustomerMethod,\n        p_customer_collection_instrument_id:\n          customerAllocations.length === 1 ? (selectedCustomerPaymentAccount?.id || null) : null,\n        p_customer_payment_allocations: customerAllocations,\n      });\n      if (paymentError) throw paymentError;\n\n      const createdTxnId = paymentResult?.id;\n      if (!createdTxnId) {\n        throw new Error("Canonical bill-payment RPC returned no transaction id.");\n      }\n\n      const { data: newTxn, error: loadTxnError } = await supabase\n        .from("transactions")\n        .select(`*, customers(name, phone), profiles(full_name)`)\n        .eq("id", createdTxnId)\n        .single();\n      if (loadTxnError || !newTxn) {\n        throw loadTxnError || new Error("Bill payment was posted but could not be loaded.");\n      }\n\n      const actualTxnNumber = newTxn.transaction_number || paymentResult.transaction_number || "BILL-PAYMENT";\n\n'''
          text = text[:start] + replacement + text[end:]

          rev_start_marker = '      // Offset cash entries\n'
          rev_end_marker = '      setTransactions((prev) =>\n'
          rev_start = text.find(rev_start_marker)
          rev_end = text.find(rev_end_marker, rev_start + len(rev_start_marker))
          if rev_start < 0 or rev_end < 0:
              raise SystemExit('Could not locate reversal direct-write block markers')

          text = text[:rev_start] + '''      // reverse_business_txn owns the append-only reversal, customer ledger,\n      // and accounting legs. Do not mutate cash_entries/customers/customer_ledger here.\n\n''' + text[rev_end:]

          # Make the existing audit/UI references use the canonical transaction number.\n          text = text.replace('transaction_number: txnNumber,', 'transaction_number: actualTxnNumber,', 1)\n          text = text.replace('description: `Paid Utility Bill ${txnNumber} for ${billerName}', 'description: `Paid Utility Bill ${actualTxnNumber} for ${billerName}', 1)\n          text = text.replace('showToast("success", `✓ Bill payment ${txnNumber} processed successfully!`);', 'showToast("success", `✓ Bill payment ${actualTxnNumber} processed successfully!`);', 1)\n          text = text.replace('`Bill ${txnNumber} settlement to ${billerName}', '`Bill settlement to ${billerName}', 1)\n
          # The local collision-resistant number is no longer generated client-side.\n          text = text.replace('      // 1. Generate a collision-resistant transaction number.\n      // Count-based numbering is race-prone: two simultaneous payments can read the same count.\n      const nextNum = `BIL-${todayDate.replace(/-/g, "")}-${crypto.randomUUID().replace(/-/g, "").slice(0, 10).toUpperCase()}`;\n      const txnNumber = nextNum;\n\n', '      // 1. Transaction numbering is generated atomically inside record_bill_payment.\n\n', 1)\n\n          path.write_text(text, encoding='utf-8')\n
          # Safety assertions: this client must not contain direct financial writes in the payment/reversal handlers.\n          payment_section = text[text.find('  async function handleCompletePayment()'):text.find('  // Export CSV', text.find('  async function handleCompletePayment()'))]\n          if '.from("transactions").insert' in payment_section:\n              raise SystemExit('Unsafe direct transactions insert remains in payment handler')\n          if '.from("cash_entries").insert' in payment_section:\n              raise SystemExit('Unsafe direct cash_entries insert remains in payment handler')\n          if '.from("customers").update' in payment_section:\n              raise SystemExit('Unsafe direct customers update remains in payment/reversal handlers')\n          if '.from("customer_ledger").insert' in payment_section:\n              raise SystemExit('Unsafe direct customer_ledger insert remains in payment/reversal handlers')\n          if 'apply_transaction_customer_payment_split' in payment_section:\n              raise SystemExit('Legacy split RPC remains after canonical record_bill_payment')\n          if 'supabase.rpc("record_bill_payment"' not in payment_section:\n              raise SystemExit('Canonical record_bill_payment RPC missing')\n          print('Safe utility billing patch applied and assertions passed.')\n
      - name: Commit patch and remove one-shot workflow\n        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/business/utility-bill-workspace.tsx
          git diff --cached --check
          git commit -m "chore: apply utility billing safe patch"
          git push origin chore/financial-hardening-final
          git rm .github/workflows/apply-utility-billing-safe-v1.yml
          git commit -m "chore: remove utility billing patch workflow"
          git push origin chore/financial-hardening-final
