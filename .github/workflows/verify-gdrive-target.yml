name: Verify Google Drive Target

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Google Drive OAuth and target folder
        shell: bash
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GDRIVE_BACKUP_FOLDER_ID: ${{ secrets.GDRIVE_BACKUP_FOLDER_ID }}
        run: |
          set -euo pipefail
          echo "::add-mask::$GOOGLE_OAUTH_CLIENT_ID"
          echo "::add-mask::$GOOGLE_OAUTH_CLIENT_SECRET"
          echo "::add-mask::$GOOGLE_OAUTH_REFRESH_TOKEN"
          echo "::add-mask::$GDRIVE_BACKUP_FOLDER_ID"

          MISSING=""
          if [ -z "${GOOGLE_OAUTH_CLIENT_ID:-}" ]; then MISSING="$MISSING GOOGLE_OAUTH_CLIENT_ID"; fi
          if [ -z "${GOOGLE_OAUTH_CLIENT_SECRET:-}" ]; then MISSING="$MISSING GOOGLE_OAUTH_CLIENT_SECRET"; fi
          if [ -z "${GOOGLE_OAUTH_REFRESH_TOKEN:-}" ]; then MISSING="$MISSING GOOGLE_OAUTH_REFRESH_TOKEN"; fi
          if [ -z "${GDRIVE_BACKUP_FOLDER_ID:-}" ]; then MISSING="$MISSING GDRIVE_BACKUP_FOLDER_ID"; fi

          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secret(s):$MISSING. See docs/STAGING_BACKUP.md for setup instructions."
            exit 1
          fi

          python3 -m pip install --quiet google-api-python-client google-auth
          python3 - <<'EOF'
          import os, sys
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          client_id = os.environ["GOOGLE_OAUTH_CLIENT_ID"]
          client_secret = os.environ["GOOGLE_OAUTH_CLIENT_SECRET"]
          refresh_token = os.environ["GOOGLE_OAUTH_REFRESH_TOKEN"]
          folder = os.environ["GDRIVE_BACKUP_FOLDER_ID"]

          # Authenticate via OAuth 2.0 Refresh Token
          try:
              creds = Credentials(
                  token=None,
                  refresh_token=refresh_token,
                  token_uri="https://oauth2.googleapis.com/token",
                  client_id=client_id,
                  client_secret=client_secret,
                  scopes=["https://www.googleapis.com/auth/drive"]
              )
              creds.refresh(Request())
          except Exception as auth_err:
              sys.stderr.write(f"::error::OAuth token refresh failed: {auth_err}\n")
              sys.exit(1)

          drive = build("drive", "v3", credentials=creds, cache_discovery=False)

          # Verify User and Storage Quota
          try:
              about = drive.about().get(fields="user(emailAddress,displayName),storageQuota").execute()
              user = about.get("user", {})
              quota = about.get("storageQuota", {})
              display_name = user.get("displayName", "Unknown")
              email = user.get("emailAddress", "Unknown")
              limit = int(quota.get("limit", 0))
              usage = int(quota.get("usage", 0))

              print(f"Authenticated as Google user: {display_name} <{email}>")
              if limit > 0:
                  free_mb = (limit - usage) / (1024 * 1024)
                  used_mb = usage / (1024 * 1024)
                  limit_mb = limit / (1024 * 1024)
                  print(f"Personal Storage Quota: {used_mb:.1f} MB used of {limit_mb:.1f} MB ({free_mb:.1f} MB free)")
                  if free_mb < 100:
                      print(f"::warning::Low storage quota remaining: {free_mb:.1f} MB free.")
              else:
                  print(f"Personal Storage Quota: {usage / (1024*1024):.1f} MB used (unlimited/organization)")
          except Exception as q_err:
              print(f"::warning::Could not query storage quota: {q_err}")

          # Verify Target Folder
          try:
              meta = drive.files().get(
                  fileId=folder,
                  fields="id,name,driveId,capabilities,trashed",
                  supportsAllDrives=True
              ).execute()
          except Exception as fe:
              sys.stderr.write(f"::error::Could not inspect target folder '{folder}': {fe}\n")
              sys.exit(1)

          name = meta.get("name", "unnamed")
          drive_id = meta.get("driveId")
          caps = meta.get("capabilities", {})
          trashed = meta.get("trashed", False)
          can_add = caps.get("canAddChildren", False)

          print(f"Target folder verified: '{name}'")
          print(f"Drive type: {'Shared Drive (driveId: ' + drive_id + ')' if drive_id else 'Personal My Drive'}")
          print(f"canAddChildren (upload permission): {can_add}")
          print(f"isTrashed: {trashed}")

          if trashed:
              sys.stderr.write(f"::error::Target folder '{name}' is in the Trash.\n")
              sys.exit(1)

          if not can_add:
              sys.stderr.write(f"::error::Authenticated account does NOT have permission to add files to folder '{name}'.\n")
              sys.exit(1)

          print("CONFIRMED: Google Drive OAuth 2.0 authentication and target folder are fully operational.")
          EOF
