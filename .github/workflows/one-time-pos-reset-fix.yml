name: one-time-pos-reset-fix
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch POS reset
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('components/pos/pos-shell.tsx')
          s=p.read_text()
          old='''const handleResetAfterSale = useCallback(() => {\n    clearActiveCart();\n    setSuccessState(null);\n  }, [clearActiveCart]);'''
          new='''const resetPOSForNewTransaction = useCallback(() => {\n    clearActiveCart();\n    setCustomerId(null);\n    setCustomerSearch(\"\");\n    setDiscount(0);\n    setDiscountType(\"amount\");\n    setPaymentMethod(\"cash\");\n    setCashReceived(\"\");\n    setSplitRows([]);\n    setUseDue(false);\n    setUseAdvance(false);\n    setSearchTerm(\"\");\n    setScanInput(\"\");\n    setShowCustomerSearch(false);\n    setShowMobileSearch(false);\n  }, [clearActiveCart]);\n\n  const handleResetAfterSale = useCallback(() => {\n    resetPOSForNewTransaction();\n    setSuccessState(null);\n  }, [resetPOSForNewTransaction]);'''
          if old not in s:
              raise SystemExit('expected reset handler block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add components/pos/pos-shell.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix(pos): reset customer and transaction state after sale'
          git push
