name: live-tester-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch settings, POS money out and customer search
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Settings: preload every settings dataset so modules are populated on first open.
          p = Path('app/(dashboard)/settings/page.tsx')
          s = p.read_text()
          replacements = {
            'const needsAccounts = activeTab === "payment-accounts";': 'const needsAccounts = true;',
            'const needsFavorites = activeTab === "quick-favorites";': 'const needsFavorites = true;',
            'const needsMethods = activeTab === "payment-methods";': 'const needsMethods = true;',
            'const needsBusiness = activeTab === "business-setup";': 'const needsBusiness = true;',
            'const needsCatalog = activeTab === "catalog";': 'const needsCatalog = true;',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing settings marker: {old}')
              s = s.replace(old, new, 1)
          s = s.replace('// Only query data required by the selected settings module. This keeps the\n  // single-workspace design fast while retaining the full functionality.',
                        '// Preload all settings datasets so every module is ready on first open.\n  // This also keeps direct module URLs consistent with the main settings workspace.', 1)
          p.write_text(s)

          # Settings shell: never refresh the server after a module click; data is already preloaded.
          p = Path('components/settings/settings-command-shell.tsx')
          s = p.read_text()
          s2 = s.replace('import { useRouter } from "next/navigation";\n', '', 1)
          if s2 == s:
              raise SystemExit('missing settings router import')
          s = s2
          old = '''export default function SettingsCommandShell(props: Props) {\n  const router = useRouter();\n  const [openTab, setOpenTab] = useState<string | null>(null);'''
          new = '''export default function SettingsCommandShell(props: Props) {\n  const [openTab, setOpenTab] = useState<string | null>(\n    props.initialTab && props.initialTab !== "general" ? props.initialTab : null\n  );'''
          if old not in s:
              raise SystemExit('missing settings shell state marker')
          s = s.replace(old, new, 1)
          if '    router.refresh();\n' not in s:
              raise SystemExit('missing settings router refresh marker')
          s = s.replace('    router.refresh();\n', '', 1)
          p.write_text(s)

          # POS customer selector: focusing an empty search must not expose the full database.
          p = Path('components/pos/item-browser.tsx')
          s = p.read_text()
          old = '''    const needle = q.trim().toLowerCase();\n    return customers.filter((c) => {'''
          new = '''    const needle = q.trim().toLowerCase();\n    if (!needle) return [];\n    return customers.filter((c) => {'''
          if old not in s:
              raise SystemExit('missing customer selector marker')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # POS Money Out: replace the inline panel with the shared fixed Modal.
          p = Path('components/pos/pos-client.tsx')
          s = p.read_text()
          marker_start = '{showMoneyOut&&<div className="mt-4 rounded-2xl bg-white p-5">'
          marker_end = '\n{showAddCustomer&&'
          start = s.find(marker_start)
          if start < 0:
              raise SystemExit('missing money out start marker')
          end = s.find(marker_end, start)
          if end < 0:
              raise SystemExit('missing money out end marker')
          replacement = '''{showMoneyOut&&<Modal\n  onClose={()=>{setShowMoneyOut(false);setAddInstOpen(false)}}\n  title="Money Out"\n  subtitle="Record an outgoing payment from the selected payment account."\n  accent="rose"\n  size="lg"\n>\n  <div className="space-y-4">\n    <div className="grid grid-cols-1 gap-4 sm:grid-cols-3">\n      <div>\n        <label className={labelClass}>Pay from (account / card)</label>\n        <InstrumentSelect\n          instruments={instList}\n          pick={moPick}\n          onChange={pick=>{if(pick)setMoPick(pick);else setAddInstOpen(true)}}\n          enabled={enabledMethods}\n          className={inputClass}\n        />\n      </div>\n      <div>\n        <label className={labelClass}>Amount (₹)</label>\n        <input\n          type="number"\n          min="0"\n          step="0.01"\n          value={moAmount}\n          onChange={e=>setMoAmount(e.target.value)}\n          placeholder="0.00"\n          className={inputClass}\n        />\n      </div>\n      <div>\n        <label className={labelClass}>Note</label>\n        <input\n          value={moNote}\n          onChange={e=>setMoNote(e.target.value)}\n          placeholder="e.g. Airtel recharge, Electricity bill…"\n          className={inputClass}\n        />\n      </div>\n    </div>\n    {addInstOpen&&<div className="rounded-xl bg-slate-50 p-3 ring-1 ring-slate-100">\n      <div className="grid grid-cols-1 gap-3 sm:grid-cols-3">\n        <input\n          value={newInst.name}\n          onChange={e=>setNewInst(p=>({...p,name:e.target.value}))}\n          placeholder="Account / card name"\n          className={inputClass}\n        />\n        <select\n          value={newInst.type}\n          onChange={e=>setNewInst(p=>({...p,type:e.target.value}))}\n          className={inputClass}\n        >\n          {INSTRUMENT_TYPES.map(t=><option key={t.value} value={t.value}>{t.label}</option>)}\n        </select>\n        <div className="flex items-center gap-2">\n          <button\n            type="button"\n            onClick={addInstrument}\n            disabled={addingInst}\n            className="rounded-lg bg-blue-600 px-3 py-2 text-sm font-medium text-white hover:bg-blue-700 disabled:opacity-50"\n          >{addingInst?"Adding…":"Add account"}</button>\n          <button\n            type="button"\n            onClick={()=>setAddInstOpen(false)}\n            className="rounded-lg border border-slate-200 px-3 py-2 text-sm text-slate-600 hover:bg-slate-50"\n          >Cancel</button>\n        </div>\n      </div>\n    </div>}\n    <div className="flex items-center justify-end border-t border-slate-100 pt-4">\n      <button\n        type="button"\n        onClick={recordMoneyOut}\n        disabled={moBusy}\n        className="rounded-xl bg-rose-600 px-4 py-2 text-sm font-semibold text-white hover:bg-rose-700 disabled:opacity-50"\n      >{moBusy?"Recording…":"Record Money Out"}</button>\n    </div>\n  </div>\n</Modal>}'''
          s = s[:start] + replacement + s[end:]
          s = s.replace('setMoAmount("");setMoNote("");setShowMoneyOut(false)',
                        'setMoAmount("");setMoNote("");setShowMoneyOut(false);setAddInstOpen(false)', 1)
          p.write_text(s)
          PY
          git config user.name 'ssarkar925-sudo'
          git config user.email 'ssarkar925@gmail.com'
          git rm .github/workflows/live-tester-fix.yml
          git add 'app/(dashboard)/settings/page.tsx' components/settings/settings-command-shell.tsx components/pos/item-browser.tsx components/pos/pos-client.tsx
          git commit -m 'fix live tester settings pos money out customer search'
          git push origin main
