name: Fix bill payment transaction number insertion order

on:
  push:
    branches: [main]
    paths:
      - components/business/utility-bill-workspace.tsx
      - .github/workflows/fix-bill-payment-numbering.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Correct transaction number payload
        shell: python
        run: |
          from pathlib import Path
          p = Path('components/business/utility-bill-workspace.tsx')
          s = p.read_text(encoding='utf-8')
          needle = '''      const insertPayload = {\n        transaction_number: txnNumber,'''
          replacement = '''      const insertPayload = {\n        transaction_number: nextNum,'''
          if needle in s:
              s = s.replace(needle, replacement, 1)
              p.write_text(s, encoding='utf-8')
          elif 'transaction_number: nextNum,' in s:
              print('Transaction payload is already correct.')
          else:
              raise SystemExit('Transaction payload marker not found')

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- components/business/utility-bill-workspace.tsx; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/business/utility-bill-workspace.tsx
          git commit -m "fix(bill): correct transaction number payload"
          git push