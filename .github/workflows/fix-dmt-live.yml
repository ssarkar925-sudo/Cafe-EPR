name: Repair DMT Live Validation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[dmt-repair]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch DMT behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('components/business/dmt-workspace.tsx')
          s = p.read_text()

          old = '''  // Strict Form Validation Guard
  const isFormValid = useMemo(() => {
    if (numAmount <= 0) return false;
    if (numCharge < 0 || numFee < 0 || numComm < 0) return false;
    if (!reference.trim() || reference.trim().length < 6) return false;

    if (transferMethod === "bank_account") {
      if (!beneficiaryAccount.trim() || beneficiaryAccount.trim().length < 4) return false;
      if (!beneficiaryIfsc.trim() || !/^[A-Z]{4}0[A-Z0-9]{6}$/.test(beneficiaryIfsc.trim().toUpperCase()))
        return false;
      if (!beneficiaryBank.trim()) return false;
    } else {
      if (!upiId.trim() || !upiId.includes("@")) return false;
    }

    if (senderMobile.trim() && senderMobile.trim().replace(/\\D/g, "").length !== 10) return false;
    if (paidFrom === "portal" && !selectedPortalId) return false;
    if (paidFrom === "bank" && !selectedBankInstrumentId) return false;
    if (customerPayMethod === "due" && !selectedCustomerId) return false;

    return true;
  }, [
    numAmount,
    numCharge,
    numFee,
    numComm,
    reference,
    transferMethod,
    beneficiaryAccount,
    beneficiaryIfsc,
    beneficiaryBank,
    upiId,
    senderMobile,
    paidFrom,
    selectedPortalId,
    selectedBankInstrumentId,
    customerPayMethod,
    selectedCustomerId,
  ]);
'''

new = '''  // Form Validation Guard: beneficiary bank/account/IFSC/UPI are optional.
  // A DMT transaction may be saved with only beneficiary identity (or even without it),
  // while amount, reference and settlement routing remain required.
  const isFormValid = useMemo(() => {
    if (numAmount <= 0) return false;
    if (numCharge < 0 || numFee < 0 || numComm < 0) return false;
    if (!reference.trim() || reference.trim().length < 6) return false;
    if (senderMobile.trim() && senderMobile.trim().replace(/\\D/g, "").length !== 10) return false;
    if (paidFrom === "portal" && !selectedPortalId) return false;
    if (paidFrom === "bank" && !selectedBankInstrumentId) return false;
    if (customerPayMethod === "due" && !selectedCustomerId) return false;
    return true;
  }, [
    numAmount,
    numCharge,
    numFee,
    numComm,
    reference,
    senderMobile,
    paidFrom,
    selectedPortalId,
    selectedBankInstrumentId,
    customerPayMethod,
    selectedCustomerId,
  ]);
'''

if old not in s:
    raise SystemExit('validation block not found')
s = s.replace(old, new, 1)

old_step = '''  // Current Active Lifecycle Step (1-5)
  const currentStep = useMemo(() => {
    if (!selectedCustomerId && !senderName.trim() && !senderMobile.trim()) return 1;
    if (transferMethod === "bank_account") {
      if (!beneficiaryAccount.trim() || !beneficiaryBank.trim()) return 2;
      if (!beneficiaryIfsc.trim()) return 3;
    } else {
      if (!upiId.trim()) return 2;
    }
    if (numAmount <= 0) return 4;
    return 5;
  }, [selectedCustomerId, senderName, senderMobile, transferMethod, beneficiaryAccount, beneficiaryBank, beneficiaryIfsc, upiId, numAmount]);
'''
new_step = '''  // Current Active Lifecycle Step (1-5)
  const currentStep = useMemo(() => {
    if (!selectedCustomerId && !senderName.trim() && !senderMobile.trim()) return 1;
    if (numAmount <= 0) return 4;
    return 5;
  }, [selectedCustomerId, senderName, senderMobile, numAmount]);
'''
if old_step not in s:
    raise SystemExit('currentStep block not found')
s = s.replace(old_step, new_step, 1)

repls = {
'''                      <label className="text-xs font-bold text-slate-700 dark:text-slate-300">\n                        Beneficiary Bank <span className="text-rose-500">*</span>\n                      </label>''': '''                      <label className="text-xs font-bold text-slate-700 dark:text-slate-300">\n                        Beneficiary Bank\n                      </label>''',
'''                      <label className="text-xs font-bold text-slate-700 dark:text-slate-300">\n                      Account Number <span className="text-rose-500">*</span>\n                    </label>''': '''                      <label className="text-xs font-bold text-slate-700 dark:text-slate-300">\n                      Account Number\n                    </label>''',
'''                      type="text"\n                      required\n                      value={beneficiaryAccount}''': '''                      type="text"\n                      value={beneficiaryAccount}''',
'''                      <label className="text-xs font-bold text-slate-700 dark:text-slate-300">\n                      Bank IFSC Code <span className="text-rose-500">*</span>\n                    </label>''': '''                      <label className="text-xs font-bold text-slate-700 dark:text-slate-300">\n                      Bank IFSC Code\n                    </label>''',
'''                      type="text"\n                      required\n                      maxLength={11}\n                      value={beneficiaryIfsc}''': '''                      type="text"\n                      maxLength={11}\n                      value={beneficiaryIfsc}''',
'''                    <label className="text-xs font-bold text-slate-700 dark:text-slate-300">\n                      Beneficiary UPI ID (VPA) <span className="text-rose-500">*</span>\n                    </label>''': '''                    <label className="text-xs font-bold text-slate-700 dark:text-slate-300">\n                      Beneficiary UPI ID (VPA)\n                    </label>''',
'''                      type="text"\n                      required\n                      value={upiId}''': '''                      type="text"\n                      value={upiId}''',
}
for a,b in repls.items():
    if a not in s:
        raise SystemExit('UI replacement not found: '+a[:80])
    s=s.replace(a,b,1)
p.write_text(s)

p = Path('components/business/dmt-self-beneficiary-enhancer.tsx')
s = p.read_text()
s = s.replace('observer.observe(document.body, { subtree: true, childList: true, characterData: true });', 'observer.observe(document.body, { subtree: true, childList: true });')
p.write_text(s)
PY

git config user.name 'github-actions[bot]'
git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
git add components/business/dmt-workspace.tsx components/business/dmt-self-beneficiary-enhancer.tsx
git diff --cached --check
git diff --cached --quiet || git commit -m 'fix(dmt): allow optional beneficiary details [dmt-repair]'
git push

# Remove this temporary workflow from the branch after the repair commit.
git rm .github/workflows/fix-dmt-live.yml
git commit -m 'chore: remove temporary DMT repair workflow [dmt-repair]'
git push