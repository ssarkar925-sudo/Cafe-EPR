name: Patch customer WhatsApp invoice PDF-only rollout

on:
  push:
    branches:
      - feat/customer-whatsapp-invoice-only-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/customer-whatsapp-invoice-only-v2
          fetch-depth: 0

      - name: Restore and patch invoice client
        shell: bash
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- components/invoices/invoices-client.tsx
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('components/invoices/invoices-client.tsx')
          t=p.read_text(encoding='utf-8')
          pattern=r'  function handleSendInvoiceWhatsApp\(inv: InvoiceRow\) \{[\s\S]*?\n  \}\n\n  function handleSendQuickSaleWhatsApp'
          repl='''  function handleSendInvoiceWhatsApp(inv: InvoiceRow) {
    const phone = inv.customers?.phone || "";
    setWaModal({ open: true, phone, name: inv.customers?.name || "Customer", msg: "", type: "pos_invoice", refNum: inv.invoice_number, refId: inv.id });
  }

  function handleSendQuickSaleWhatsApp'''
          t,n=re.subn(pattern,repl,t,count=1)
          if n!=1: raise SystemExit('invoice handler pattern not found')
          p.write_text(t,encoding='utf-8')
          PY

      - name: Patch WhatsApp automation and outbox
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/whatsapp.ts')
          t=p.read_text(encoding='utf-8')
          marker='''  const templates = config.templates || DEFAULT_WA_TEMPLATES;'''
          auto='''  // POS invoices are customer documents: dispatch exactly one PDF attachment, never the generic message template.
  if (event.type === "pos_invoice" && event.referenceId) {
    try {
      const response = await fetch("/api/whatsapp/send-invoice", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ invoiceId: event.referenceId, phone: event.phone }) });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.success) return { triggered: false, reason: result.error || "Failed to send customer invoice PDF." };
      return { triggered: true, messageId: result.messageId };
    } catch (error) {
      return { triggered: false, reason: error instanceof Error ? error.message : "Customer invoice PDF dispatch failed." };
    }
  }

'''
          if 'event.type === "pos_invoice" && event.referenceId' not in t:
              if marker not in t: raise SystemExit('automation marker not found')
              t=t.replace(marker,auto+marker,1)
          old='''      const sendRes = await fetch("/api/whatsapp/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          phone: msg.phone,
          message: msg.message_body,
          config,
        }),
      });

      const resData = await sendRes.json().catch(() => ({}));'''
          new='''      let sendRes;
      let resData;
      if (msg.message_type === "pos_invoice" && msg.reference_id) {
        sendRes = await fetch("/api/whatsapp/send-invoice", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ invoiceId: msg.reference_id, phone: msg.phone }) });
        resData = await sendRes.json().catch(() => ({}));
      } else {
        sendRes = await fetch("/api/whatsapp/send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone: msg.phone, message: msg.message_body, config }),
        });
        resData = await sendRes.json().catch(() => ({}));
      }'''
          if 'msg.message_type === "pos_invoice" && msg.reference_id' not in t:
              if old not in t: raise SystemExit('outbox block not found')
              t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')
          PY

      - name: Patch local WhatsApp gateway for PDF documents
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/whatsapp-gateway.js')
          t=p.read_text(encoding='utf-8')
          marker='''  // Send Message Endpoint\n'''
          block='''  // Customer invoice PDF document endpoint. Sends an actual PDF attachment and no text message.
  if ((urlPath === "/send-document" || urlPath === "/api/send-document") && req.method === "POST") {
    let body = "";
    req.on("data", (chunk) => { body += chunk.toString(); });
    req.on("end", async () => {
      try {
        const payload = JSON.parse(body || "{}");
        const phone = payload.phone || payload.number;
        const documentUrl = payload.documentUrl || payload.document;
        const fileName = payload.fileName || payload.filename || "Invoice.pdf";
        if (!phone || !documentUrl) { res.writeHead(400, { "Content-Type": "application/json" }); res.end(JSON.stringify({ success:false, error:"Phone and document URL are required." })); return; }
        const parsed = new URL(documentUrl);
        if (!["https:", "http:"].includes(parsed.protocol)) throw new Error("Document URL must be HTTP(S).");
        const jid = formatJid(phone);
        if (!isConnected || !sock) { res.writeHead(200, { "Content-Type":"application/json" }); res.end(JSON.stringify({ success:true, status:"dispatched_mock", to:jid })); return; }
        const fileRes = await fetch(documentUrl, { signal: AbortSignal.timeout(30000) });
        if (!fileRes.ok) throw new Error(`Invoice PDF endpoint returned HTTP ${fileRes.status}`);
        const contentType = (fileRes.headers.get("content-type") || "").toLowerCase();
        if (!contentType.includes("application/pdf")) throw new Error("Invoice endpoint did not return a PDF document.");
        const buffer = Buffer.from(await fileRes.arrayBuffer());
        if (buffer.length > 15 * 1024 * 1024) throw new Error("Invoice PDF exceeds 15 MB.");
        const sent = await sock.sendMessage(jid, { document: buffer, mimetype:"application/pdf", fileName });
        res.writeHead(200, { "Content-Type":"application/json" }); res.end(JSON.stringify({ success:true, status:"sent", to:jid, messageId:sent?.key?.id, type:"document" }));
      } catch (err) {
        res.writeHead(500, { "Content-Type":"application/json" }); res.end(JSON.stringify({ success:false, error:err.message }));
      }
    });
    return;
  }

'''
          if '/send-document' not in t:
              if marker not in t: raise SystemExit('gateway marker not found')
              t=t.replace(marker,block+marker,1)
          p.write_text(t,encoding='utf-8')
          PY

      - name: Add regression test
        shell: bash
        run: |
          cat > scripts/test-whatsapp-invoice-only.mjs <<'JS'
          import fs from "fs";
          const files = {
            invoiceClient: fs.readFileSync("./components/invoices/invoices-client.tsx","utf8"),
            modal: fs.readFileSync("./components/whatsapp/whatsapp-send-modal.tsx","utf8"),
            sendInvoice: fs.readFileSync("./app/api/whatsapp/send-invoice/route.ts","utf8"),
            pdfRoute: fs.readFileSync("./app/api/whatsapp/invoice/[id]/route.ts","utf8"),
            link: fs.readFileSync("./lib/customer-invoice-link.ts","utf8"),
            sender: fs.readFileSync("./lib/whatsapp-sender.ts","utf8"),
            whatsapp: fs.readFileSync("./lib/whatsapp.ts","utf8"),
            gateway: fs.readFileSync("./scripts/whatsapp-gateway.js","utf8"),
            pdf: fs.readFileSync("./components/pdf/invoice-pdf.tsx","utf8"),
            appA4: fs.readFileSync("./app/receipt/[id]/a4/page.tsx","utf8"),
            actions: fs.readFileSync("./components/pdf/a4-actions.tsx","utf8"),
          };
          const checks = [
            [files.invoiceClient.includes('type: "pos_invoice"') && files.invoiceClient.includes('msg: ""'), "invoice UI launches PDF-only mode"],
            [files.modal.includes('invoiceOnly = messageType === "pos_invoice"') && files.modal.includes('/api/whatsapp/send-invoice'), "invoice modal uses dedicated PDF dispatch"],
            [files.sendInvoice.includes('buildCustomerInvoiceUrl') && files.sendInvoice.includes('documentUrl'), "send endpoint builds customer PDF URL"],
            [files.pdfRoute.includes('verifyCustomerInvoiceToken') && files.pdfRoute.includes('Content-Type": "application/pdf"') && files.pdfRoute.includes('Content-Disposition'), "customer link returns signed downloadable PDF"],
            [files.link.includes('createHmac') && files.link.includes('TOKEN_TTL_SECONDS'), "customer invoice links are signed and expiring"],
            [files.sender.includes('type: "document"') && files.sender.includes('/send-document') && files.sender.includes('/messages/document'), "all configured providers support PDF documents"],
            [files.whatsapp.includes('event.type === "pos_invoice" && event.referenceId') && files.whatsapp.includes('msg.message_type === "pos_invoice" && msg.reference_id'), "manual automation and queued invoice sends use PDF-only route"],
            [files.gateway.includes('/send-document') && files.gateway.includes('mimetype:"application/pdf"') && files.gateway.includes('document: buffer'), "local gateway sends PDF attachment"],
            [files.pdf.includes('TAX INVOICE') && files.pdf.includes('Grand Total') && !files.pdf.includes('Portal Commission') && !files.pdf.includes('Net Operator Income'), "customer invoice PDF has no internal earnings"],
            [files.appA4.includes('A4Actions') && files.actions.includes('View Receipt (80mm)') && files.actions.includes('Print Invoice (A4)') && files.actions.includes('Download PDF'), "application user document controls remain available"],
          ];
          let failed=0;
          for (const [ok,label] of checks) { if(ok) console.log(`PASS: ${label}`); else { console.error(`FAIL: ${label}`); failed++; } }
          if (failed) process.exit(1);
          console.log(`PASS: ${checks.length}/${checks.length} customer WhatsApp invoice checks`);
          JS

      - name: Add test to Quality Gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/quality.yml')
          t=p.read_text(encoding='utf-8')
          if 'scripts/test-whatsapp-invoice-only.mjs' not in t:
              marker='      - name: AI browser safety'
              step='      - name: Customer WhatsApp invoice PDF-only checks\n        run: node scripts/test-whatsapp-invoice-only.mjs\n\n'
              if marker not in t: raise SystemExit('quality insertion marker not found')
              t=t.replace(marker,step+marker,1)
          p.write_text(t,encoding='utf-8')
          PY

      - name: Commit feature branch changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/invoices/invoices-client.tsx lib/whatsapp.ts scripts/whatsapp-gateway.js scripts/test-whatsapp-invoice-only.mjs .github/workflows/quality.yml
          git commit -m "Enforce customer WhatsApp invoice PDF-only delivery"
          git push origin feat/customer-whatsapp-invoice-only-v2
