name: Patch Quick Sale client

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Quick Sale component from last good commit
        run: git checkout 4857a9b5a2fe1440fadf5a9be0e092b550ece6e4 -- components/pos/quick-sale.tsx

      - name: Patch Quick Sale mutation transport
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/pos/quick-sale.tsx')
          s = p.read_text()
          old = '''      const { data, error: err } = await supabase.rpc("record_quick_sale", {\n        p_sale_date: today,\n        p_amount: 0,\n        p_cost: 0,\n        p_customer_id: customerId || null,\n        p_tendered: tendered,\n        p_payments: pmts,\n        p_items: items,\n      });\n      setBusy(false);\n      if (err) {\n        setError(err.message);\n        showToast("error", err.message || "Quick sale failed");\n        return;\n      }\n      sale = data as unknown as QuickSale;'''
          new = '''      const idempotencyKey =\n        typeof crypto !== "undefined" && typeof crypto.randomUUID === "function"\n          ? crypto.randomUUID()\n          : `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 14)}`;\n      try {\n        const response = await fetch("/api/pos/quick-sale", {\n          method: "POST",\n          headers: { "Content-Type": "application/json" },\n          credentials: "same-origin",\n          body: JSON.stringify({\n            p_sale_date: today,\n            p_amount: 0,\n            p_cost: 0,\n            p_customer_id: customerId || null,\n            p_tendered: tendered,\n            p_payments: pmts,\n            p_items: items,\n            p_idempotency_key: idempotencyKey,\n          }),\n        });\n        const payload = await response.json().catch(() => ({}));\n        setBusy(false);\n        if (!response.ok) {\n          const message = payload?.error || `Quick sale failed (HTTP ${response.status}).`;\n          setError(message);\n          showToast("error", message);\n          return;\n        }\n        sale = payload as QuickSale;\n      } catch (requestError: any) {\n        setBusy(false);\n        const message = requestError?.message || "Unable to reach the Quick Sale service.";\n        setError(message);\n        showToast("error", message);\n        return;\n      }'''
          if old not in s:
              raise SystemExit('Quick Sale RPC block not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit patch and remove workflow
        run: |
          rm -f .github/workflows/patch-quick-sale-client.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/pos/quick-sale.tsx .github/workflows/patch-quick-sale-client.yml
          git diff --cached --quiet || git commit -m 'fix(pos): route quick sale through authenticated server session'
          git push
