name: Fix Settings Navigator Layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[settings-layout-auto-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix settings navigator grid column
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/settings/settings-client.tsx')
          text = path.read_text(encoding='utf-8')
          old = 'className="min-w-0 space-y-4 lg:sticky lg:top-24 lg:max-h-[calc(100vh-7rem)] lg:overflow-y-auto lg:overflow-x-hidden lg:pr-2 lg:overscroll-contain lg:scrollbar-thin"'
          new = 'className="min-w-0 space-y-4 lg:col-span-4 xl:col-span-3 lg:sticky lg:top-24 lg:max-h-[calc(100vh-7rem)] lg:overflow-y-auto lg:overflow-x-hidden lg:pr-2 lg:overscroll-contain lg:scrollbar-thin"'
          if text.count(old) != 1:
              raise SystemExit(f'expected one settings navigator class, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          grep -Fq 'lg:col-span-4 xl:col-span-3 lg:sticky' components/settings/settings-client.tsx
      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/settings/settings-client.tsx
          git rm .github/workflows/fix-settings-layout.yml
          git commit -m "fix: restore full settings navigator width [settings-layout-auto-patch]"
          git push origin HEAD:main
