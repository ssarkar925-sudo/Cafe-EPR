name: V1 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: V1 foundation
        run: npm run test:v1-foundation
      - name: V1 shell
        run: npm run test:v1-phase2
      - name: V1 admin
        run: npm run test:v1-phase3
      - name: V1 design
        run: npm run test:v1-phase5
      - name: V1 POS step 1
        run: npm run test:v1-phase6-step1
      - name: V1 POS step 2
        run: npm run test:v1-phase6-step2
      - name: V1 POS step 3
        run: npm run test:v1-phase6-step3
      - name: V1 services
        run: npm run test:v1-services
      - name: V1 day close
        run: npm run test:v1-day-close
      - name: V1 back entry
        run: npm run test:v1-back-entry
      - name: V1 offline sync
        run: npm run test:v1-offline-sync
      - name: V1 thermal receipt
        run: node scripts/test-v1-thermal-receipt.mjs
      - name: V1 reports
        run: npm run test:v1-reports
      - name: Production build
        run: npm run build
