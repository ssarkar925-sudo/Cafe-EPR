name: Fix Settings Sidebar Collapse

'on':
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[settings-sidebar-collapse-auto-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove settings-only forced expansion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/dashboard-shell.tsx')
          text = path.read_text(encoding='utf-8')
          old_effect = '''  useEffect(() => {\n    // Keep the full navigation visible on System Settings.\n    if (pathname === "/settings") {\n      setCollapsed(false);\n      try {\n        localStorage.setItem(COLLAPSE_KEY, "0");\n      } catch {}\n      return;\n    }\n    try {\n      setCollapsed(localStorage.getItem(COLLAPSE_KEY) === "1");\n    } catch {}\n  }, [pathname]);'''
          new_effect = '''  useEffect(() => {\n    try {\n      setCollapsed(localStorage.getItem(COLLAPSE_KEY) === "1");\n    } catch {}\n  }, [pathname]);'''
          old_toggle = '''  function toggle() {\n    setCollapsed((c) => {\n      if (pathname === "/settings") return false;\n      const next = !c;\n      try {\n        localStorage.setItem(COLLAPSE_KEY, next ? "1" : "0");\n      } catch {}\n      return next;\n    });\n  }'''
          new_toggle = '''  function toggle() {\n    setCollapsed((c) => {\n      const next = !c;\n      try {\n        localStorage.setItem(COLLAPSE_KEY, next ? "1" : "0");\n      } catch {}\n      return next;\n    });\n  }'''
          if text.count(old_effect) != 1:
              raise SystemExit(f'expected one settings-specific effect, found {text.count(old_effect)}')
          if text.count(old_toggle) != 1:
              raise SystemExit(f'expected one settings-specific toggle, found {text.count(old_toggle)}')
          text = text.replace(old_effect, new_effect, 1)
          text = text.replace(old_toggle, new_toggle, 1)
          path.write_text(text, encoding='utf-8')
          PY
          grep -Fq 'localStorage.getItem(COLLAPSE_KEY) === "1"' components/dashboard-shell.tsx
          ! grep -Fq 'if (pathname === "/settings") return false;' components/dashboard-shell.tsx
          ! grep -Fq 'Keep the full navigation visible on System Settings.' components/dashboard-shell.tsx

      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/dashboard-shell.tsx
          git rm .github/workflows/fix-settings-sidebar.yml
          git commit -m "fix: restore sidebar collapse on settings [settings-sidebar-collapse-auto-patch]"
          git push origin HEAD:main
