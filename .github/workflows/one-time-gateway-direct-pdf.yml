name: one-time-gateway-direct-pdf
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Patch gateway source through GitHub API
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'scripts/whatsapp-gateway.js';
            const current = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
            const file = Array.isArray(current.data) ? current.data[0] : current.data;
            const source = Buffer.from(file.content, 'base64').toString('utf8');
            const startMarker = '        const documentUrl = payload.documentUrl || payload.document;';
            const endMarker = '        const sent = await sock.sendMessage(jid, {';
            const start = source.indexOf(startMarker);
            const end = source.indexOf(endMarker, start);
            if (start < 0 || end < 0) throw new Error('Gateway PDF block markers not found');
            if (source.includes('const documentBase64 = payload.documentBase64 || payload.pdfBase64 || "";')) {
              core.info('Gateway already accepts direct PDF payload; nothing to commit.');
              return;
            }
            const replacement = `        const documentUrl = payload.documentUrl || payload.document;\n        const documentBase64 = payload.documentBase64 || payload.pdfBase64 || "";\n        const fileName = String(payload.fileName || payload.filename || "Invoice.pdf").replace(/[^a-zA-Z0-9._-]/g, "_");\n\n        if (!phone || (!documentUrl && !documentBase64)) {\n          res.writeHead(400, { "Content-Type": "application/json" });\n          res.end(JSON.stringify({ success: false, error: "Phone and invoice PDF content are required." }));\n          return;\n        }\n\n        const jid = formatJid(phone);\n\n        if (!isConnected || !sock) {\n          res.writeHead(200, { "Content-Type": "application/json" });\n          res.end(JSON.stringify({ success: true, status: "dispatched_mock", note: "Gateway active, scan QR at http://localhost:3001 to deliver live to WhatsApp", to: jid, type: "document" }));\n          return;\n        }\n\n        let buffer;\n        if (documentBase64) {\n          const encoded = String(documentBase64).trim().replace(/^data:application\\/pdf;base64,/, "");\n          buffer = Buffer.from(encoded, "base64");\n        } else {\n          let parsedUrl;\n          try {\n            parsedUrl = new URL(documentUrl);\n            if (!["https:", "http:"].includes(parsedUrl.protocol)) throw new Error("Unsupported document URL protocol");\n          } catch {\n            res.writeHead(400, { "Content-Type": "application/json" });\n            res.end(JSON.stringify({ success: false, error: "Document URL must be HTTP(S)." }));\n            return;\n          }\n          const fileRes = await fetch(parsedUrl, { signal: AbortSignal.timeout(30000) });\n          if (!fileRes.ok) throw new Error(\`Invoice PDF endpoint returned HTTP \${fileRes.status}\`);\n          const contentType = (fileRes.headers.get("content-type") || "").toLowerCase();\n          if (!contentType.includes("application/pdf")) throw new Error("Invoice endpoint did not return an application/pdf document.");\n          const contentLength = Number(fileRes.headers.get("content-length") || 0);\n          if (contentLength > 15 * 1024 * 1024) throw new Error("Invoice PDF exceeds 15 MB.");\n          buffer = Buffer.from(await fileRes.arrayBuffer());\n        }\n\n        if (!buffer?.length) throw new Error("Invoice PDF is empty.");\n        if (buffer.length > 15 * 1024 * 1024) throw new Error("Invoice PDF exceeds 15 MB.");\n        if (buffer.subarray(0, 5).toString("ascii") !== "%PDF-") throw new Error("Generated invoice payload is not a valid PDF.");\n\n`;
            const patched = source.slice(0, start) + replacement + source.slice(end);
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: 'fix(gateway): accept direct PDF payload',
              content: Buffer.from(patched, 'utf8').toString('base64'),
              sha: file.sha,
              branch: 'main',
            });
            core.info('Committed direct PDF payload support to scripts/whatsapp-gateway.js');
