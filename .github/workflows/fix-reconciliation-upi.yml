name: Fix UPI reconciliation

'on':
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Add safe UPI reconciliation fix workflow')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch reconciliation logic
        shell: python
        run: |
          from pathlib import Path
          import re

          client = Path('components/finance/reconciliation-client.tsx')
          text = client.read_text(encoding='utf-8')

          text = text.replace(
              'supabase.from("cash_entries").select("id, instrument_id, direction, amount, created_at, remarks, method, ref_type").not("instrument_id", "is", null)',
              'supabase.from("cash_entries").select("id, instrument_id, direction, amount, created_at, description, method, ref_type, ref_id").not("instrument_id", "is", null)'
          )
          text = text.replace('e.remarks || "Direct cashbook adjustment"', 'e.description || "Direct cashbook adjustment"')
          text = text.replace('e.remarks || "Direct cashbook posting"', 'e.description || "Direct cashbook posting"')

          pattern = re.compile(r'      if \(cfg\.key === "upi_qr"\) \{.*?\n      \} else \{', re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('UPI reconciliation block not found; refusing to patch.')

          new_block = '''      if (cfg.key === "upi_qr") {
        // UPI QR is an instrument-backed pool. Its balance is refreshed from the
        // instrument-linked cash-entry trail, so reconcile from that same trail
        // rather than re-adding transaction and settlement shadows.
        const upiInstrumentIds = new Set(
          instruments
            .filter((inst) => inst.is_active && ["upi", "upi_qr"].includes(String(inst.type).toLowerCase()))
            .map((inst) => inst.id)
        );

        const transactionEntryIds = new Set<string>();
        const settlementEntryIds = new Set<string>();

        for (const e of cashEntries) {
          if (!e.instrument_id || !upiInstrumentIds.has(e.instrument_id)) continue;

          const amt = e.direction === "out" ? -Number(e.amount || 0) : Number(e.amount || 0);
          if (!Number.isFinite(amt) || Math.abs(amt) <= 0.005) continue;

          if (e.ref_type === "transaction" && e.ref_id) transactionEntryIds.add(e.ref_id);
          if (e.ref_type === "settlement" && e.ref_id) settlementEntryIds.add(e.ref_id);

          if (amt > 0) credits += amt;
          else debits += Math.abs(amt);

          const isFee = e.ref_type === "transaction" && /fee received/i.test(String(e.description || ""));
          if (isFee && amt > 0) fees += amt;

          if (e.ref_type === "settlement") {
            if (e.direction === "in") setsIn += Number(e.amount || 0);
            else setsOut += Number(e.amount || 0);
          } else {
            otherMovements += amt;
          }

          txList.push({
            id: e.id,
            number: e.ref_type === "transaction" ? "TRANSACTION" : e.ref_type === "settlement" ? "SETTLEMENT" : "ENTRY",
            type: e.ref_type === "settlement"
              ? (e.direction === "out" ? "Settlement Out" : "Settlement In")
              : (e.direction === "out" ? "Debit Entry" : "Credit Entry"),
            amount: amt,
            date: e.created_at,
            desc: e.description || "UPI instrument movement",
          });
        }

        // Defensive fallback: surface a settlement/transaction only when it has
        // no instrument-linked cash entry. This detects a broken money trail
        // instead of silently hiding it, while preventing duplicate counting.
        for (const s of settlements) {
          const amt = Number(s.amount || 0);
          if (!Number.isFinite(amt) || amt <= 0) continue;

          const sourceIsUpi = !!s.source_instrument_id && upiInstrumentIds.has(s.source_instrument_id);
          const destIsUpi = !!s.dest_instrument_id && upiInstrumentIds.has(s.dest_instrument_id);

          if (sourceIsUpi && !settlementEntryIds.has(s.id)) {
            debits += amt;
            setsOut += amt;
            txList.push({
              id: `settlement-missing-entry-${s.id}`,
              number: s.settlement_number || "SETTLEMENT",
              type: "Settlement Out (Missing Entry)",
              amount: -amt,
              date: s.created_at,
              desc: "Settlement references UPI, but no instrument cash entry exists",
            });
          }
          if (destIsUpi && !settlementEntryIds.has(s.id)) {
            credits += amt;
            setsIn += amt;
            txList.push({
              id: `settlement-missing-entry-${s.id}-in`,
              number: s.settlement_number || "SETTLEMENT",
              type: "Settlement In (Missing Entry)",
              amount: amt,
              date: s.created_at,
              desc: "Settlement references UPI, but no instrument cash entry exists",
            });
          }
        }

        for (const t of transactions) {
          if (!t.id || transactionEntryIds.has(t.id)) continue;
          if (!(t.pool_credit_type === "upi_qr" || t.service_type === "upi")) continue;

          const pCredit = Number(t.pool_credit || 0);
          const pOut = Number(t.pool_out || 0);
          const uFee = Number(t.upi_fee || 0);
          if (pCredit > 0) {
            credits += pCredit;
            txList.push({
              id: `transaction-missing-entry-${t.id}`,
              number: t.transaction_number || "TXN",
              type: "QR Credit (Missing Entry)",
              amount: pCredit,
              date: t.created_at,
              desc: "Transaction carries a UPI pool credit without an instrument cash entry",
            });
          }
          if (pOut > 0) {
            debits += pOut;
            txList.push({
              id: `transaction-missing-entry-${t.id}-out`,
              number: t.transaction_number || "TXN",
              type: "Outflow (Missing Entry)",
              amount: -pOut,
              date: t.created_at,
              desc: "Transaction carries a UPI pool outflow without an instrument cash entry",
            });
          }
          if (uFee > 0) fees += uFee;
        }
      } else {'''

          text = text[:match.start()] + new_block + text[match.end():]

          old_calc = '''      const calculatedBal =
        cfg.key === "upi_qr"
          ? openingBal + credits - debits + fees + otherMovements + setsIn - setsOut
          : openingBal + poolEntry.movements;'''
          new_calc = '''      const calculatedBal =
        cfg.key === "upi_qr"
          ? openingBal + credits - debits
          : openingBal + poolEntry.movements;'''
          if old_calc not in text:
              raise SystemExit('Expected calculated balance expression not found.')
          text = text.replace(old_calc, new_calc)

          client.write_text(text, encoding='utf-8')

          page = Path('app/(dashboard)/finance/reconciliation/page.tsx')
          ptext = page.read_text(encoding='utf-8')
          ptext = ptext.replace(
              'select("id,instrument_id,direction,amount,created_at,entry_date,remarks,description,method,ref_type,ref_id")',
              'select("id,instrument_id,direction,amount,created_at,entry_date,description,method,ref_type,ref_id")'
          )
          page.write_text(ptext, encoding='utf-8')

          # Validate that no invalid cash_entries column is referenced in these files.
          for p in (client, page):
              body = p.read_text(encoding='utf-8')
              if 'cash_entries"' in body and '.remarks' in body:
                  raise SystemExit(f'Invalid cash_entries remarks reference remains in {p}')
      - name: Commit patch and remove workflow
        run: |
          rm -f .github/workflows/fix-reconciliation-upi.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'components/finance/reconciliation-client.tsx' 'app/(dashboard)/finance/reconciliation/page.tsx' .github/workflows/fix-reconciliation-upi.yml
          git commit -m "Fix UPI QR reconciliation double counting"
          git push
