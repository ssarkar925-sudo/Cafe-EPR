name: Finish Quick POS Actions

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply quick POS action layout
        run: python3 scripts/finish_quick_pos.py
