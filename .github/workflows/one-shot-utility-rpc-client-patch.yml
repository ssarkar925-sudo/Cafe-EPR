name: One-shot utility RPC client patch

on:
  push:
    branches: [chore/financial-hardening-final]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'chore: route utility bill client through canonical RPC') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch utility bill financial writes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("components/business/utility-bill-workspace.tsx")
          s = p.read_text()
          if "CANONICAL_UTILITY_BILL_RPC_V1" in s:
              raise SystemExit(0)
          payment = r'''      // CANONICAL_UTILITY_BILL_RPC_V1
          // All financial mutation is owned by the SECURITY DEFINER RPC. The browser
          // never inserts transactions/cash entries or mutates customer balances here.
          const customerAllocations = customerPaymentAllocations.filter((row) => Number(row.amount) > 0);
          const effectiveCustomerMethod = customerCollectionAmount > 0
            ? (customerAllocations.length === 1 ? customerAllocations[0].method : (customerPayMethod === "due" ? "cash" : customerPayMethod))
            : "due";

          const { data: paymentResult, error: paymentError } = await supabase.rpc("record_bill_payment", {
            p_transaction_date: todayDate,
            p_transaction_timestamp: todayIso,
            p_customer_id: selectedCustomerId || null,
            p_customer_mobile: customerMobile.replace(/\D/g, "") || null,
            p_reference: `${reference.trim() || consumerId.trim()}-${txnNumber}`,
            p_remarks: remarks.trim() || `${currentCategory.name} - ${billerName} (${consumerId.trim()})`,
            p_status: "success",
            p_amount: billAmount,
            p_service_fee: custFee,
            p_portal_commission: commissionEarned,
            p_pay_from_instrument_id: fundingInstId,
            p_pay_from_method: selectedFundingAccount.type,
            p_customer_pay_method: effectiveCustomerMethod,
            p_customer_collection_instrument_id: customerAllocations.length === 1 ? (selectedCustomerPaymentAccount?.id || null) : null,
            p_customer_payment_allocations: customerAllocations,
          });
          if (paymentError) throw paymentError;
          const createdTxnId = paymentResult?.id;
          if (!createdTxnId) throw new Error("Canonical bill-payment RPC returned no transaction id.");
          const { data: newTxn, error: loadTxnError } = await supabase
            .from("transactions")
            .select(`*, customers(name, phone), profiles(full_name)`)
            .eq("id", createdTxnId)
            .single();
          if (loadTxnError || !newTxn) throw loadTxnError || new Error("Bill payment was posted but could not be loaded.");

          // 5. Audit Trail Logging
'''
          s2, n = re.subn(r'      // 2\. Post to Canonical transactions Table.*?      // 5\. Audit Trail Logging\n', payment, s, count=1, flags=re.S)
          if n != 1: raise SystemExit("payment block marker not found")
          s3, n = re.subn(r'      // Offset cash entries.*?\n      setTransactions\(\(prev\) =>', '      setTransactions((prev) =>', s2, count=1, flags=re.S)
          if n != 1: raise SystemExit("reversal direct-write block marker not found")
          p.write_text(s3)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/business/utility-bill-workspace.tsx
          git diff --cached --check
          git commit -m "chore: route utility bill client through canonical RPC"
          git push
