name: TEMP customer WhatsApp invoice PDF-only patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'TEMP customer WhatsApp invoice patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Write customer invoice PDF infrastructure
        shell: bash
        run: |
          mkdir -p 'app/api/whatsapp/invoice/[id]' 'app/api/whatsapp/send-invoice' components/pdf
          cat > lib/customer-invoice-link.ts <<'TS'
          import { createHmac, timingSafeEqual } from "crypto";

          const TOKEN_TTL_SECONDS = 15 * 60;

          function getSecret(): string {
            const value = process.env.CUSTOMER_DOCUMENT_SECRET || process.env.SUPABASE_SERVICE_ROLE_KEY || "";
            if (!value) throw new Error("Customer invoice document secret is not configured.");
            return value;
          }

          function signPayload(payload: string): string {
            return createHmac("sha256", getSecret()).update(payload).digest("base64url");
          }

          export function createCustomerInvoiceToken(invoiceId: string, expiresAt = Math.floor(Date.now() / 1000) + TOKEN_TTL_SECONDS): string {
            return `${expiresAt}.${signPayload(`${invoiceId}.${expiresAt}`)}`;
          }

          export function verifyCustomerInvoiceToken(invoiceId: string, token: string): boolean {
            const [expiresRaw, signature] = String(token || "").split(".");
            const expiresAt = Number(expiresRaw);
            if (!Number.isInteger(expiresAt) || expiresAt < Math.floor(Date.now() / 1000) || !signature) return false;
            let expected: Buffer;
            try { expected = Buffer.from(signPayload(`${invoiceId}.${expiresAt}`)); } catch { return false; }
            const actual = Buffer.from(signature);
            return expected.length === actual.length && timingSafeEqual(expected, actual);
          }

          export function buildCustomerInvoiceUrl(origin: string, invoiceId: string, expiresAt = Math.floor(Date.now() / 1000) + TOKEN_TTL_SECONDS): string {
            return `${origin.replace(/\/$/, "")}/api/whatsapp/invoice/${encodeURIComponent(invoiceId)}?token=${encodeURIComponent(createCustomerInvoiceToken(invoiceId, expiresAt))}`;
          }
          TS

          cat > components/pdf/customer-invoice-pdf.tsx <<'TSX'
          import { Document, Page, Text, View, StyleSheet } from "@react-pdf/renderer";
          import { numberToWordsInr } from "@/lib/format";

          const styles = StyleSheet.create({
            page: { padding: 32, fontSize: 9, color: "#0f172a", fontFamily: "Helvetica" },
            header: { flexDirection: "row", justifyContent: "space-between", borderBottom: "1.5", borderBottomColor: "#cbd5e1", paddingBottom: 12, marginBottom: 14 },
            shopName: { fontSize: 17, fontWeight: "bold" },
            small: { fontSize: 8, color: "#475569", marginTop: 2 },
            title: { fontSize: 16, fontWeight: "bold" },
            cardRow: { flexDirection: "row", gap: 10, marginBottom: 14 },
            card: { flex: 1, padding: 9, backgroundColor: "#f8fafc", border: "0.5", borderColor: "#e2e8f0", borderRadius: 4 },
            label: { fontSize: 7, fontWeight: "bold", color: "#64748b", textTransform: "uppercase", marginBottom: 3 },
            value: { fontSize: 9, fontWeight: "bold" },
            tableHead: { flexDirection: "row", backgroundColor: "#0f172a", color: "#fff", fontSize: 8, fontWeight: "bold" },
            row: { flexDirection: "row", borderBottom: "0.5", borderBottomColor: "#e2e8f0", fontSize: 8, paddingVertical: 5 },
            colNo: { width: 28, textAlign: "center" },
            colDesc: { flex: 1 },
            colQty: { width: 50, textAlign: "center" },
            colRate: { width: 75, textAlign: "right" },
            colAmt: { width: 85, textAlign: "right" },
            summary: { alignSelf: "flex-end", width: 250, marginTop: 12, padding: 10, backgroundColor: "#f8fafc", border: "0.5", borderColor: "#cbd5e1", borderRadius: 4 },
            summaryRow: { flexDirection: "row", justifyContent: "space-between", paddingVertical: 3, fontSize: 8.5 },
            totalRow: { flexDirection: "row", justifyContent: "space-between", backgroundColor: "#0f172a", color: "#fff", padding: 7, marginTop: 4, borderRadius: 3, fontWeight: "bold", fontSize: 10 },
            dueRow: { flexDirection: "row", justifyContent: "space-between", paddingVertical: 4, color: "#b45309", fontWeight: "bold", fontSize: 9 },
            footer: { marginTop: 22, borderTop: "0.5", borderTopColor: "#e2e8f0", paddingTop: 7, textAlign: "center", color: "#64748b", fontSize: 7.5 },
          });

          export default function CustomerInvoicePdf({ invoice, items, payments, settings }: { invoice: any; items: any[]; payments: any[]; settings: any }) {
            const cur = settings?.currency_symbol === "₹" ? "Rs. " : `${settings?.currency_symbol || "Rs."} `;
            const money = (n: any) => cur + Number(n || 0).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            const isDue = Number(invoice.due || 0) > 0 && invoice.status !== "cancelled";
            return (
              <Document title={`Invoice ${invoice.invoice_number}`} author={settings?.shop_name || "Shop"}>
                <Page size="A4" style={styles.page}>
                  <View style={styles.header}>
                    <View>
                      <Text style={styles.shopName}>{settings?.shop_name || "Sarkar Communication"}</Text>
                      {settings?.address && <Text style={styles.small}>{settings.address}</Text>}
                      {settings?.phone && <Text style={styles.small}>Ph: {settings.phone}</Text>}
                      {settings?.email && <Text style={styles.small}>Email: {settings.email}</Text>}
                      {settings?.tax_id && <Text style={styles.small}>GSTIN / Tax ID: {settings.tax_id}</Text>}
                    </View>
                    <View style={{ alignItems: "flex-end" }}>
                      <Text style={styles.title}>TAX INVOICE</Text>
                      <Text style={styles.small}>#{invoice.invoice_number}</Text>
                      <Text style={styles.small}>Date: {invoice.invoice_date}</Text>
                      <Text style={{ ...styles.small, fontWeight: "bold", color: isDue ? "#b45309" : "#15803d" }}>{isDue ? `BALANCE DUE: ${money(invoice.due)}` : "FULLY PAID"}</Text>
                    </View>
                  </View>

                  <View style={styles.cardRow}>
                    <View style={styles.card}>
                      <Text style={styles.label}>Billed To</Text>
                      <Text style={styles.value}>{invoice.customers?.name || "Walk-in Customer"}</Text>
                      {invoice.customers?.phone && <Text style={styles.small}>Phone: {invoice.customers.phone}</Text>}
                      {invoice.customers?.address && <Text style={styles.small}>{invoice.customers.address}</Text>}
                      {invoice.customers?.code && <Text style={styles.small}>Customer ID: {invoice.customers.code}</Text>}
                    </View>
                    <View style={styles.card}>
                      <Text style={styles.label}>Invoice Status</Text>
                      <Text style={styles.value}>{String(invoice.status || "completed").toUpperCase()}</Text>
                      <Text style={styles.small}>Payment Mode: {payments?.length ? payments.map((p: any) => String(p.method).toUpperCase()).join(", ") : "CASH"}</Text>
                    </View>
                  </View>

                  <View>
                    <View style={styles.tableHead}>
                      <Text style={{ ...styles.colNo, paddingVertical: 5 }}>#</Text>
                      <Text style={{ ...styles.colDesc, paddingVertical: 5 }}>Item Description</Text>
                      <Text style={{ ...styles.colQty, paddingVertical: 5 }}>Qty</Text>
                      <Text style={{ ...styles.colRate, paddingVertical: 5 }}>Rate</Text>
                      <Text style={{ ...styles.colAmt, paddingVertical: 5 }}>Amount</Text>
                    </View>
                    {items?.map((it: any, idx: number) => {
                      const name = it.products?.name || it.services?.name || it.description || "Item";
                      return <View key={it.id || idx} style={styles.row}><Text style={styles.colNo}>{idx + 1}</Text><Text style={styles.colDesc}>{name}</Text><Text style={styles.colQty}>{Number(it.qty || 0)}</Text><Text style={styles.colRate}>{money(it.rate)}</Text><Text style={{ ...styles.colAmt, fontWeight: "bold" }}>{money(it.amount)}</Text></View>;
                    })}
                    {(!items || items.length === 0) && <View style={styles.row}><Text style={{ flex: 1, textAlign: "center", color: "#94a3b8" }}>No line items recorded</Text></View>}
                  </View>

                  <View style={styles.summary}>
                    <View style={styles.summaryRow}><Text>Subtotal</Text><Text>{money(invoice.subtotal)}</Text></View>
                    {Number(invoice.discount || 0) > 0 && <View style={styles.summaryRow}><Text>Discount</Text><Text>- {money(invoice.discount)}</Text></View>}
                    <View style={styles.totalRow}><Text>Grand Total</Text><Text>{money(invoice.total)}</Text></View>
                    <View style={styles.summaryRow}><Text>Amount Paid</Text><Text>{money(invoice.paid)}</Text></View>
                    {isDue && <View style={styles.dueRow}><Text>Balance Outstanding</Text><Text>{money(invoice.due)}</Text></View>}
                  </View>

                  <Text style={{ ...styles.small, marginTop: 12 }}>Amount in Words: {numberToWordsInr(Number(invoice.total))}</Text>
                  <View style={styles.footer}><Text>{settings?.receipt_footer || "Thank you for your business."}</Text></View>
                </Page>
              </Document>
            );
          }
          TSX

          cat > lib/whatsapp-document.ts <<'TS'
          import { formatWhatsAppPhone } from "@/lib/whatsapp-shared";
          import type { WhatsAppConfig } from "@/lib/whatsapp-shared";

          export async function sendCustomerInvoicePdf(phone: string, config: WhatsAppConfig, documentUrl: string, filename: string) {
            if (!phone || !documentUrl) return { success: false, error: "Phone and invoice PDF URL are required.", status: 400 };
            if (!config || config.provider === "off") return { success: false, error: "WhatsApp integration is not enabled in Settings.", status: 400 };
            const to = formatWhatsAppPhone(phone);
            if (!to || to.length < 10) return { success: false, error: "Invalid recipient phone number format.", status: 400 };

            if (config.provider === "meta") {
              const phoneId = config.meta_phone_number_id?.trim();
              const token = config.meta_access_token?.trim();
              if (!phoneId || !token) return { success: false, error: "Meta Phone Number ID and Access Token are required.", status: 400 };
              const res = await fetch(`https://graph.facebook.com/v21.0/${encodeURIComponent(phoneId)}/messages`, { method:"POST", headers:{Authorization:`Bearer ${token}`,"Content-Type":"application/json"}, body:JSON.stringify({messaging_product:"whatsapp",recipient_type:"individual",to,type:"document",document:{link:documentUrl,filename}}), signal:AbortSignal.timeout(15000) });
              const data = await res.json().catch(()=>({}));
              if (!res.ok) return { success:false,error:data?.error?.message||"Meta WhatsApp document send failed.",status:400,data };
              return { success:true,provider:"meta",messageId:data?.messages?.[0]?.id,data };
            }

            if (config.provider === "local_gateway") {
              const gatewayUrl = String(config.gateway_url || "").replace(/\/$/, "");
              if (!gatewayUrl) return { success:false,error:"WhatsApp gateway URL is missing.",status:400 };
              const res = await fetch(`${gatewayUrl}/send-document`, { method:"POST", headers:{"Content-Type":"application/json","Bypass-Tunnel-Reminder":"true",...(config.gateway_api_key?{"x-api-key":config.gateway_api_key}:{})}, body:JSON.stringify({phone,documentUrl,fileName:filename}), signal:AbortSignal.timeout(60000) });
              const data = await res.json().catch(()=>({}));
              if (!res.ok || data?.success === false) return { success:false,error:data?.error||"WhatsApp gateway document send failed.",status:res.status||400,data };
              if (data?.status === "dispatched_mock") return { success:false,error:"WhatsApp gateway is not linked yet. Scan the QR code first.",status:400 };
              return { success:true,provider:"local_gateway",messageId:data?.messageId,data };
            }

            if (config.provider === "ultramsg") {
              const instanceId = config.ultramsg_instance_id?.trim();
              const token = config.ultramsg_token?.trim();
              if (!instanceId || !token) return { success:false,error:"UltraMsg Instance ID and Token are required.",status:400 };
              const params = new URLSearchParams({token,to,filename,document:documentUrl});
              const res = await fetch(`https://api.ultramsg.com/${encodeURIComponent(instanceId)}/messages/document`, { method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:params.toString(),signal:AbortSignal.timeout(15000) });
              const data = await res.json().catch(()=>({}));
              if (!res.ok || data?.error) return { success:false,error:data?.error||"UltraMsg document send failed.",status:400,data };
              return { success:true,provider:"ultramsg",messageId:data?.id||data?.messageId,data };
            }
            return { success:false,error:"Unknown WhatsApp provider.",status:400 };
          }
          TS

          cat > 'app/api/whatsapp/invoice/[id]/route.ts' <<'TS'
          import { NextResponse } from "next/server";
          import { createElement } from "react";
          import { renderToBuffer } from "@react-pdf/renderer";
          import { createAdminClient } from "@/lib/supabase/admin";
          import CustomerInvoicePdf from "@/components/pdf/customer-invoice-pdf";
          import { verifyCustomerInvoiceToken } from "@/lib/customer-invoice-link";

          export const runtime = "nodejs";
          export const dynamic = "force-dynamic";

          export async function GET(req: Request, { params }: { params: Promise<{ id: string }> }) {
            try {
              const { id } = await params;
              const token = new URL(req.url).searchParams.get("token") || "";
              if (!id || !verifyCustomerInvoiceToken(id, token)) return new NextResponse("Invalid or expired invoice link.",{status:404});
              const db = createAdminClient();
              const { data: invoice, error: invoiceError } = await db.from("invoices").select("*, customers(name, phone, address, code)").eq("id", id).maybeSingle();
              if (invoiceError || !invoice) return new NextResponse("Invoice not found.",{status:404});
              const [{data:items},{data:payments},{data:settings}] = await Promise.all([
                db.from("invoice_items").select("*, products(name, code), services(name)").eq("invoice_id",id).order("created_at",{ascending:true}),
                db.from("payments").select("id,method,amount,received_at").eq("invoice_id",id).order("received_at",{ascending:true}),
                db.from("settings").select("*").single(),
              ]);
              const pdf = await renderToBuffer(createElement(CustomerInvoicePdf,{invoice,items:(items||[]) as any[],payments:(payments||[]) as any[],settings}));
              return new NextResponse(pdf as unknown as BodyInit,{status:200,headers:{"Content-Type":"application/pdf","Content-Disposition":`attachment; filename="Invoice-${invoice.invoice_number}.pdf"`,"Cache-Control":"private, no-store, max-age=0","X-Content-Type-Options":"nosniff"}});
            } catch (error:any) {
              console.error("Customer invoice PDF error:",error);
              return new NextResponse("Unable to generate invoice PDF.",{status:500});
            }
          }
          TS

          cat > 'app/api/whatsapp/send-invoice/route.ts' <<'TS'
          import { NextResponse } from "next/server";
          import { getUserRole, hasRole } from "@/lib/authz";
          import { createAdminClient } from "@/lib/supabase/admin";
          import { buildCustomerInvoiceUrl } from "@/lib/customer-invoice-link";
          import { getServerWhatsAppConfig } from "@/lib/whatsapp-sender";
          import { sendCustomerInvoicePdf } from "@/lib/whatsapp-document";

          export const runtime = "nodejs";

          export async function POST(req: Request) {
            try {
              const role = await getUserRole();
              if (!hasRole(role,["admin","manager","staff"])) return NextResponse.json({success:false,error:"Forbidden"},{status:403});
              const body = await req.json().catch(()=>({}));
              const invoiceId=String(body?.invoiceId||"").trim();
              const phone=String(body?.phone||"").trim();
              if(!invoiceId||!phone) return NextResponse.json({success:false,error:"Invoice ID and recipient phone are required."},{status:400});
              const db=createAdminClient();
              const {data:invoice,error}=await db.from("invoices").select("id,invoice_number").eq("id",invoiceId).maybeSingle();
              if(error||!invoice) return NextResponse.json({success:false,error:"Invoice not found."},{status:404});
              const origin=new URL(req.url).origin;
              const documentUrl=buildCustomerInvoiceUrl(origin,invoice.id);
              const result=await sendCustomerInvoicePdf(phone,await getServerWhatsAppConfig(),documentUrl,`Invoice-${invoice.invoice_number}.pdf`);
              if(!result.success) return NextResponse.json({success:false,error:result.error||"Failed to send invoice PDF."},{status:result.status||400});
              return NextResponse.json({success:true,provider:result.provider,messageId:result.messageId,invoiceId:invoice.id,invoiceNumber:invoice.invoice_number,documentUrl});
            }catch(error:any){return NextResponse.json({success:false,error:error?.message||"Internal server error."},{status:500});}
          }
          TS

      - name: Patch invoice WhatsApp modal and launcher
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('components/invoices/invoices-client.tsx')
          t=p.read_text(encoding='utf-8')
          pattern=r'  function handleSendInvoiceWhatsApp\(inv: InvoiceRow\) \{[\s\S]*?\n  \}\n\n  function handleSendQuickSaleWhatsApp'
          replacement='''  function handleSendInvoiceWhatsApp(inv: InvoiceRow) {
    const phone = inv.customers?.phone || "";
    setWaModal({ open: true, phone, name: inv.customers?.name || "Customer", msg: "", type: "pos_invoice", refNum: inv.invoice_number, refId: inv.id });
  }

  function handleSendQuickSaleWhatsApp'''
          t,n=re.subn(pattern,replacement,t,count=1)
          if n!=1: raise SystemExit('invoice WhatsApp launcher not found')
          p.write_text(t,encoding='utf-8')
          PY

          cat > components/whatsapp/whatsapp-send-modal.tsx <<'TSX'
          "use client";

          import { useEffect, useState } from "react";
          import Modal from "@/components/ui/modal";
          import { getDirectWhatsAppUrl, getWhatsAppConfig, sendWhatsAppMessage, type WhatsAppLogEntry } from "@/lib/whatsapp";

          type Props = { open:boolean; onClose:()=>void; phone:string; recipientName?:string; initialMessage:string; messageType?:WhatsAppLogEntry["message_type"]; refId?:string; refNumber?:string; onSent?:()=>void };

          export default function WhatsAppSendModal({open,onClose,phone:initialPhone,recipientName,initialMessage,messageType="custom",refId,refNumber,onSent}:Props){
            const [phone,setPhone]=useState(initialPhone); const [message,setMessage]=useState(initialMessage); const [status,setStatus]=useState<"idle"|"sending"|"success"|"error">("idle"); const [errorMsg,setErrorMsg]=useState(""); const config=getWhatsAppConfig(); const invoiceOnly=messageType==="pos_invoice"&&Boolean(refId);
            /* eslint-disable react-hooks/set-state-in-effect */
            useEffect(()=>{setPhone(initialPhone);setMessage(initialMessage);setStatus("idle");setErrorMsg("");},[open,initialPhone,initialMessage]);
            /* eslint-enable react-hooks/set-state-in-effect */
            if(!open)return null;
            async function handleSend(){
              if(!phone.trim()){setErrorMsg("Recipient phone number is required.");setStatus("error");return;}
              setStatus("sending");setErrorMsg("");
              try{
                if(invoiceOnly){
                  const response=await fetch("/api/whatsapp/send-invoice",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({invoiceId:refId,phone:phone.trim()})});
                  const res=await response.json().catch(()=>({}));
                  if(!response.ok||!res.success)throw new Error(res.error||"Failed to send invoice PDF.");
                }else{
                  if(!message.trim())throw new Error("Phone number and message text cannot be empty.");
                  const res=await sendWhatsAppMessage({phone:phone.trim(),message:message.trim(),recipientName:recipientName||null,messageType,refId:refId||null,refNumber:refNumber||null});
                  if(!res.ok)throw new Error(res.error||"Failed to dispatch via gateway.");
                }
                setStatus("success");onSent?.();setTimeout(()=>onClose(),1400);
              }catch(error){setStatus("error");setErrorMsg(error instanceof Error?error.message:"Failed to send WhatsApp message.");}
            }
            function handleOpenDirectWhatsApp(){const url=getDirectWhatsAppUrl(phone,message);window.open(url,"_blank","noopener");onClose();}
            return <Modal onClose={onClose} title={invoiceOnly?"Send Invoice PDF via WhatsApp":"Send WhatsApp Message"} subtitle={recipientName?`Recipient: ${recipientName}`:undefined} accent="emerald" size="lg">
              <div className="space-y-4 p-6">
                <div><label className="mb-1 block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Recipient Mobile Number</label><div className="flex items-center gap-2"><span className="flex h-10 items-center rounded-xl border border-slate-200 bg-slate-100 px-3 text-xs font-bold text-slate-600 dark:border-white/10 dark:bg-slate-800 dark:text-slate-300">🇮🇳 +91</span><input type="text" value={phone} onChange={e=>setPhone(e.target.value)} placeholder="e.g. 9876543210" className="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-900 outline-none transition focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 dark:border-white/10 dark:bg-slate-900 dark:text-slate-100"/></div></div>
                {invoiceOnly?<div className="rounded-2xl border border-emerald-200 bg-emerald-50 p-4 dark:border-emerald-900/40 dark:bg-emerald-950/20"><div className="flex items-center gap-3"><div className="flex h-11 w-11 items-center justify-center rounded-xl bg-white text-xl shadow-sm">📄</div><div className="min-w-0"><p className="text-sm font-black text-slate-900 dark:text-white">Customer PDF Invoice</p><p className="mt-0.5 truncate font-mono text-[11px] text-slate-500">Invoice-{refNumber||refId}.pdf</p></div><span className="ml-auto rounded-full bg-emerald-600 px-2.5 py-1 text-[10px] font-black text-white">PDF ONLY</span></div><div className="mt-3 rounded-xl border border-emerald-200/80 bg-white/70 p-3 text-[11px] font-semibold leading-relaxed text-emerald-900 dark:border-emerald-900/30 dark:bg-slate-900/50 dark:text-emerald-200">This sends exactly one downloadable PDF invoice. No receipt, A4/print control, thermal document, internal earnings, commission or accounting details are sent.</div></div>:<div><div className="mb-1 flex items-center justify-between"><label className="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Message Content (Editable)</label><span className="text-[11px] text-slate-400 font-mono">{message.length} chars</span></div><textarea rows={9} value={message} onChange={e=>setMessage(e.target.value)} className="w-full rounded-xl border border-slate-200 bg-slate-50 p-3 font-mono text-xs text-slate-800 outline-none transition focus:border-emerald-500 focus:bg-white focus:ring-2 focus:ring-emerald-500/20 dark:border-white/10 dark:bg-slate-900 dark:text-slate-200" placeholder="Type or customize your WhatsApp message..."/><p className="mt-1 text-[11px] text-slate-400">💡 Markdown formatting supported.</p></div>}
                {status==="success"&&<div className="rounded-xl border border-emerald-200 bg-emerald-50 p-3 text-xs font-bold text-emerald-800 dark:border-emerald-900/40 dark:bg-emerald-950/20 dark:text-emerald-300">{invoiceOnly?"✓ PDF invoice sent successfully.":"✓ Message sent successfully and logged to History Tracker!"}</div>}
                {status==="error"&&<div className="rounded-xl border border-rose-200 bg-rose-50 p-3 text-xs text-rose-800 dark:border-rose-900/40 dark:bg-rose-950/20 dark:text-rose-300"><span className="font-bold">Dispatch Error: </span>{errorMsg}</div>}
                <div className="flex flex-wrap items-center justify-between gap-3 border-t border-slate-100 pt-4 dark:border-white/10">{!invoiceOnly?<button type="button" onClick={handleOpenDirectWhatsApp} className="inline-flex items-center gap-1.5 rounded-xl border border-slate-200 bg-white px-3.5 py-2 text-xs font-semibold text-slate-700 transition hover:bg-slate-50 dark:border-white/10 dark:bg-slate-900 dark:text-slate-200">Open in WhatsApp App / Web (wa.me) ↗</button>:<span className="text-[10px] font-bold text-slate-400">Customer delivery is locked to PDF invoice.</span>}<div className="flex items-center gap-2"><button type="button" onClick={onClose} className="rounded-xl border border-slate-200 px-3 py-2 text-xs font-medium text-slate-600 transition hover:bg-slate-50 dark:border-white/10 dark:text-slate-300">Cancel</button><button type="button" disabled={status==="sending"||!phone.trim()||(!invoiceOnly&&!message.trim())} onClick={handleSend} className="inline-flex items-center gap-2 rounded-xl bg-emerald-600 px-5 py-2 text-xs font-bold text-white shadow-md transition hover:bg-emerald-500 disabled:opacity-50">{status==="sending"?"Sending…":invoiceOnly?"Send PDF Invoice":"Send Message Now"}</button></div></div>
              </div>
            </Modal>;
          }
          TSX

      - name: Patch WhatsApp automation and local gateway
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('lib/whatsapp.ts'); t=p.read_text(encoding='utf-8')
          marker='''  const templates = config.templates || DEFAULT_WA_TEMPLATES;'''
          auto='''  // Customer invoice delivery is document-only. Never send the generic invoice template text.
  if (event.type === "pos_invoice" && event.referenceId) {
    try {
      const response = await fetch("/api/whatsapp/send-invoice", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({invoiceId:event.referenceId,phone:event.phone}) });
