name: Apply customer WhatsApp invoice PDF-only fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch application
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def write(path, content):
              p = Path(path); p.parent.mkdir(parents=True, exist_ok=True); p.write_text(content, encoding='utf-8')

          # Signed, expiring customer-facing invoice URL.
          write('lib/customer-invoice-link.ts', '''import { createHmac, timingSafeEqual } from "crypto";

          const TOKEN_TTL_SECONDS = 15 * 60;

          function secret(): string {
            const value = process.env.CUSTOMER_DOCUMENT_SECRET || process.env.SUPABASE_SERVICE_ROLE_KEY || "";
            if (!value) throw new Error("Customer invoice document secret is not configured.");
            return value;
          }

          function sign(payload: string): string {
            return createHmac("sha256", secret()).update(payload).digest("base64url");
          }

          export function createCustomerInvoiceToken(invoiceId: string, expiresAt = Math.floor(Date.now() / 1000) + TOKEN_TTL_SECONDS): string {
            return `${expiresAt}.${sign(`${invoiceId}.${expiresAt}`)}`;
          }

          export function verifyCustomerInvoiceToken(invoiceId: string, token: string): boolean {
            const [expiresRaw, signature] = String(token || "").split(".");
            const expiresAt = Number(expiresRaw);
            if (!Number.isInteger(expiresAt) || expiresAt < Math.floor(Date.now() / 1000) || !signature) return false;
            let expected: Buffer;
            try { expected = Buffer.from(sign(`${invoiceId}.${expiresAt}`)); } catch { return false; }
            const actual = Buffer.from(signature);
            return expected.length === actual.length && timingSafeEqual(expected, actual);
          }

          export function buildCustomerInvoiceUrl(origin: string, invoiceId: string, expiresAt = Math.floor(Date.now() / 1000) + TOKEN_TTL_SECONDS): string {
            return `${origin.replace(/\\/$/, "")}/api/whatsapp/invoice/${encodeURIComponent(invoiceId)}?token=${encodeURIComponent(createCustomerInvoiceToken(invoiceId, expiresAt))}`;
          }
          ''')

          # Customer-safe PDF: invoice only, no internal earnings/commission/accounting controls.
          write('components/pdf/customer-invoice-pdf.tsx', '''import { Document, Page, Text, View, StyleSheet } from "@react-pdf/renderer";
          import { numberToWordsInr } from "@/lib/format";

          const styles = StyleSheet.create({
            page:{padding:32,fontSize:9,color:"#0f172a",fontFamily:"Helvetica"},
            header:{flexDirection:"row",justifyContent:"space-between",borderBottom:"1.5",borderBottomColor:"#cbd5e1",paddingBottom:12,marginBottom:14},
            shop:{fontSize:17,fontWeight:"bold"}, small:{fontSize:8,color:"#475569",marginTop:2}, title:{fontSize:16,fontWeight:"bold"},
            row2:{flexDirection:"row",gap:10,marginBottom:14}, card:{flex:1,padding:9,backgroundColor:"#f8fafc",border:"0.5",borderColor:"#e2e8f0",borderRadius:4}, label:{fontSize:7,fontWeight:"bold",color:"#64748b",textTransform:"uppercase",marginBottom:3}, value:{fontSize:9,fontWeight:"bold"},
            head:{flexDirection:"row",backgroundColor:"#0f172a",color:"#fff",fontSize:8,fontWeight:"bold"}, line:{flexDirection:"row",borderBottom:"0.5",borderBottomColor:"#e2e8f0",fontSize:8,paddingVertical:5},
            no:{width:28,textAlign:"center"}, desc:{flex:1}, qty:{width:45,textAlign:"center"}, rate:{width:75,textAlign:"right"}, amt:{width:85,textAlign:"right"},
            summary:{alignSelf:"flex-end",width:250,marginTop:12,padding:10,backgroundColor:"#f8fafc",border:"0.5",borderColor:"#cbd5e1",borderRadius:4}, sr:{flexDirection:"row",justifyContent:"space-between",paddingVertical:3,fontSize:8.5}, total:{flexDirection:"row",justifyContent:"space-between",backgroundColor:"#0f172a",color:"#fff",padding:7,marginTop:4,borderRadius:3,fontWeight:"bold",fontSize:10}, due:{flexDirection:"row",justifyContent:"space-between",paddingVertical:4,color:"#b45309",fontWeight:"bold",fontSize:9}, footer:{marginTop:22,borderTop:"0.5",borderTopColor:"#e2e8f0",paddingTop:7,textAlign:"center",color:"#64748b",fontSize:7.5}
          });

          export default function CustomerInvoicePdf({invoice,items,payments,settings}:{invoice:any;items:any[];payments:any[];settings:any}){
            const cur=settings?.currency_symbol==="₹"?"Rs. ":`${settings?.currency_symbol||"Rs."} `;
            const money=(n:any)=>cur+Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
            const due=Number(invoice.due||0)>0&&invoice.status!=="cancelled";
            return <Document title={`Invoice ${invoice.invoice_number}`} author={settings?.shop_name||"Shop"}><Page size="A4" style={styles.page}>
              <View style={styles.header}><View><Text style={styles.shop}>{settings?.shop_name||"Sarkar Communication"}</Text>{settings?.address&&<Text style={styles.small}>{settings.address}</Text>}{settings?.phone&&<Text style={styles.small}>Ph: {settings.phone}</Text>}{settings?.email&&<Text style={styles.small}>Email: {settings.email}</Text>}{settings?.tax_id&&<Text style={styles.small}>GSTIN / Tax ID: {settings.tax_id}</Text>}</View><View style={{alignItems:"flex-end"}}><Text style={styles.title}>TAX INVOICE</Text><Text style={styles.small}>#{invoice.invoice_number}</Text><Text style={styles.small}>Date: {invoice.invoice_date}</Text><Text style={{...styles.small,fontWeight:"bold",color:due?"#b45309":"#15803d"}}>{due?`BALANCE DUE: ${money(invoice.due)}`:"FULLY PAID"}</Text></View></View>
              <View style={styles.row2}><View style={styles.card}><Text style={styles.label}>Billed To</Text><Text style={styles.value}>{invoice.customers?.name||"Walk-in Customer"}</Text>{invoice.customers?.phone&&<Text style={styles.small}>Phone: {invoice.customers.phone}</Text>}{invoice.customers?.address&&<Text style={styles.small}>{invoice.customers.address}</Text>}{invoice.customers?.code&&<Text style={styles.small}>Customer ID: {invoice.customers.code}</Text>}</View><View style={styles.card}><Text style={styles.label}>Invoice Status</Text><Text style={styles.value}>{String(invoice.status||"completed").toUpperCase()}</Text><Text style={styles.small}>Payment Mode: {payments?.length?payments.map((p:any)=>String(p.method).toUpperCase()).join(", "):"CASH"}</Text></View></View>
              <View><View style={styles.head}><Text style={{...styles.no,paddingVertical:5}}> # </Text><Text style={{...styles.desc,paddingVertical:5}}>Item Description</Text><Text style={{...styles.qty,paddingVertical:5}}>Qty</Text><Text style={{...styles.rate,paddingVertical:5}}>Rate</Text><Text style={{...styles.amt,paddingVertical:5}}>Amount</Text></View>{(items||[]).map((it:any,i:number)=>{const name=it.products?.name||it.services?.name||it.description||"Item";return <View key={it.id||i} style={styles.line}><Text style={styles.no}>{i+1}</Text><Text style={styles.desc}>{name}</Text><Text style={styles.qty}>{Number(it.qty||0)}</Text><Text style={styles.rate}>{money(it.rate)}</Text><Text style={{...styles.amt,fontWeight:"bold"}}>{money(it.amount)}</Text></View>})}</View>
              <View style={styles.summary}><View style={styles.sr}><Text>Subtotal</Text><Text>{money(invoice.subtotal)}</Text></View>{Number(invoice.discount||0)>0&&<View style={styles.sr}><Text>Discount</Text><Text>- {money(invoice.discount)}</Text></View>}<View style={styles.total}><Text>Grand Total</Text><Text>{money(invoice.total)}</Text></View><View style={styles.sr}><Text>Amount Paid</Text><Text>{money(invoice.paid)}</Text></View>{due&&<View style={styles.due}><Text>Balance Outstanding</Text><Text>{money(invoice.due)}</Text></View>}</View>
              <Text style={{...styles.small,marginTop:12}}>Amount in Words: {numberToWordsInr(Number(invoice.total))}</Text><View style={styles.footer}><Text>{settings?.receipt_footer||"Thank you for your business."}</Text></View>
            </Page></Document>;
          }
          ''')

          # Provider transport for actual PDF attachment only.
          write('lib/whatsapp-document.ts', '''import { formatWhatsAppPhone, type WhatsAppConfig } from "@/lib/whatsapp-shared";

          export async function sendCustomerInvoicePdf(phone:string,config:WhatsAppConfig,documentUrl:string,filename:string){
            if(!phone||!documentUrl)return{success:false,error:"Phone and invoice PDF URL are required.",status:400};
            if(!config||config.provider==="off")return{success:false,error:"WhatsApp integration is not enabled in Settings.",status:400};
            const to=formatWhatsAppPhone(phone); if(!to||to.length<10)return{success:false,error:"Invalid recipient phone number format.",status:400};
            if(config.provider==="meta"){
              const phoneId=config.meta_phone_number_id?.trim(),token=config.meta_access_token?.trim(); if(!phoneId||!token)return{success:false,error:"Meta Phone Number ID and Access Token are required.",status:400};
              const res=await fetch(`https://graph.facebook.com/v21.0/${encodeURIComponent(phoneId)}/messages`,{method:"POST",headers:{Authorization:`Bearer ${token}`,"Content-Type":"application/json"},body:JSON.stringify({messaging_product:"whatsapp",recipient_type:"individual",to,type:"document",document:{link:documentUrl,filename}}),signal:AbortSignal.timeout(15000)});
              const data=await res.json().catch(()=>({})); if(!res.ok)return{success:false,error:data?.error?.message||"Meta WhatsApp document send failed.",status:400,data}; return{success:true,provider:"meta",messageId:data?.messages?.[0]?.id,data};
            }
            if(config.provider==="local_gateway"){
              const gateway=String(config.gateway_url||"").replace(/\/$/,""); if(!gateway)return{success:false,error:"WhatsApp gateway URL is missing.",status:400};
              const res=await fetch(`${gateway}/send-document`,{method:"POST",headers:{"Content-Type":"application/json","Bypass-Tunnel-Reminder":"true",...(config.gateway_api_key?{"x-api-key":config.gateway_api_key}:{})},body:JSON.stringify({phone,documentUrl,fileName:filename}),signal:AbortSignal.timeout(60000)});
              const data=await res.json().catch(()=>({})); if(!res.ok||data?.success===false)return{success:false,error:data?.error||"WhatsApp gateway document send failed.",status:res.status||400}; if(data?.status==="dispatched_mock")return{success:false,error:"WhatsApp gateway is not linked yet. Scan the QR code first.",status:400}; return{success:true,provider:"local_gateway",messageId:data?.messageId,data};
            }
            if(config.provider==="ultramsg"){
              const instanceId=config.ultramsg_instance_id?.trim(),token=config.ultramsg_token?.trim(); if(!instanceId||!token)return{success:false,error:"UltraMsg Instance ID and Token are required.",status:400};
              const params=new URLSearchParams({token,to,filename,document:documentUrl}); const res=await fetch(`https://api.ultramsg.com/${encodeURIComponent(instanceId)}/messages/document`,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:params.toString(),signal:AbortSignal.timeout(15000)}); const data=await res.json().catch(()=>({})); if(!res.ok||data?.error)return{success:false,error:data?.error||"UltraMsg document send failed.",status:400,data}; return{success:true,provider:"ultramsg",messageId:data?.id||data?.messageId,data};
            }
            return{success:false,error:"Unknown WhatsApp provider.",status:400};
          }
          ''')

          # Customer-facing PDF endpoint. Signed link, no authenticated customer account required.
          write('app/api/whatsapp/invoice/[id]/route.ts', '''import { NextResponse } from "next/server";
          import { createElement } from "react";
          import { renderToBuffer } from "@react-pdf/renderer";
          import { createAdminClient } from "@/lib/supabase/admin";
          import CustomerInvoicePdf from "@/components/pdf/customer-invoice-pdf";
          import { verifyCustomerInvoiceToken } from "@/lib/customer-invoice-link";

          export const runtime="nodejs"; export const dynamic="force-dynamic";

          export async function GET(req:Request,{params}:{params:Promise<{id:string}>}){
            try{
              const {id}=await params; const token=new URL(req.url).searchParams.get("token")||""; if(!id||!verifyCustomerInvoiceToken(id,token))return new NextResponse("Invalid or expired invoice link.",{status:404});
              const db=createAdminClient(); const {data:invoice,error}=await db.from("invoices").select("*, customers(name, phone, address, code)").eq("id",id).maybeSingle(); if(error||!invoice)return new NextResponse("Invoice not found.",{status:404});
              const [{data:items},{data:payments},{data:settings}]=await Promise.all([db.from("invoice_items").select("*, products(name, code), services(name)").eq("invoice_id",id).order("created_at",{ascending:true}),db.from("payments").select("id,method,amount,received_at").eq("invoice_id",id).order("received_at",{ascending:true}),db.from("settings").select("*").single()]);
              const pdf=await renderToBuffer(createElement(CustomerInvoicePdf,{invoice,items:(items||[]) as any[],payments:(payments||[]) as any[],settings}));
              return new NextResponse(pdf as unknown as BodyInit,{status:200,headers:{"Content-Type":"application/pdf","Content-Disposition":`attachment; filename="Invoice-${invoice.invoice_number}.pdf"`,`Cache-Control`:"private, no-store, max-age=0","X-Content-Type-Options":"nosniff"}});
            }catch(error:any){console.error("Customer invoice PDF error:",error);return new NextResponse("Unable to generate invoice PDF.",{status:500});}
          }
          ''')

          # Authenticated app-user endpoint builds the signed PDF URL then sends document only.
          write('app/api/whatsapp/send-invoice/route.ts', '''import { NextResponse } from "next/server";
          import { getUserRole, hasRole } from "@/lib/authz";
          import { createAdminClient } from "@/lib/supabase/admin";
          import { buildCustomerInvoiceUrl } from "@/lib/customer-invoice-link";
          import { getServerWhatsAppConfig } from "@/lib/whatsapp-sender";
          import { sendCustomerInvoicePdf } from "@/lib/whatsapp-document";

          export const runtime="nodejs";
          export async function POST(req:Request){
            try{
              const role=await getUserRole(); if(!hasRole(role,["admin","manager","staff"]))return NextResponse.json({success:false,error:"Forbidden"},{status:403});
              const body=await req.json().catch(()=>({})); const invoiceId=String(body?.invoiceId||"").trim(); const phone=String(body?.phone||"").trim(); if(!invoiceId||!phone)return NextResponse.json({success:false,error:"Invoice ID and recipient phone are required."},{status:400});
              const db=createAdminClient(); const {data:invoice,error}=await db.from("invoices").select("id,invoice_number").eq("id",invoiceId).maybeSingle(); if(error||!invoice)return NextResponse.json({success:false,error:"Invoice not found."},{status:404});
              const documentUrl=buildCustomerInvoiceUrl(new URL(req.url).origin,invoice.id); const result=await sendCustomerInvoicePdf(phone,await getServerWhatsAppConfig(),documentUrl,`Invoice-${invoice.invoice_number}.pdf`); if(!result.success)return NextResponse.json({success:false,error:result.error||"Failed to send invoice PDF."},{status:result.status||400});
              return NextResponse.json({success:true,provider:result.provider,messageId:result.messageId,invoiceId:invoice.id,invoiceNumber:invoice.invoice_number});
            }catch(error:any){return NextResponse.json({success:false,error:error?.message||"Internal server error."},{status:500});}
          }
          ''')

          # Targeted patch: invoice launcher no longer builds an A4 receipt URL; generic quick-sale behavior remains untouched.
          p=Path('components/invoices/invoices-client.tsx'); t=p.read_text(encoding='utf-8')
          pattern=r'  function handleSendInvoiceWhatsApp\(inv: InvoiceRow\) \{[\s\S]*?\n  \}\n\n  function handleSendQuickSaleWhatsApp'
          replacement='''  function handleSendInvoiceWhatsApp(inv: InvoiceRow) {
    const phone = inv.customers?.phone || "";
    setWaModal({ open: true, phone, name: inv.customers?.name || "Customer", msg: "", type: "pos_invoice", refNum: inv.invoice_number, refId: inv.id });
  }

  function handleSendQuickSaleWhatsApp'''
          t,n=re.subn(pattern,replacement,t,count=1)
          if n!=1: raise SystemExit('Invoice WhatsApp launcher not found')
          p.write_text(t,encoding='utf-8')

          # Targeted patch: modal is PDF-only for invoice messages; all generic WhatsApp messages retain existing behavior.
          modal=Path('components/whatsapp/whatsapp-send-modal.tsx')
          mt=modal.read_text(encoding='utf-8')
          mt=re.sub(r'^("use client";)[\\s\\S]*$', '''"use client";

          import { useEffect, useState } from "react";
          import Modal from "@/components/ui/modal";
          import { getDirectWhatsAppUrl, getWhatsAppConfig, sendWhatsAppMessage, type WhatsAppLogEntry } from "@/lib/whatsapp";

          type Props={open:boolean;onClose:()=>void;phone:string;recipientName?:string;initialMessage:string;messageType?:WhatsAppLogEntry["message_type"];refId?:string;refNumber?:string;onSent?:()=>void};

          export default function WhatsAppSendModal({open,onClose,phone:initialPhone,recipientName,initialMessage,messageType="custom",refId,refNumber,onSent}:Props){
            const [phone,setPhone]=useState(initialPhone); const [message,setMessage]=useState(initialMessage); const [status,setStatus]=useState<"idle"|"sending"|"success"|"error">("idle"); const [errorMsg,setErrorMsg]=useState(""); const config=getWhatsAppConfig(); const invoiceOnly=messageType==="pos_invoice"&&Boolean(refId);
            useEffect(()=>{setPhone(initialPhone);setMessage(initialMessage);setStatus("idle");setErrorMsg("");},[open,initialPhone,initialMessage]);
            if(!open)return null;
            async function handleSend(){
              if(!phone.trim()){setErrorMsg("Recipient phone number is required.");setStatus("error");return;} setStatus("sending"); setErrorMsg("");
              try{
                if(invoiceOnly){const response=await fetch("/api/whatsapp/send-invoice",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({invoiceId:refId,phone:phone.trim()})});const result=await response.json().catch(()=>({}));if(!response.ok||!result.success)throw new Error(result.error||"Failed to send invoice PDF.");}
                else {if(!message.trim())throw new Error("Phone number and message text cannot be empty.");const res=await sendWhatsAppMessage({phone:phone.trim(),message:message.trim(),recipientName:recipientName||null,messageType,refId:refId||null,refNumber:refNumber||null});if(!res.ok)throw new Error(res.error||"Failed to dispatch via gateway.");}
                setStatus("success");onSent?.();setTimeout(onClose,1400);
              }catch(error){setStatus("error");setErrorMsg(error instanceof Error?error.message:"Failed to send WhatsApp message.");}
            }
            return <Modal onClose={onClose} title={invoiceOnly?"Send Invoice PDF via WhatsApp":"Send WhatsApp Message"} subtitle={recipientName?`Recipient: ${recipientName}`:undefined} accent="emerald" size="lg"><div className="space-y-4 p-6">
              <div><label className="mb-1 block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Recipient Mobile Number</label><div className="flex items-center gap-2"><span className="flex h-10 items-center rounded-xl border border-slate-200 bg-slate-100 px-3 text-xs font-bold text-slate-600 dark:border-white/10 dark:bg-slate-800 dark:text-slate-300">🇮🇳 +91</span><input value={phone} onChange={e=>setPhone(e.target.value)} placeholder="e.g. 9876543210" className="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-900 outline-none dark:border-white/10 dark:bg-slate-900 dark:text-slate-100"/></div></div>
              {invoiceOnly?<div className="rounded-2xl border border-emerald-200 bg-emerald-50 p-4 dark:border-emerald-900/40 dark:bg-emerald-950/20"><div className="flex items-center gap-3"><div className="flex h-11 w-11 items-center justify-center rounded-xl bg-white text-xl">📄</div><div><p className="text-sm font-black text-slate-900 dark:text-white">Customer PDF Invoice</p><p className="font-mono text-[11px] text-slate-500">Invoice-{refNumber||refId}.pdf</p></div><span className="ml-auto rounded-full bg-emerald-600 px-2.5 py-1 text-[10px] font-black text-white">PDF ONLY</span></div><p className="mt-3 rounded-xl bg-white/70 p-3 text-[11px] font-semibold text-emerald-900 dark:bg-slate-900/50 dark:text-emerald-200">Only one downloadable PDF invoice is sent to the customer. Receipt, A4, thermal and internal accounting documents are not sent.</p></div>:<div><label className="mb-1 block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Message Content (Editable)</label><textarea rows={9} value={message} onChange={e=>setMessage(e.target.value)} className="w-full rounded-xl border border-slate-200 bg-slate-50 p-3 font-mono text-xs text-slate-800 outline-none dark:border-white/10 dark:bg-slate-900 dark:text-slate-200"/></div>}
              {status==="success"&&<div className="rounded-xl border border-emerald-200 bg-emerald-50 p-3 text-xs font-bold text-emerald-800">{invoiceOnly?"✓ PDF invoice sent successfully.":"✓ Message sent successfully."}</div>}
              {status==="error"&&<div className="rounded-xl border border-rose-200 bg-rose-50 p-3 text-xs text-rose-800"><span className="font-bold">Dispatch Error: </span>{errorMsg}</div>}
              <div className="flex items-center justify-between gap-3 border-t border-slate-100 pt-4 dark:border-white/10">{!invoiceOnly&&<button type="button" onClick={()=>{window.open(getDirectWhatsAppUrl(phone,message),"_blank","noopener");onClose();}} className="rounded-xl border border-slate-200 bg-white px-3.5 py-2 text-xs font-semibold text-slate-700 dark:border-white/10 dark:bg-slate-900 dark:text-slate-200">Open in WhatsApp App / Web (wa.me) ↗</button>}{invoiceOnly&&<span className="text-[10px] font-bold text-slate-400">Customer delivery locked to PDF invoice.</span>}<div className="flex items-center gap-2"><button type="button" onClick={onClose} className="rounded-xl border border-slate-200 px-3 py-2 text-xs font-medium">Cancel</button><button type="button" disabled={status==="sending"||!phone.trim()||(!invoiceOnly&&!message.trim())} onClick={handleSend} className="rounded-xl bg-emerald-600 px-5 py-2 text-xs font-bold text-white disabled:opacity-50">{status==="sending"?"Sending…":invoiceOnly?"Send PDF Invoice":"Send Message Now"}</button></div></div>
            </div></Modal>;
          }
          ''',mt,count=1,flags=re.S)
          modal.write_text(mt,encoding='utf-8')

          # Universal helper: invoice messageType can never fall back to a text/wa.me dispatch.
          p=Path('lib/whatsapp.ts'); t=p.read_text(encoding='utf-8')
          marker='''  const fallbackUrl = getDirectWhatsAppUrl(params.phone, params.message);'''
          addition='''  if (params.messageType === "pos_invoice" && params.refId) {
    try {
      const response = await fetch("/api/whatsapp/send-invoice", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ invoiceId: params.refId, phone: params.phone }),
      });
      const result = await response.json().catch(() => ({}));
      return { ok: response.ok && Boolean(result.success), fallbackUrl: "", error: result.success ? undefined : (result.error || "Failed to send invoice PDF.") };
    } catch (error) {
      return { ok: false, fallbackUrl: "", error: error instanceof Error ? error.message : "Invoice PDF dispatch failed." };
    }
  }

'''
          if 'params.messageType === "pos_invoice" && params.refId' not in t:
              if marker not in t: raise SystemExit('sendWhatsAppMessage marker missing')
              t=t.replace(marker,addition+marker,1)

          old='''      const sendRes = await fetch("/api/whatsapp/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          phone: msg.phone,
          message: msg.message_body,
          config,
        }),
      });

      const resData = await sendRes.json().catch(() => ({}));'''
          new='''      const sendRes = msg.message_type === "pos_invoice" && msg.reference_id
        ? await fetch("/api/whatsapp/send-invoice", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ invoiceId: msg.reference_id, phone: msg.phone }),
          })
        : await fetch("/api/whatsapp/send", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phone: msg.phone, message: msg.message_body, config }),
          });

      const resData = await sendRes.json().catch(() => ({}));'''
          if 'msg.message_type === "pos_invoice" && msg.reference_id' not in t:
              if old not in t: raise SystemExit('processWhatsAppOutbox send block missing')
              t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')

          # Local WhatsApp gateway: actual PDF document attachment, no text message/caption.
          p=Path('scripts/whatsapp-gateway.js'); t=p.read_text(encoding='utf-8')
          marker='''  // Send Message Endpoint\n'''
          block='''  // Customer invoice PDF attachment endpoint.
  if ((urlPath === "/send-document" || urlPath === "/api/send-document") && req.method === "POST") {
    let body = "";
    req.on("data", (chunk) => { body += chunk.toString(); });
    req.on("end", async () => {
      try {
        const payload = JSON.parse(body || "{}");
        const phone = payload.phone || payload.number;
        const documentUrl = payload.documentUrl || payload.document;
        const fileName = payload.fileName || payload.filename || "Invoice.pdf";
        if (!phone || !documentUrl) { res.writeHead(400,{"Content-Type":"application/json"}); res.end(JSON.stringify({success:false,error:"Phone and document URL are required."})); return; }
        const parsed=new URL(documentUrl); if (!["https:","http:"].includes(parsed.protocol)) throw new Error("Document URL must be HTTP(S).");
        const jid=formatJid(phone);
        if(!isConnected||!sock){res.writeHead(200,{"Content-Type":"application/json"});res.end(JSON.stringify({success:true,status:"dispatched_mock",to:jid}));return;}
        const fileRes=await fetch(documentUrl,{signal:AbortSignal.timeout(30000)}); if(!fileRes.ok) throw new Error(`Invoice PDF endpoint returned HTTP ${fileRes.status}`);
        const ct=(fileRes.headers.get("content-type")||"").toLowerCase(); if(!ct.includes("application/pdf")) throw new Error("Invoice endpoint did not return a PDF document.");
        const buffer=Buffer.from(await fileRes.arrayBuffer()); if(buffer.length>15*1024*1024) throw new Error("Invoice PDF exceeds 15 MB.");
        const sent=await sock.sendMessage(jid,{document:buffer,mimetype:"application/pdf",fileName});
        res.writeHead(200,{"Content-Type":"application/json"});res.end(JSON.stringify({success:true,status:"sent",to:jid,messageId:sent?.key?.id,type:"document"}));
      }catch(err){res.writeHead(500,{"Content-Type":"application/json"});res.end(JSON.stringify({success:false,error:err.message}));}
    });
    return;
  }

