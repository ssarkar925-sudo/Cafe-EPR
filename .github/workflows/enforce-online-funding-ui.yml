name: Enforce Online Funding UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enforce-online-funding-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove cash funding from online service UIs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('components/business/recharge-workspace.tsx'),
              Path('components/business/google-play-workspace.tsx'),
              Path('components/business/utility-bill-workspace.tsx'),
          ]

          for path in files:
              text = path.read_text()
              original = text

              # Funding accounts for these services are online settlement instruments only.
              text = text.replace(
                  '["cash", "bank", "upi", "wallet", "dmt_portal", "aeps_portal", "credit_card"]',
                  '["bank", "upi", "wallet", "dmt_portal", "aeps_portal", "credit_card"]'
              )
              text = text.replace(
                  'validFundingInstruments.find((i) => i.type === "cash") || validFundingInstruments[0]',
                  'validFundingInstruments[0]'
              )

              # Defense-in-depth: reject a cash funding instrument even if stale client state is present.
              markers = [
                  'if (!fundingInstId) {\n      showToast("error", "Please select the funding account used to pay the operator/gateway.");\n      return;\n    }',
                  'if (!fundingInstId) {\n      return showToast("error", "Please select the funding account used to fund this recharge.");\n    }',
                  'if (!fundingInstId) {\n      showToast("error", "Please select the funding account used to settle the biller.");\n      return;\n    }',
              ]
              replacements = [
                  'if (!fundingInstId) {\n      showToast("error", "Please select the funding account used to pay the operator/gateway.");\n      return;\n    }\n    if (!selectedFundingAccount || selectedFundingAccount.type === "cash") {\n      showToast("error", "Cash is not permitted as a funding account for online recharge.");\n      return;\n    }',
                  'if (!fundingInstId) {\n      return showToast("error", "Please select the funding account used to fund this recharge.");\n    }\n    if (!selectedFundingAccount || selectedFundingAccount.type === "cash") {\n      return showToast("error", "Cash is not permitted as a funding account for online Google Play recharge.");\n    }',
                  'if (!fundingInstId) {\n      showToast("error", "Please select the funding account used to settle the biller.");\n      return;\n    }\n    if (!selectedFundingAccount || selectedFundingAccount.type === "cash") {\n      showToast("error", "Cash is not permitted as a funding account for online bill payment.");\n      return;\n    }',
              ]
              for marker, replacement in zip(markers, replacements):
                  if marker in text:
                      text = text.replace(marker, replacement, 1)

              if text != original:
                  path.write_text(text)

          PY

      - name: Commit UI changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No UI changes required."
            exit 0
          fi
          git add components/business/recharge-workspace.tsx components/business/google-play-workspace.tsx components/business/utility-bill-workspace.tsx
          git commit -m "fix: remove cash funding from online bill services [skip ci]"
          git push
