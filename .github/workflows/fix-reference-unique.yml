name: Fix bill payment reference uniqueness

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch unique bill reference
        shell: python
        run: |
          from pathlib import Path
          p = Path('components/business/utility-bill-workspace.tsx')
          s = p.read_text(encoding='utf-8')
          old = '        reference: reference.trim() || consumerId.trim(),'
          new = '        reference: `${reference.trim() || consumerId.trim()}-${nextNum}`,''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'reference: `${reference.trim() || consumerId.trim()}-${nextNum}`,'' in s:
              print('Reference is already unique.')
          else:
              raise SystemExit('Bill-payment reference anchor not found')
          p.write_text(s, encoding='utf-8')

      - name: Commit source fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-reference-unique.yml
          git add components/business/utility-bill-workspace.tsx .github/workflows/fix-reference-unique.yml
          git commit -m "fix(bill): make transaction references unique"
          git push
