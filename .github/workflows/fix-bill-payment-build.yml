name: Fix bill payment build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add missing transaction number declaration
        shell: python
        run: |
          from pathlib import Path
          p = Path('components/business/utility-bill-workspace.tsx')
          s = p.read_text(encoding='utf-8')
          needle = '      const nextNum = `BIL-${todayDate.replace(/-/g, "")}-${crypto.randomUUID().replace(/-/g, "").slice(0, 10).toUpperCase()}`;\n'
          replacement = needle + '      const txnNumber = nextNum;\n'
          if 'const txnNumber = nextNum;' not in s:
              if needle not in s:
                  raise SystemExit('Transaction number generation anchor not found')
              s = s.replace(needle, replacement, 1)
              p.write_text(s, encoding='utf-8')
          else:
              print('Declaration already present')

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/business/utility-bill-workspace.tsx
          git rm .github/workflows/fix-bill-payment-build.yml
          git commit -m "fix(bill): define transaction number before accounting entries"
          git push