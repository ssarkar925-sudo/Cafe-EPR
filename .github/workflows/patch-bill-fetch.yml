name: Repair Bill Auto Fetch

'on':
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch bill auto-fetch and loan providers
        run: python scripts/repair_bill_fetch.py

      - name: Commit patch and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-bill-fetch.yml scripts/repair_bill_fetch.py
          git add components/business/utility-bill-workspace.tsx app/api/bill-payment/fetch/route.ts
          git commit -m "fix: repair bill auto-fetch and add loan providers"
          git push origin HEAD:main
