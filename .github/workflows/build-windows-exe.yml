name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Compile Windows Desktop EXE
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows Executables
        # Build installers only; do not attempt a GitHub release from CI.
        # electron-builder otherwise enables implicit publishing in CI and
        # fails when GH_TOKEN is not configured.
        run: npx electron-builder --win --x64 --publish never

      - name: Upload Windows Setup Installer
        uses: actions/upload-artifact@v4
        with:
          name: CafeERP-Windows-Setup-Installer
          path: dist-electron/*.exe
          if-no-files-found: error
          retention-days: 30
