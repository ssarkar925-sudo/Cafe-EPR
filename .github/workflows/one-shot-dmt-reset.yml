name: One-shot DMT form reset fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply DMT reset patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/business/dmt-workspace.tsx')
          s = p.read_text(encoding='utf-8')

          old_reset = '''  const handleNewTransfer = useCallback(() => {
    setAmount("");
    setServiceFee("");
    setPortalCharge("");
    setPortalCommission("");
    setSelectedCustomerId("");
    setSenderName("");
    setSenderMobile("");
    setBeneficiaryName("");
    setBeneficiaryMobile("");
    setBeneficiaryBank("");
    setBeneficiaryIfsc("");
    setBeneficiaryAccount("");
    setUpiId("");
    setReceiverName("");
    setReference("");
    setRemarks("");
    setPaidFrom("bank");
    setLastCompletedTxn(null);
  }, []);'''

          new_reset = '''  const resetTransferEntryFields = useCallback(() => {
    setTransferMethod("bank_account");
    setSelectedCustomerId("");
    setSenderName("");
    setSenderMobile("");
    setBeneficiaryName("");
    setBeneficiaryMobile("");
    setBeneficiaryBank("");
    setBeneficiaryIfsc("");
    setBeneficiaryAccount("");
    setUpiId("");
    setReceiverName("");
    setAmount("");
    setServiceFee("");
    setPortalCharge("");
    setPortalCommission("");
    setCustomerPayMethod("cash");
    setPaidFrom("bank");
    setReference("");
    setRemarks("");
    setScannedReviewData(null);
  }, []);

  // Reset only the entry fields while preserving the completed transaction receipt card.
  const handleNewTransfer = useCallback(() => {
    resetTransferEntryFields();
    setLastCompletedTxn(null);
  }, [resetTransferEntryFields]);'''

          if old_reset not in s:
              raise SystemExit('Expected handleNewTransfer block not found; refusing to patch.')
          s = s.replace(old_reset, new_reset, 1)

          old_success = '''      setTransactions((prev) => [completedRecord, ...prev]);
      setLastCompletedTxn(completedRecord);

      // Re-fetch Live Balances Immediately
      await refreshBalances();

      showToast("success", `₹${numAmount.toLocaleString("en-IN")} DMT transfer completed successfully.`);'''

          new_success = '''      setTransactions((prev) => [completedRecord, ...prev]);
      setLastCompletedTxn(completedRecord);

      // Re-fetch Live Balances Immediately
      await refreshBalances();

      // Start the next transfer with a completely clean entry form.
      // The completed transaction card remains visible above the blank form.
      resetTransferEntryFields();

      showToast("success", `₹${numAmount.toLocaleString("en-IN")} DMT transfer completed successfully.`);'''

          if old_success not in s:
              raise SystemExit('Expected successful-transfer block not found; refusing to patch.')
          s = s.replace(old_success, new_success, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit source fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/business/dmt-workspace.tsx
          git rm .github/workflows/one-shot-dmt-reset.yml
          git diff --cached --quiet && { echo "No patch produced"; exit 1; }
          git commit -m "fix(dmt): reset form after successful transfer"
          git push origin HEAD:main
