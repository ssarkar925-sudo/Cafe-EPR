name: Implement universal partial payments

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Apply partial-payment implementation')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply universal partial-payment patch
        shell: python
        run: |
          from pathlib import Path
          import re

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          # 1) POS + Quick Sale: never hide tender methods; permit customer-backed partial receipts.
          p = Path('components/pos/pos-client.tsx')
          text = p.read_text(encoding='utf-8')
          text = text.replace('methodList.slice(0, 6).map((m) =>', 'methodList.map((m) =>')
          write(p, text)

          p = Path('components/pos/quick-sale.tsx')
          text = p.read_text(encoding='utf-8')
          pattern = re.compile(r'''    if \(paid <= 0\) \{.*?    const today = new Date\(\)\.toISOString\(\)\.slice\(0, 10\);''', re.S)
          replacement = '''    if (paid <= 0) {\n      setError("Enter the amount received.");\n      return;\n    }\n    if (paid > total + 0.01) {\n      setError(`Payments (${inr(paid)}) cannot exceed the sale amount (${inr(total)}).`);\n      return;\n    }\n    if (paid < total - 0.01 && !customerId) {\n      setError("Please select a customer to record partial payment / balance due.");\n      return;\n    }\n    const today = new Date().toISOString().slice(0, 10);'''
          text, n = pattern.subn(replacement, text, count=1)
          if n != 1: raise SystemExit('Quick Sale validation block not found')
          text = text.replace('{ method: "cash", amount: Number(total.toFixed(2)),', '{ method: "cash", amount: Number(Math.min(paid, total).toFixed(2)),', 1)
          write(p, text)

          # 2) Invoices management: allow partial collection amount and broader methods.
          p = Path('components/invoices/invoices-client.tsx')
          text = p.read_text(encoding='utf-8')
          text = text.replace('const METHODS = ["cash", "upi", "card"] as const;', 'const METHODS = ["cash", "upi", "bank", "wallet", "card"] as const;', 1)
          state = '  const [collectMethod, setCollectMethod] = useState<string>("cash");\n'
          if state not in text: raise SystemExit('Invoice collect state not found')
          text = text.replace(state, state + '  const [collectAmount, setCollectAmount] = useState("");\n', 1)
          text = re.sub(r'(setCollectMethod\("cash"\);\s*\n)(\s*setCollectId\(inv\.id\);)', r'\1\1?XX', text) if False else text
          opener = re.compile(r'(setCollectMethod\("cash"\);\s*\n)(\s*setCollectId\(inv\.id\);)')
          text, n = opener.subn(r'\1\2', text, count=2)
          # Add amount initialization separately, preserving indentation from each opener.
          text = re.sub(r'(setCollectMethod\("cash"\);\s*\n)(\s*setCollectId\(inv\.id\);)', r'setCollectMethod("cash");\n\g<2>setCollectAmount(String(Number(inv.due).toFixed(2)));\n\g<2>setCollectId(inv.id);', text)

          # Locate the first async function receiving InvoiceRow and patch its amount handling.
          m = re.search(r'async function\s+(\w+)\(inv: InvoiceRow\)\s*\{', text)
          if not m: raise SystemExit('Invoice collection function not found')
          start = m.start()
          brace = text.find('{', m.start())
          depth = 0; end = None
          for i in range(brace, len(text)):
              if text[i] == '{': depth += 1
              elif text[i] == '}':
                  depth -= 1
                  if depth == 0:
                      end = i + 1; break
          if end is None: raise SystemExit('Invoice collection function boundary not found')
          body = text[start:end]
          body2, n = re.subn(r'const amt = Number\(inv\.due\);', 'const amt = Number(collectAmount || inv.due);', body, count=1)
          if n != 1: raise SystemExit('Invoice collection amount expression not found')
          body2 = body2.replace('setCollectId(null);', 'setCollectId(null);\n    setCollectAmount("");', 1)
          text = text[:start] + body2 + text[end:]

          # Put the editable amount into both inline collect panels when their prompt exists.
          amount_input = '''<input type="number" min="0.01" max={Number(inv.due)} step="0.01" value={collectAmount} onChange={(e) => setCollectAmount(e.target.value)} placeholder={String(Number(inv.due))} className="w-28 rounded-lg border border-slate-200 bg-white px-2 py-1.5 text-xs font-mono outline-none focus:border-emerald-500" />'''
          panel_prompt = re.compile(r'(\s*<p[^>]*>Collect \{inr\(inv\.due\)\}[^<]*</p>)')
          text, n = panel_prompt.subn(r'\1\n' + amount_input, text, count=2)
          if n == 0: print('Invoice inline prompt not found; amount state/RPC still enables partial collection where existing amount UI is present.')
          write(p, text)

          # 3) Invoice view: accept bank/wallet too; amount input already exists.
          p = Path('components/invoices/invoice-view-modal.tsx')
          text = p.read_text(encoding='utf-8')
          text = text.replace('const METHODS = ["cash", "upi", "card"] as const;', 'const METHODS = ["cash", "upi", "bank", "wallet", "card"] as const;', 1)
          write(p, text)

          # 4) Customer Ledger: add Wallet and pass exact instrument when available through server resolver.
          p = Path('components/finance/ledger-client.tsx')
          text = p.read_text(encoding='utf-8')
          ledger_methods = '''                  { value: "cash", label: "Cash" },\n                  { value: "upi", label: "UPI" },\n                  { value: "bank", label: "Bank Transfer" },\n                  { value: "card", label: "Card" },'''
          ledger_replacement = '''                  { value: "cash", label: "Cash" },\n                  { value: "upi", label: "UPI" },\n                  { value: "bank", label: "Bank Transfer" },\n                  { value: "wallet", label: "Wallet" },\n                  { value: "card", label: "Card" },'''
          if ledger_methods in text:
              text = text.replace(ledger_methods, ledger_replacement, 1)
          write(p, text)

          # 5) Recharge / Utility / Google Play: partial now + Khata remainder.
          business = [
              ('components/business/recharge-workspace.tsx', 'totalCustomerDebit', 'recharge'),
              ('components/business/utility-bill-workspace.tsx', 'totalCustomerDebit', 'utility'),
              ('components/business/google-play-workspace.tsx', 'totalCustomerDebit', 'google'),
          ]
          for filename, _, kind in business:
              p = Path(filename); text = p.read_text(encoding='utf-8')
              text = re.sub(r'useState<"cash" \| "upi" \| "bank" \| "due">\("cash"\)', 'useState<"cash" | "upi" | "bank" | "wallet" | "card" | "due">("cash")', text, count=1)
              marker = '  const [customerPayInstId, setCustomerPayInstId] = useState("");'
              if marker not in text: raise SystemExit(f'Customer payment state not found in {filename}')
              if 'const [partialPayment, setPartialPayment]' not in text:
                  text = text.replace(marker, marker + '\n  const [partialPayment, setPartialPayment] = useState(false);\n  const [customerPaidNow, setCustomerPaidNow] = useState("");', 1)

              total_match = re.search(r'(  const totalCustomerDebit = [^;]+;)', text)
              if not total_match: raise SystemExit(f'Total customer debit not found in {filename}')
              if 'const customerCollectionAmount =' not in text:
                  extra = '''\n  const customerCollectionAmount = customerPayMethod === "due" ? 0 : partialPayment ? Math.min(totalCustomerDebit, Math.max(0, Number(customerPaidNow) || 0)) : totalCustomerDebit;\n  const customerDueAmount = Math.max(0, Number((totalCustomerDebit - customerCollectionAmount).toFixed(2)));'''
                  text = text[:total_match.end()] + extra + text[total_match.end():]

              text = text.replace('if (customerPayMethod === "due" && !selectedCustomerId)', 'if (customerDueAmount > 0 && !selectedCustomerId)', 1)
              text = text.replace('Please select a customer for Khata (Due) credit recharge.', 'Please select a customer to record the unpaid remainder / Khata due.', 1)
              text = text.replace('Please select a customer for Khata (Due) credit payment.', 'Please select a customer to record the unpaid remainder / Khata due.', 1)

              text = text.replace('cash_in: customerPayMethod === "cash" ? totalCustomerDebit : 0,', 'cash_in: customerPayMethod === "cash" ? customerCollectionAmount : 0,', 1)
              text = text.replace('bank_in: customerPayMethod === "bank" ? totalCustomerDebit : 0,', 'bank_in: customerPayMethod === "bank" ? customerCollectionAmount : 0,', 1)
              old_method = 'customer_pay_method: customerPayMethod,'
              new_method = '''customer_pay_method: customerCollectionAmount > 0 ? customerPayMethod : "due",\n          customer_collected_amount: customerCollectionAmount,\n          customer_due_amount: customerDueAmount,\n          customer_collection_method: customerPayMethod,\n          customer_collection_instrument_id: customerCollectionAmount > 0 ? (customerPayInstId || null) : null,'''
              if old_method in text:
                  text = text.replace(old_method, new_method, 1)

              text = text.replace('if (customerPayMethod !== "due" && totalCustomerDebit > 0) {', 'if (customerCollectionAmount > 0) {', 1)
              # Only the customer collection entry in the submit function should change.
              text = re.sub(r'(if \(customerCollectionAmount > 0\) \{[\s\S]*?\n\s*amount:) totalCustomerDebit,', r'\1 customerCollectionAmount,', text, count=1)
              text = text.replace('} else if (customerPayMethod === "due" && selectedCustomerId) {', '}\n      if (customerDueAmount > 0 && selectedCustomerId) {', 1)
              # Change the first due-branch arithmetic after that point.
              due_pos = text.find('if (customerDueAmount > 0 && selectedCustomerId)')
              if due_pos >= 0:
                  after = text[due_pos:]
                  after = after.replace('const newBal = prevBal + totalCustomerDebit;', 'const newBal = prevBal + customerDueAmount;', 1)
                  after = after.replace('debit: totalCustomerDebit,', 'debit: customerDueAmount,', 1)
                  text = text[:due_pos] + after

              methods_pattern = '''{ id: "cash" as const, label: "💵 Cash", desc: "Cash in Hand" },\n                { id: "upi" as const, label: "📱 UPI QR", desc: "Shop UPI QR" },\n                { id: "bank" as const, label: "🏦 Bank", desc: "Direct Transfer" },\n                { id: "due" as const, label: "📋 Khata", desc: "Customer Due" },'''
              methods_repl = '''{ id: "cash" as const, label: "💵 Cash", desc: "Cash in Hand" },\n                { id: "upi" as const, label: "📱 UPI QR", desc: "Shop UPI QR" },\n                { id: "bank" as const, label: "🏦 Bank", desc: "Direct Transfer" },\n                { id: "wallet" as const, label: "👛 Wallet", desc: "Wallet Account" },\n                { id: "card" as const, label: "💳 Card", desc: "Debit / Credit Card" },\n                { id: "due" as const, label: "📋 Khata", desc: "Customer Due" },'''
              if methods_pattern in text:
                  text = text.replace(methods_pattern, methods_repl, 1)

              # Add a compact partial-payment control before the funding section if that section exists.
              if 'Partial / Split Payment' not in text:
                  funding_marker = re.search(r'(\s*\{/\* 0?5? Funding Source Account \*/\})', text)
                  if not funding_marker:
                      funding_marker = re.search(r'(\s*\{/\* .*?Funding Source Account.*?\*/\})', text)
                  if funding_marker:
                      controls = '''\n          <div className="rounded-2xl border border-indigo-200 bg-indigo-50/50 p-3 dark:border-indigo-500/20 dark:bg-indigo-950/20">\n            <label className="flex items-center gap-2 text-xs font-black text-slate-700 dark:text-slate-200">\n              <input type="checkbox" checked={partialPayment} onChange={(e) => { setPartialPayment(e.target.checked); if (!e.target.checked) setCustomerPaidNow(""); }} />\n              Partial / Split Payment\n            </label>\n            {partialPayment && (\n              <div className="mt-2 grid grid-cols-1 gap-2 sm:grid-cols-2">\n                <input type="number" min="0" max={totalCustomerDebit} step="0.01" value={customerPaidNow} onChange={(e) => setCustomerPaidNow(e.target.value)} placeholder="Customer pays now" className="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm font-black dark:border-white/10 dark:bg-slate-900 dark:text-white" />\n                <div className="rounded-xl bg-white px-3 py-2 text-sm font-black dark:bg-slate-900">Khata Due: <span className="text-amber-600">{inr(customerDueAmount)}</span></div>\n              </div>\n            )}\n          </div>\n'''
                      text = text[:funding_marker.start()] + controls + text[funding_marker.start():]

              write(p, text)

          # 6) DMT: partial customer collection using the new RPC overload.
          p = Path('components/business/dmt-workspace.tsx'); text = p.read_text(encoding='utf-8')
          old_state = '  const [customerPayMethod, setCustomerPayMethod] = useState<"cash" | "upi" | "bank" | "due">("cash");'
          new_state = '  const [customerPayMethod, setCustomerPayMethod] = useState<"cash" | "upi" | "bank" | "wallet" | "card" | "due">("cash");\n  const [partialPayment, setPartialPayment] = useState(false);\n  const [customerPaidNow, setCustomerPaidNow] = useState("");'
          if old_state in text: text = text.replace(old_state, new_state, 1)
          if 'const customerCollectionAmount =' not in text:
              m2 = re.search(r'(  const totalCollected = [^;]+;)', text)
              if m2:
                  extra = '''\n  const customerCollectionAmount = customerPayMethod === "due" ? 0 : partialPayment ? Math.min(totalCollected, Math.max(0, Number(customerPaidNow) || 0)) : totalCollected;\n  const customerDueAmount = Math.max(0, Number((totalCollected - customerCollectionAmount).toFixed(2)));'''
                  text = text[:m2.end()] + extra + text[m2.end():]
          text = text.replace('if (customerPayMethod === "due" && !selectedCustomerId) return false;', 'if (customerDueAmount > 0 && !selectedCustomerId) return false;', 1)
          text = text.replace('p_customer_pay_method: customerPayMethod,', 'p_customer_pay_method: customerCollectionAmount > 0 ? customerPayMethod : "due",\n        p_customer_collected_amount: customerCollectionAmount,\n        p_customer_due_amount: customerDueAmount,\n        p_customer_collection_method: customerPayMethod,', 1)
          dmt_methods = '''{\n                    { id: "cash", label: "💵 Cash" },\n                    { id: "upi", label: "📱 UPI" },\n                    { id: "bank", label: "🏦 Bank" },\n                    { id: "due", label: "📋 Khata" },\n                  ].map((m) => ('''
          dmt_repl = '''{\n                    { id: "cash", label: "💵 Cash" },\n                    { id: "upi", label: "📱 UPI" },\n                    { id: "bank", label: "🏦 Bank" },\n                    { id: "wallet", label: "👛 Wallet" },\n                    { id: "card", label: "💳 Card" },\n                    { id: "due", label: "📋 Khata" },\n                  ].map((m) => ('''
          if dmt_methods in text: text = text.replace(dmt_methods, dmt_repl, 1)
          if 'Partial / Split Payment' not in text:
              marker = re.search(r'(\s*\{/\* .*Customer Collection.*?\*/\})', text)
              if marker:
                  controls = '''\n              <div className="mt-3 rounded-2xl border border-indigo-200 bg-indigo-50/50 p-3 dark:border-indigo-500/20 dark:bg-indigo-950/20">\n                <label className="flex items-center gap-2 text-xs font-black text-slate-700 dark:text-slate-200">\n                  <input type="checkbox" checked={partialPayment} onChange={(e) => { setPartialPayment(e.target.checked); if (!e.target.checked) setCustomerPaidNow(""); }} />\n                  Partial / Split Payment\n                </label>\n                {partialPayment && (\n                  <div className="mt-2 grid grid-cols-2 gap-2">\n                    <input type="number" min="0" max={totalCollected} step="0.01" value={customerPaidNow} onChange={(e) => setCustomerPaidNow(e.target.value)} placeholder="Paid now" className="rounded-xl border border-slate-300 bg-white px-3 py-2 text-xs font-black dark:border-white/10 dark:bg-slate-900 dark:text-white" />\n                    <div className="rounded-xl bg-white px-3 py-2 text-xs font-black dark:bg-slate-900">Khata Due: <span className="text-amber-600">{inr(customerDueAmount)}</span></div>\n                  </div>\n                )}\n              </div>\n'''
                  text = text[:marker.start()] + controls + text[marker.start():]
          write(p, text)

          # Remove the old failed patch workflow; this v2 patch owns the implementation.
          Path('.github/workflows/implement-universal-partial-payments.yml').unlink(missing_ok=True)

      - name: Verify TypeScript
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components supabase .github/workflows/implement-universal-partial-payments.yml
          git commit -m "Add universal partial payments and tender stability" || exit 0
          git push
