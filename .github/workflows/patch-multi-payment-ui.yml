name: Roll out partial and multiple payment collection

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Apply multi-payment UI rollout
        shell: bash
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          import re

          def load(path):
              return Path(path).read_text(encoding='utf-8')

          def save(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def add_import(text, anchor, line):
              if 'MultiPaymentCollection' in text:
                  return text
              if anchor not in text:
                  raise SystemExit(f'import anchor not found: {anchor}')
              return text.replace(anchor, anchor + '\n' + line, 1)

          def add_state(text, marker, line):
              if 'customerPaymentAllocations' in text or 'collectAllocations' in text or 'payAllocations' in text:
                  return text
              if marker not in text:
                  raise SystemExit(f'state anchor not found: {marker}')
              return text.replace(marker, marker + '\n' + line, 1)

          def replace_one(text, pattern, replacement, label):
              out, n = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              return out

          # ---------------- POS standard invoice ----------------
          p = 'components/pos/pos-client.tsx'
          t = load(p)
          t = add_import(t, 'import InstrumentSelect, { INSTRUMENT_TYPES, METHOD_ACCOUNT_TYPES, instrumentLabel, type InstrumentPick } from "./instrument-select";', 'import MultiPaymentCollection, { type PaymentAllocation } from "@/components/business/multi-payment-collection";')
          anchor = '                    {/* Payment Row */}'
          if 'totalDue={total}' not in t:
              ui = '''                    <MultiPaymentCollection\n                      totalDue={total}\n                      disabled={payDisabled}\n                      mode="invoice"\n                      initialMethod={(payments[0]?.method as PaymentAllocation["method"]) || "cash"}\n                      onChange={(rows) => {\n                        setPayments(rows.map((row) => {\n                          const types = METHOD_ACCOUNT_TYPES[row.method] ?? [row.method];\n                          const inst = types.map((type) => instruments.find((i) => i.type === type)).find(Boolean);\n                          return { instrument_id: inst?.id ?? "", method: row.method, amount: row.amount };\n                        }));\n                      }}\n                    />\n\n'''
              if anchor not in t:
                  raise SystemExit('POS payment row anchor not found')
              t = t.replace(anchor, ui + anchor, 1)
          save(p, t)

          # ---------------- Recharge / Utility / Google Play ----------------
          business_specs = [
              ('components/business/recharge-workspace.tsx',
               'import SearchableSelect from "@/components/ui/searchable-select";',
               '  const [customerPaidNow, setCustomerPaidNow] = useState("");',
               '  const [customerPaymentAllocations, setCustomerPaymentAllocations] = useState<PaymentAllocation[]>([]);',
               'const customerCollectionAmount = [^;]+;',
               'const customerCollectionAmount = customerPaymentAllocations.length > 0 ? Math.min(totalCustomerDebit, Math.max(0, customerPaymentAllocations.reduce((sum,row) => sum + (Number(row.amount) || 0), 0))) : (customerPayMethod === "due" ? 0 : partialPayment ? Math.min(totalCustomerDebit, Math.max(0, Number(customerPaidNow) || 0)) : totalCustomerDebit);',
               '          {/* 05 Funding Source Account */}',
               '''          <MultiPaymentCollection\n            totalDue={totalCustomerDebit}\n            disabled={submitting}\n            mode="customer"\n            initialMethod={customerPayMethod === "due" ? "cash" : customerPayMethod}\n            onChange={(rows) => {\n              setCustomerPaymentAllocations(rows);\n              const first = rows.find((row) => Number(row.amount) > 0);\n              setCustomerPayMethod(first?.method ?? "due");\n            }}\n          />\n\n''',
               r'      // 4\. Customer Collection Accounting Leg[\s\S]*?      // 5\. Provider Funding Leg',
               '''      // 4. Customer Collection Accounting Leg\n      const { error: collectionError } = await supabase.rpc("apply_transaction_customer_payment_split", {\n        p_txn_id: newTxn.id,\n        p_allocations: customerPaymentAllocations.filter((row) => Number(row.amount) > 0),\n      });\n      if (collectionError) throw collectionError;\n\n      // 5. Provider Funding Leg'''),
              ('components/business/utility-bill-workspace.tsx',
               'import SearchableSelect from "@/components/ui/searchable-select";',
               '  const [customerPaidNow, setCustomerPaidNow] = useState("");',
               '  const [customerPaymentAllocations, setCustomerPaymentAllocations] = useState<PaymentAllocation[]>([]);',
               'const customerCollectionAmount = [^;]+;',
               'const customerCollectionAmount = customerPaymentAllocations.length > 0 ? Math.min(totalCustomerDebit, Math.max(0, customerPaymentAllocations.reduce((sum,row) => sum + (Number(row.amount) || 0), 0))) : (customerPayMethod === "due" ? 0 : partialPayment ? Math.min(totalCustomerDebit, Math.max(0, Number(customerPaidNow) || 0)) : totalCustomerDebit);',
               '            {/* Funding Source Account (Cost Debited From) */}',
               '''            <MultiPaymentCollection\n              totalDue={totalCustomerDebit}\n              disabled={submitting}\n              mode="customer"\n              initialMethod={customerPayMethod === "due" ? "cash" : customerPayMethod}\n              onChange={(rows) => {\n                setCustomerPaymentAllocations(rows);\n                const first = rows.find((row) => Number(row.amount) > 0);\n                setCustomerPayMethod(first?.method ?? "due");\n              }}\n            />\n\n''',
               r'      // 3\. Customer Collection Accounting Leg[\s\S]*?      // 4\. Provider Funding Leg',
               '''      // 3. Customer Collection Accounting Leg\n      const { error: collectionError } = await supabase.rpc("apply_transaction_customer_payment_split", {\n        p_txn_id: newTxn.id,\n        p_allocations: customerPaymentAllocations.filter((row) => Number(row.amount) > 0),\n      });\n      if (collectionError) throw collectionError;\n\n      // 4. Provider Funding Leg'''),
              ('components/business/google-play-workspace.tsx',
               'import SearchableSelect from "@/components/ui/searchable-select";',
               '  const [customerPaidNow, setCustomerPaidNow] = useState("");',
               '  const [customerPaymentAllocations, setCustomerPaymentAllocations] = useState<PaymentAllocation[]>([]);',
               'const customerCollectionAmount = [^;]+;',
               'const customerCollectionAmount = customerPaymentAllocations.length > 0 ? Math.min(totalCustomerDebit, Math.max(0, customerPaymentAllocations.reduce((sum,row) => sum + (Number(row.amount) || 0), 0))) : (customerPayMethod === "due" ? 0 : partialPayment ? Math.min(totalCustomerDebit, Math.max(0, Number(customerPaidNow) || 0)) : totalCustomerDebit);',
               '            {/* Funding Source Account (Cost Debited From) */}',
               '''            <MultiPaymentCollection\n              totalDue={totalCustomerDebit}\n              disabled={submitting}\n              mode="customer"\n              initialMethod={customerPayMethod === "due" ? "cash" : customerPayMethod}\n              onChange={(rows) => {\n                setCustomerPaymentAllocations(rows);\n                const first = rows.find((row) => Number(row.amount) > 0);\n                setCustomerPayMethod(first?.method ?? "due");\n              }}\n            />\n\n''',
               r'      // Customer Collection Leg[\s\S]*?      // Provider Funding Leg',
               '''      // Customer Collection Leg\n      const { error: collectionError } = await supabase.rpc("apply_transaction_customer_payment_split", {\n        p_txn_id: newTxn.id,\n        p_allocations: customerPaymentAllocations.filter((row) => Number(row.amount) > 0),\n      });\n      if (collectionError) throw collectionError;\n\n      // Provider Funding Leg'''),
          ]

          for spec in business_specs:
              p, imp, marker, state, derived_pat, derived_rep, ui_anchor, ui, acct_pat, acct_rep = spec
              t = load(p)
              t = add_import(t, imp, 'import MultiPaymentCollection, { type PaymentAllocation } from "@/components/business/multi-payment-collection";')
              t = add_state(t, marker, state)
              t = replace_one(t, derived_pat, derived_rep, p + ' customerCollectionAmount')
              if 'totalDue={totalCustomerDebit}' not in t:
                  if ui_anchor not in t:
                      raise SystemExit(f'{p}: payment UI anchor not found')
                  t = t.replace(ui_anchor, ui + ui_anchor, 1)
              t = replace_one(t, acct_pat, acct_rep, p + ' accounting block')
              # Keep the allocation state clean after a completed transaction.
              reset_anchor = '      setRemarks("");' if 'recharge-workspace' in p else ('      setRemarks("");' if 'google-play' in p else '      setRemarks("");')
              if 'setCustomerPaymentAllocations([]);' not in t:
                  idx = t.find(reset_anchor)
                  if idx >= 0:
                      t = t[:idx] + reset_anchor + '\n      setCustomerPaymentAllocations([]);' + t[idx+len(reset_anchor):]
              save(p, t)

          # ---------------- DMT ----------------
          p = 'components/business/dmt-workspace.tsx'
          t = load(p)
          t = add_import(t, 'import SearchableSelect from "@/components/ui/searchable-select";', 'import MultiPaymentCollection, { type PaymentAllocation } from "@/components/business/multi-payment-collection";')
          t = add_state(t, '  const [customerPaidNow, setCustomerPaidNow] = useState("");', '  const [customerPaymentAllocations, setCustomerPaymentAllocations] = useState<PaymentAllocation[]>([]);')
          t = replace_one(t, 'const customerCollectionAmount = [^;]+;', 'const customerCollectionAmount = customerPaymentAllocations.length > 0 ? Math.min(totalCollected, Math.max(0, customerPaymentAllocations.reduce((sum,row) => sum + (Number(row.amount) || 0), 0))) : (customerPayMethod === "due" ? 0 : partialPayment ? Math.min(totalCollected, Math.max(0, Number(customerPaidNow) || 0)) : totalCollected);', 'DMT customerCollectionAmount')
          if 'totalDue={totalCollected}' not in t:
              ui_anchor = '              {/* Reference & Remarks */}'
              ui = '''              <MultiPaymentCollection\n                totalDue={totalCollected}\n                disabled={isSubmitting}\n                mode="customer"\n                initialMethod={customerPayMethod === "due" ? "cash" : customerPayMethod}\n                onChange={(rows) => {\n                  setCustomerPaymentAllocations(rows);\n                  const first = rows.find((row) => Number(row.amount) > 0);\n                  setCustomerPayMethod(first?.method ?? "due");\n                }}\n              />\n\n'''
              if ui_anchor not in t:
                  raise SystemExit('DMT payment UI anchor not found')
              t = t.replace(ui_anchor, ui + ui_anchor, 1)
          t = t.replace('supabase.rpc("create_dmt_business_txn", {', 'supabase.rpc("create_dmt_business_txn_multi_collection", {', 1)
          if 'p_customer_collection_allocations:' not in t:
              t = t.replace('        p_portal_charge: numCharge,\n      });', '        p_portal_charge: numCharge,\n        p_customer_collection_allocations: customerPaymentAllocations.filter((row) => Number(row.amount) > 0),\n      });', 1)
          if 'setCustomerPaymentAllocations([]);' not in t:
              t = t.replace('    setLastCompletedTxn(null);', '    setLastCompletedTxn(null);\n    setCustomerPaymentAllocations([]);', 1)
          save(p, t)

          # ---------------- Invoice collection ----------------
          p = 'components/invoices/invoices-client.tsx'
          t = load(p)
          t = add_import(t, 'import CompactToggle from "@/components/ui/compact-toggle";', 'import MultiPaymentCollection, { type PaymentAllocation } from "@/components/business/multi-payment-collection";')
          if 'collectAllocations' not in t:
              t = t.replace('  const [collectAmount, setCollectAmount] = useState("");', '  const [collectAmount, setCollectAmount] = useState("");\n  const [collectAllocations, setCollectAllocations] = useState<PaymentAllocation[]>([]);', 1)
          old_collect = r'''  async function collectDue\(inv: InvoiceRow\) \{[\s\S]*?\n  \}\n\n  async function copyNumber'''
          new_collect = '''  async function collectDue(inv: InvoiceRow) {\n    const allocations = collectAllocations.filter((row) => Number(row.amount) > 0);\n    const amt = allocations.reduce((sum, row) => sum + (Number(row.amount) || 0), 0);\n    if (!(amt > 0)) return;\n    setBusyId(inv.id);\n    const { data, error } = await supabase.rpc("record_invoice_multi_payment", {\n      p_invoice_id: inv.id,\n      p_allocations: allocations,\n    });\n    setBusyId(null);\n    setCollectId(null);\n    setCollectAmount("");\n    setCollectAllocations([]);\n    if (error) {\n      flash("error", error.message);\n      return;\n    }\n    const r = data as { paid: number; due: number; status: string };\n    setInvoices((prev) => prev.map((x) => x.id === inv.id ? { ...x, paid: r.paid, due: r.due, status: r.status } : x));\n    const tenderText = allocations.map((row) => `${row.method.toUpperCase()} ${inr(Number(row.amount))}`).join(" + ");\n    flash("success", `${inv.invoice_number} — ${tenderText} collected`);\n    logAudit({\n      action: "payment",\n      entity: "invoice",\n      entity_id: inv.id,\n      description: `Payment of ${inr(amt)} received (${tenderText})`,\n      details: { invoice_number: inv.invoice_number, allocations, amount: amt },\n    });\n  }\n\n  async function copyNumber'''
          t = replace_one(t, old_collect, new_collect, 'invoice collectDue')
          t = t.replace('setCollectMethod("cash");\n                                  setCollectId(inv.id);setCollectAmount(String(Number(inv.due).toFixed(2)));', 'setCollectMethod("cash");\n                                  setCollectAmount(String(Number(inv.due).toFixed(2)));\n                                  setCollectAllocations([{ method: "cash", amount: String(Number(inv.due).toFixed(2)) }]);\n                                  setCollectId(inv.id);', 1)
          old_modal = r'''            <div>\n              <label className="text-xs font-semibold text-slate-600 dark:text-slate-300">Payment Amount \(₹\) \*</label>[\s\S]*?\n            </div>\n\n            <div>\n              <label className="text-xs font-semibold text-slate-600 dark:text-slate-300">Payment Date</label>'''
          new_modal = '''            <MultiPaymentCollection totalDue={Number(selected.balance)} mode="invoice" onChange={setCollectAllocations} />\n\n            <div>\n              <label className="text-xs font-semibold text-slate-600 dark:text-slate-300">Payment Date</label>'''
          t = replace_one(t, old_modal, new_modal, 'invoice payment modal')
          save(p, t)

          # ---------------- Customer ledger collection ----------------
          p = 'components/finance/ledger-client.tsx'
          t = load(p)
          t = add_import(t, 'import CompactToggle from "@/components/ui/compact-toggle";', 'import MultiPaymentCollection, { type PaymentAllocation } from "@/components/business/multi-payment-collection";')
          if 'payAllocations' not in t:
              t = t.replace('  const [payMethod, setPayMethod] = useState("cash");', '  const [payMethod, setPayMethod] = useState("cash");\n  const [payAllocations, setPayAllocations] = useState<PaymentAllocation[]>([]);', 1)
          old_pay = r'''  async function handleRecordPayment\(\) \{[\s\S]*?\n  \}\n\n  async function handleRecordAdjustment'''
          new_pay = '''  async function handleRecordPayment() {\n    const allocations = payAllocations.filter((row) => Number(row.amount) > 0);\n    const amt = allocations.reduce((sum, row) => sum + (Number(row.amount) || 0), 0);\n    if (!amt || amt <= 0) {\n      showToast("error", "Please enter at least one positive payment allocation.");\n      return;\n    }\n    if (amt > Number(selected?.balance ?? 0) + 0.005) {\n      showToast("error", "Payment cannot exceed the customer's outstanding due.");\n      return;\n    }\n    setPayBusy(true);\n    const { data, error } = await supabase.rpc("record_customer_multi_payment", {\n      p_customer_id: customerId,\n      p_entry_date: payDate,\n      p_allocations: allocations,\n      p_description: payRemarks.trim() || null,\n    });\n    setPayBusy(false);\n    if (error) {\n      showToast("error", error.message);\n      return;\n    }\n    const tenderText = allocations.map((row) => `${row.method.toUpperCase()} ${inr(Number(row.amount))}`).join(" + ");\n    showToast("success", `Recorded ${tenderText} for ${selected?.name}.`);\n    setPayModal(false);\n    setPayAmount("");\n    setPayRemarks("");\n    setPayAllocations([]);\n    await loadCustomerLedger(customerId);\n  }\n\n  async function handleRecordAdjustment'''
          t = replace_one(t, old_pay, new_pay, 'ledger handleRecordPayment')
          t = t.replace('setPayAmount(Number(selected.balance) > 0 ? String(selected.balance) : "");\n                    setPayModal(true);', 'setPayAmount(Number(selected.balance) > 0 ? String(selected.balance) : "");\n                    setPayAllocations(Number(selected.balance) > 0 ? [{ method: "cash", amount: String(Number(selected.balance).toFixed(2)) }] : []);\n                    setPayModal(true);', 1)
          old_ledger_modal = r'''            <div>\n              <label className="text-xs font-semibold text-slate-600 dark:text-slate-300">Payment Amount \(₹\) \*</label>[\s\S]*?\n            </div>\n\n            <div>\n              <label className="text-xs font-semibold text-slate-600 dark:text-slate-300">Payment Date</label>'''
          new_ledger_modal = '''            <MultiPaymentCollection totalDue={Number(selected.balance)} mode="ledger" onChange={(rows) => { setPayAllocations(rows); setPayMethod(rows.find((row) => Number(row.amount) > 0)?.method ?? "cash"); }} />\n\n            <div>\n              <label className="text-xs font-semibold text-slate-600 dark:text-slate-300">Payment Date</label>'''
          t = replace_one(t, old_ledger_modal, new_ledger_modal, 'ledger payment modal')
          save(p, t)

          print('PATCH_OK')
          PY
          python /tmp/patch.py

      - name: Commit patched sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/ supabase/20260906_multi_payment_collection.sql
          git commit -m "Roll out partial and multiple payment collection UI"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
