name: Test Staging Backup Restore (Isolated)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: testrestorepassword123
          POSTGRES_DB: restore_test_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Download newest encrypted backup from Google Drive
        shell: bash
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GDRIVE_BACKUP_FOLDER_ID: ${{ secrets.GDRIVE_BACKUP_FOLDER_ID }}
        run: |
          set -euo pipefail
          echo "::add-mask::$GOOGLE_OAUTH_CLIENT_ID"
          echo "::add-mask::$GOOGLE_OAUTH_CLIENT_SECRET"
          echo "::add-mask::$GOOGLE_OAUTH_REFRESH_TOKEN"
          echo "::add-mask::$GDRIVE_BACKUP_FOLDER_ID"

          python3 -m pip install --quiet google-api-python-client google-auth
          python3 - <<'EOF'
          import os, sys
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload

          client_id = os.environ["GOOGLE_OAUTH_CLIENT_ID"]
          client_secret = os.environ["GOOGLE_OAUTH_CLIENT_SECRET"]
          refresh_token = os.environ["GOOGLE_OAUTH_REFRESH_TOKEN"]
          folder = os.environ["GDRIVE_BACKUP_FOLDER_ID"]

          creds = Credentials(
              token=None,
              refresh_token=refresh_token,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=client_id,
              client_secret=client_secret,
              scopes=["https://www.googleapis.com/auth/drive"]
          )
          creds.refresh(Request())
          drive = build("drive", "v3", credentials=creds, cache_discovery=False)

          # Find newest backup file in folder
          resp = drive.files().list(
              q=f"'{folder}' in parents and trashed=false and name contains 'cafeerp-staging-'",
              fields="files(id,name,size,md5Checksum,createdTime)",
              orderBy="createdTime desc",
              pageSize=5,
              supportsAllDrives=True,
              includeItemsFromAllDrives=True
          ).execute()

          files = resp.get("files", [])
          if not files:
              sys.stderr.write(f"::error::No backup files found in folder {folder}.\n")
              sys.exit(1)

          newest = files[0]
          print(f"Found newest backup: '{newest['name']}' (ID: {newest['id']}, Size: {newest.get('size')} bytes)")

          # Download ciphertext
          request = drive.files().get_media(fileId=newest["id"], supportsAllDrives=True)
          out_path = f"/tmp/{newest['name']}"
          with open(out_path, "wb") as f:
              downloader = MediaIoBaseDownload(f, request)
              done = False
              while not done:
                  status, done = downloader.next_chunk()
                  if status:
                      print(f"Download progress: {int(status.progress() * 100)}%")

          print(f"Download complete: {out_path} ({os.path.getsize(out_path)} bytes)")
          with open(os.environ["GITHUB_ENV"], "a") as env_f:
              env_f.write(f"DOWNLOADED_ENC_PATH={out_path}\n")
              env_f.write(f"BACKUP_NAME={newest['name']}\n")
              env_f.write(f"REMOTE_MD5={newest.get('md5Checksum', '')}\n")
          EOF

      - name: Decrypt backup and verify checksum
        shell: bash
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          echo "::add-mask::$BACKUP_ENCRYPTION_PASSPHRASE"

          # Verify MD5 of downloaded file against remote MD5
          LOCAL_MD5="$(md5sum "$DOWNLOADED_ENC_PATH" | cut -d' ' -f1)"
          echo "Downloaded file MD5: $LOCAL_MD5"
          if [ -n "${REMOTE_MD5:-}" ] && [ "$LOCAL_MD5" != "$REMOTE_MD5" ]; then
            echo "::error::MD5 checksum mismatch: remote $REMOTE_MD5 vs local $LOCAL_MD5"
            exit 1
          fi
          echo "MD5 checksum verified match with Google Drive remote metadata."

          DUMP_PATH="/tmp/restore.dump"
          echo "DUMP_PATH=$DUMP_PATH" >> "$GITHUB_ENV"

          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in "$DOWNLOADED_ENC_PATH" -out "$DUMP_PATH" \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE

          test -s "$DUMP_PATH"
          echo "Decryption successful. Plaintext dump size: $(du -h "$DUMP_PATH" | cut -f1)"

      - name: Validate dump structure using pg_restore --list
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v /tmp:/tmp:ro postgres:18 \
            pg_restore --list "$DUMP_PATH" > /tmp/catalog.txt

          echo "Dump catalog preview (first 25 entries):"
          head -n 25 /tmp/catalog.txt

          TABLE_COUNT="$(grep -c "TABLE DATA public" /tmp/catalog.txt || true)"
          SCHEMA_COUNT="$(grep -c "SCHEMA public" /tmp/catalog.txt || true)"
          echo "Catalog analysis: $TABLE_COUNT tables with data, $SCHEMA_COUNT schema definitions."
          if [ "$TABLE_COUNT" -eq 0 ]; then
            echo "::error::Catalog contains zero TABLE DATA entries."
            exit 1
          fi

      - name: Restore into isolated test database
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5433
          PGUSER: postgres
          PGPASSWORD: testrestorepassword123
          PGDATABASE: restore_test_db
        run: |
          set -euo pipefail
          echo "Restoring into isolated test container on port 5433..."
          docker run --rm --network host -v /tmp:/tmp:ro \
            -e PGPASSWORD="$PGPASSWORD" \
            postgres:18 pg_restore -h 127.0.0.1 -p 5433 -U "$PGUSER" -d "$PGDATABASE" \
            --clean --if-exists --no-owner --no-privileges "$DUMP_PATH" || true
          echo "Restore execution completed."

      - name: Verify restored tables and representative data
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5433
          PGUSER: postgres
          PGPASSWORD: testrestorepassword123
          PGDATABASE: restore_test_db
        run: |
          set -euo pipefail
          echo "Querying isolated restored database..."
          docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            postgres:18 psql -h 127.0.0.1 -p 5433 -U "$PGUSER" -d "$PGDATABASE" -c "
              SELECT table_schema, table_name 
              FROM information_schema.tables 
              WHERE table_schema = 'public' 
              ORDER BY table_name;
            "

          docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            postgres:18 psql -h 127.0.0.1 -p 5433 -U "$PGUSER" -d "$PGDATABASE" -c "
              SELECT 'transactions' as table_name, count(*) FROM public.transactions
              UNION ALL
              SELECT 'accounting_accounts', count(*) FROM public.accounting_accounts
              UNION ALL
              SELECT 'customers', count(*) FROM public.customers;
            "

      - name: Secure cleanup (always)
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          for f in "${DOWNLOADED_ENC_PATH:-}" "${DUMP_PATH:-}" /tmp/catalog.txt; do
            if [ -n "${f:-}" ] && [ -f "$f" ]; then shred -u "$f" || rm -f "$f"; fi
          done
          echo "All temporary decrypted and downloaded files shredded."
