name: one-time-gateway-pdf-fix
'on':
  push:
    branches: [main]

jobs:
  patch-gateway:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch gateway PDF endpoint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/whatsapp-gateway.js')
          s = p.read_text(encoding='utf-8')
          start_marker = '  // Send PDF Invoice Document Endpoint\n'
          end_marker = '  // Send Message Endpoint\n'
          start = s.index(start_marker)
          end = s.index(end_marker, start)
          block = '''  // Send PDF Invoice Document Endpoint
  if ((urlPath === "/send-document" || urlPath === "/api/send-document") && req.method === "POST") {
    let body = "";
    req.on("data", (chunk) => {
      body += chunk.toString();
      if (body.length > 30 * 1024 * 1024) req.destroy();
    });

    req.on("end", async () => {
      try {
        const payload = JSON.parse(body || "{}");
        const phone = payload.phone || payload.number;
        const documentUrl = payload.documentUrl || payload.document;
        const documentBase64 = payload.documentBase64 || payload.pdfBase64 || "";
        const fileName = String(payload.fileName || payload.filename || "Invoice.pdf").replace(/[^a-zA-Z0-9._-]/g, "_");

        if (!phone || (!documentUrl && !documentBase64)) {
          res.writeHead(400, { "Content-Type": "application/json" });
          res.end(JSON.stringify({ success: false, error: "Phone and invoice PDF content are required." }));
          return;
        }

        const jid = formatJid(phone);
        if (!isConnected || !sock) {
          res.writeHead(200, { "Content-Type": "application/json" });
          res.end(JSON.stringify({ success: true, status: "dispatched_mock", note: "Gateway is reachable but WhatsApp is not connected.", to: jid, type: "document" }));
          return;
        }

        let buffer;
        if (documentBase64) {
          const encoded = String(documentBase64).trim().replace(/^data:application\\/pdf;base64,/, "");
          buffer = Buffer.from(encoded, "base64");
        } else {
          let parsedUrl;
          try {
            parsedUrl = new URL(documentUrl);
            if (!["https:", "http:"].includes(parsedUrl.protocol)) throw new Error("Unsupported document URL protocol");
          } catch {
            res.writeHead(400, { "Content-Type": "application/json" });
            res.end(JSON.stringify({ success: false, error: "Document URL must be HTTP(S)." }));
            return;
          }

          const fileRes = await fetch(parsedUrl, {
            redirect: "follow",
            headers: { "User-Agent": "CafeERP-WhatsApp-Gateway/1.0", "Accept": "application/pdf, application/octet-stream;q=0.9, */*;q=0.1" },
            signal: AbortSignal.timeout(30000),
          });
          if (!fileRes.ok) throw new Error(`Invoice PDF endpoint returned HTTP ${fileRes.status}`);
          const contentType = (fileRes.headers.get("content-type") || "").toLowerCase();
          const contentLength = Number(fileRes.headers.get("content-length") || 0);
          if (contentLength > 15 * 1024 * 1024) throw new Error("Invoice PDF exceeds 15 MB.");
          buffer = Buffer.from(await fileRes.arrayBuffer());
          if (buffer.length > 15 * 1024 * 1024) throw new Error("Invoice PDF exceeds 15 MB.");
          const looksLikePdf = buffer.subarray(0, 5).toString("ascii") === "%PDF-";
          if (!looksLikePdf && !contentType.includes("application/pdf")) throw new Error(`Invoice endpoint did not return a PDF (content-type: ${contentType || "missing"}).`);
        }

        if (!buffer?.length) throw new Error("Invoice PDF is empty.");
        if (buffer.length > 15 * 1024 * 1024) throw new Error("Invoice PDF exceeds 15 MB.");
        if (buffer.subarray(0, 5).toString("ascii") !== "%PDF-") throw new Error("Generated invoice payload is not a valid PDF.");

        console.log(`[WhatsApp Gateway] Sending PDF invoice to ${jid} (${buffer.length} bytes)...`);
        const sent = await sock.sendMessage(jid, { document: buffer, mimetype: "application/pdf", fileName });

        res.writeHead(200, { "Content-Type": "application/json" });
        res.end(JSON.stringify({ success: true, status: "sent", to: jid, messageId: sent?.key?.id, type: "document", mimetype: "application/pdf", fileName }));
      } catch (err) {
        const message = err?.message || String(err);
        console.error("[WhatsApp Gateway] Error sending PDF document:", message);
        if (!res.headersSent) res.writeHead(500, { "Content-Type": "application/json" });
        if (!res.writableEnded) res.end(JSON.stringify({ success: false, error: message }));
      }
    });
    return;
  }

'''
          p.write_text(s[:start] + block + s[end:], encoding='utf-8')
          PY
      - name: Commit gateway patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/whatsapp-gateway.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(gateway): robust PDF document endpoint'
          git push
