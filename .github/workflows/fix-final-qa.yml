name: Fix final QA regression

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Fix final QA regression') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch DMT reconciliation deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/business/dmt-workspace.tsx')
          s = p.read_text()
          old = 'View reconciliation'
          new = 'View reconciliation →'
          if 'View reconciliation →' not in s and old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/business/dmt-workspace.tsx
          git diff --cached --quiet || git commit -m 'Fix DMT reconciliation deep link'
          git push
