name: Repair Settings Sidebar

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair settings sidebar
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/dashboard-shell.tsx')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '    # Keep the full navigation visible on System Settings.',
              '    // Keep the full navigation visible on System Settings.'
          )

          old_toggle = '''  function toggle() {
    setCollapsed((c) => {
      const next = !c;'''
          new_toggle = '''  function toggle() {
    setCollapsed((c) => {
      if (pathname === "/settings") {
        return false;
      }
      const next = !c;'''
          if 'if (pathname === "/settings")' not in text:
              if text.count(old_toggle) != 1:
                  raise SystemExit('toggle block not found exactly once')
              text = text.replace(old_toggle, new_toggle, 1)

          path.write_text(text, encoding='utf-8')
          print('Settings sidebar repair applied.')
          PY

          if grep -q '    // Keep the full navigation visible on System Settings.' components/dashboard-shell.tsx \
             && grep -q 'if (pathname === "/settings")' components/dashboard-shell.tsx; then
            echo 'Settings sidebar code is repaired.'
          else
            echo 'Settings sidebar repair validation failed.'
            exit 1
          fi
      - name: Commit repaired code and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/dashboard-shell.tsx
          git rm .github/workflows/patch-settings-sidebar.yml
          git commit -m "fix: settings sidebar always expanded [settings-sidebar-auto-patch]"
          git push origin HEAD:main
