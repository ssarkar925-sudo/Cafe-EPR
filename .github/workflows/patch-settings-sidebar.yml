name: Repair Settings Sidebar

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair settings sidebar
        shell: bash
        run: |
          sed -i 's/^    # Keep the full navigation visible on System Settings\./    \/\/ Keep the full navigation visible on System Settings./' components/dashboard-shell.tsx
          perl -0pi -e 's/      const next = !c;/      if (pathname === "\/settings") return false;\n      const next = !c;/' components/dashboard-shell.tsx
          grep -q '    \/\/ Keep the full navigation visible on System Settings.' components/dashboard-shell.tsx
          grep -q 'if (pathname === "/settings") return false;' components/dashboard-shell.tsx
      - name: Commit repaired code and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/dashboard-shell.tsx
          git rm .github/workflows/patch-settings-sidebar.yml
          git commit -m "fix: settings sidebar always expanded [settings-sidebar-auto-patch]"
          git push origin HEAD:main
