name: Apply Mobile Dashboard Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-mobile-dashboard-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch mobile dashboard shell
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("components/dashboard-shell.tsx")
          s = p.read_text(encoding="utf-8")

          # Keep the main mobile page content in its own stacking context so
          # the mobile sidebar/backdrop always sits above global quick-access UI.
          old_page = '        <div className="erp-page-content min-h-[calc(100vh-4rem)] p-4 sm:p-5 lg:px-6 lg:pt-0 pb-24 lg:pb-6">{children}</div>'
          new_page = '        <div className="erp-page-content relative z-0 [isolation:isolate] lg:[isolation:auto] min-h-[calc(100vh-4rem)] p-4 sm:p-5 lg:px-6 lg:pt-0 pb-24 lg:pb-6">{children}</div>'
          if old_page not in s:
              raise SystemExit("erp-page-content anchor not found")
          s = s.replace(old_page, new_page, 1)

          # The mobile bottom navigation already provides the Cafe AI destination;
          # remove the redundant floating dashboard AI button entirely.
          old_ai = '''      {isExecutiveDashboard && (
        <Link
          href="/ai-agent"
          aria-label="Open Cafe AI Agent"
          title="Cafe AI Agent"
          className="fixed bottom-5 right-5 z-20 flex h-11 w-11 items-center justify-center rounded-2xl border border-indigo-200/70 bg-white/60 text-indigo-500/60 shadow-sm backdrop-blur-md transition-all duration-200 hover:bg-white/90 hover:text-indigo-600 hover:opacity-100 dark:border-indigo-400/20 dark:bg-slate-900/45 dark:text-indigo-300/55 dark:hover:bg-slate-900/85 dark:hover:text-indigo-300"
        >
          <span aria-hidden="true" className="text-[17px] leading-none">✦</span>
        </Link>
      )}
'''
          if old_ai not in s:
              raise SystemExit("dashboard floating AI button block not found")
          s = s.replace(old_ai, "", 1)

          p.write_text(s, encoding="utf-8")
          print("Mobile dashboard fix applied")
          PY

      - name: Commit source changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-mobile-dashboard-fix.yml
          git add components/dashboard-shell.tsx .github/workflows/apply-mobile-dashboard-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(mobile): remove dashboard AI float and fix drawer stacking"
          git push
