name: Financial Boundary Patch

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/financial-hardening-final
          fetch-depth: 1
      - name: Remove client financial fallbacks and ledger writes
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path("components/business/business-client.tsx")
          s = p.read_text()

          patterns = [
              (r'''\n      // Resilient fallback if create_recharge RPC is missing or schema cache not reloaded\n      if \(error && \(error\.message\?\.includes\("schema cache"\) \|\| error\.code === "PGRST202" \|\| error\.message\?\.includes\("function public\.create_recharge"\)\)\) \{.*?\n      \}\n    \} else \{''', '''\n      if (error) {\n        // Financial writes are fail-closed: never fall back to direct table mutations.\n        throw new Error(`Canonical create_recharge RPC failed: ${error.message}`);\n      }\n    } else {'''),
              (r'''\n    // Synchronize Cashbook & Payment Accounts for all transaction types\n    if \(d\.status === "success"\) \{\n      await syncCashbookForTxn\(service, d\.transaction_number as string, d\.id as string, payload, initialPaymentInstruments\);\n    \}\n''', '\n'),
              (r'''\n  async function syncCashbookForTxn\(.*?\n  \}\n\n  function handleSendWhatsAppTxn''', '\n  function handleSendWhatsAppTxn'),
              (r'''\n    if \(reverseTxn\.service_type === "dmt"\) \{.*?\n    \}\n\n    setTxns\(\(prev\) => prev\.map''', '\n\n    setTxns((prev) => prev.map'),
              (r'''\n    await supabase\.from\("cash_entries"\)\.delete\(\)\.eq\("ref_type", "transaction"\)\.eq\("ref_id", deleteTxn\.id\);\n''', '\n'),
          ]

          for pattern, replacement in patterns:
              s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f"patch pattern matched {n} times: {pattern[:100]}")
              s = s2

          p.write_text(s)
      - name: Verify client has no direct financial mutations
        run: |
          if grep -nE 'from\("(transactions|cash_entries|customer_ledger|customers)"\)\.(insert|update|upsert|delete)' components/business/business-client.tsx; then
            echo "Direct financial table mutation remains in business-client.tsx"
            exit 1
          fi
      - name: Commit source change and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/business/business-client.tsx
          git commit -m "fix: route business financial legs through RPCs"
          git rm -f .github/workflows/financial-boundary-patch.yml
          git commit -m "chore: remove one-shot financial boundary patch workflow"
          git push origin HEAD:chore/financial-hardening-final
