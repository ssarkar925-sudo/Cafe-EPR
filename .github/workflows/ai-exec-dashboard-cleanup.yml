name: Apply Executive Dashboard Cleanup

on:
  push:
    paths:
      - .github/workflows/ai-exec-dashboard-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply dashboard UI changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          shell = Path("components/dashboard-shell.tsx")
          shell_text = shell.read_text(encoding="utf-8")

          old = '  const meta = metaFor(pathname);\n'
          new = '  const meta = metaFor(pathname);\n  const isExecutiveDashboard = pathname === "/dashboard";\n'
          if old not in shell_text:
              raise SystemExit("dashboard-shell.tsx: pathname metadata anchor not found")
          shell_text = shell_text.replace(old, new, 1)

          old = '''        <Link href="/ai-agent" aria-label="Open Cafe AI Agent" title="Open Cafe AI Agent" className="flex h-8 w-8 items-center justify-center rounded-xl border border-indigo-200 bg-indigo-50 text-indigo-700 transition hover:bg-indigo-100 dark:border-indigo-400/20 dark:bg-indigo-500/10 dark:text-indigo-300 dark:hover:bg-indigo-500/20"><span aria-hidden="true">✦</span></Link>\n'''
          new = '''        {!isExecutiveDashboard && (\n          <Link href="/ai-agent" aria-label="Open Cafe AI Agent" title="Open Cafe AI Agent" className="flex h-8 w-8 items-center justify-center rounded-xl border border-indigo-200 bg-indigo-50 text-indigo-700 transition hover:bg-indigo-100 dark:border-indigo-400/20 dark:bg-indigo-500/10 dark:text-indigo-300 dark:hover:bg-indigo-500/20"><span aria-hidden="true">✦</span></Link>\n        )}\n'''
          if old not in shell_text:
              raise SystemExit("dashboard-shell.tsx: mobile AI button not found")
          shell_text = shell_text.replace(old, new, 1)

          old = '''            <Link href="/pos" className="flex items-center gap-1.5 rounded-xl bg-blue-600 px-3.5 py-1.5 text-xs font-black text-white shadow-sm shadow-blue-500/20 transition hover:bg-blue-700 shrink-0"><span>+ New Bill</span><kbd className="rounded bg-blue-700 px-1 py-0.2 text-[9px] font-bold">F2</kbd></Link>\n            <Link href="/ai-agent" aria-label="Open Cafe AI Agent" title="Open Cafe AI Agent" className="flex items-center gap-1.5 rounded-xl border border-indigo-200 bg-indigo-50 px-3 py-1.5 text-xs font-black text-indigo-700 shadow-sm transition hover:bg-indigo-100 dark:border-indigo-400/20 dark:bg-indigo-500/10 dark:text-indigo-300 dark:hover:bg-indigo-500/20 shrink-0"><span aria-hidden="true">✦</span><span className="hidden xl:inline">Cafe AI Agent</span><span className="xl:hidden">AI</span></Link>\n'''
          new = '''            {!isExecutiveDashboard && (\n              <Link href="/pos" className="flex items-center gap-1.5 rounded-xl bg-blue-600 px-3.5 py-1.5 text-xs font-black text-white shadow-sm shadow-blue-500/20 transition hover:bg-blue-700 shrink-0"><span>+ New Bill</span><kbd className="rounded bg-blue-700 px-1 py-0.2 text-[9px] font-bold">F2</kbd></Link>\n            )}\n            {!isExecutiveDashboard && (\n              <Link href="/ai-agent" aria-label="Open Cafe AI Agent" title="Open Cafe AI Agent" className="flex items-center gap-1.5 rounded-xl border border-indigo-200 bg-indigo-50 px-3 py-1.5 text-xs font-black text-indigo-700 shadow-sm transition hover:bg-indigo-100 dark:border-indigo-400/20 dark:bg-indigo-500/10 dark:text-indigo-300 dark:hover:bg-indigo-500/20 shrink-0"><span aria-hidden="true">✦</span><span className="hidden xl:inline">Cafe AI Agent</span><span className="xl:hidden">AI</span></Link>\n            )}\n'''
          if old not in shell_text:
              raise SystemExit("dashboard-shell.tsx: desktop header actions not found")
          shell_text = shell_text.replace(old, new, 1)

          old = '''      <GlobalSearch open={searchOpen} onClose={() => setSearchOpen(false)} />\n      <MobileBottomNav />\n'''
          new = '''      <GlobalSearch open={searchOpen} onClose={() => setSearchOpen(false)} />\n      {isExecutiveDashboard && (\n        <Link\n          href="/ai-agent"\n          aria-label="Open Cafe AI Agent"\n          title="Cafe AI Agent"\n          className="fixed bottom-5 right-5 z-20 flex h-11 w-11 items-center justify-center rounded-2xl border border-indigo-200/70 bg-white/60 text-indigo-500/60 shadow-sm backdrop-blur-md transition-all duration-200 hover:bg-white/90 hover:text-indigo-600 hover:opacity-100 dark:border-indigo-400/20 dark:bg-slate-900/45 dark:text-indigo-300/55 dark:hover:bg-slate-900/85 dark:hover:text-indigo-300"\n        >\n          <span aria-hidden="true" className="text-[17px] leading-none">✦</span>\n        </Link>\n      )}\n      <MobileBottomNav />\n'''
          if old not in shell_text:
              raise SystemExit("dashboard-shell.tsx: footer mount anchor not found")
          shell_text = shell_text.replace(old, new, 1)
          shell.write_text(shell_text, encoding="utf-8")

          client = Path("components/dashboard/dashboard-client.tsx")
          client_text = client.read_text(encoding="utf-8")

          state_pattern = re.compile(r'\n  const \[quickActions, setQuickActions\][\s\S]*?\n  useEffect\(\(\) => \{\n    const updateDateTimeAndGreeting', re.M)
          client_text, count = state_pattern.subn('\n\n  useEffect(() => {\n    const updateDateTimeAndGreeting', client_text, count=1)
          if count != 1:
              raise SystemExit("dashboard-client.tsx: quick action state/setup block not found")

          quick_actions_pattern = re.compile(r'        \{/\* Quick Actions Hub \*/\}[\s\S]*?\n      </div>\n\n      \{/\* ===============================================================================\n          7\. RECENT TRANSACTION STREAM\n      =============================================================================== \*/\}', re.M)
          replacement = '''        {/* Financial Control Center */}\n        <div className="bento-surface p-6 lg:col-span-6 dark:bg-slate-900/90 flex flex-col justify-between">\n          <div>\n            <div className="flex items-center justify-between border-b border-slate-100 pb-3 dark:border-white/5">\n              <div className="flex items-center gap-2">\n                <span className="flex h-7 w-7 items-center justify-center rounded-xl bg-indigo-500/10 text-indigo-600 dark:bg-indigo-500/20 dark:text-indigo-400">\n                  <ActionVectorIcon icon="trial-balance" className="h-4 w-4" />\n                </span>\n                <div>\n                  <h3 className="font-bold text-slate-900 dark:text-white">Financial Control Center</h3>\n                  <p className="text-[10px] font-medium text-slate-400">Live counter, closing &amp; integrity signals</p>\n                </div>\n              </div>\n              <span className={`rounded-full px-2 py-0.5 text-[10px] font-bold uppercase ${\n                data.auditData.status === "PASS"\n                  ? "bg-emerald-500/10 text-emerald-600 dark:text-emerald-400"\n                  : "bg-amber-500/10 text-amber-600 dark:text-amber-400"\n              }`}>\n                {data.auditData.status || "CHECK"}\n              </span>\n            </div>\n\n            <div className="mt-4 grid grid-cols-2 gap-3">\n              <div className="rounded-2xl border border-emerald-200/70 bg-emerald-50/40 p-3 dark:border-emerald-900/30 dark:bg-emerald-950/15">\n                <div className="text-[10px] font-bold uppercase tracking-wider text-emerald-600 dark:text-emerald-400">Net Cash Movement</div>\n                <div className={`mt-1 text-lg font-black ${\n                  (data.todayMetrics.moneyIn - data.todayMetrics.moneyOut) >= 0\n                    ? "text-emerald-700 dark:text-emerald-400"\n                    : "text-rose-600 dark:text-rose-400"\n                }`}>\n                  {(data.todayMetrics.moneyIn - data.todayMetrics.moneyOut) >= 0 ? "+" : "−"}{inr(Math.abs(data.todayMetrics.moneyIn - data.todayMetrics.moneyOut))}\n                </div>\n                <div className="mt-0.5 text-[10px] text-slate-400">Money in less money out</div>\n              </div>\n\n              <div className="rounded-2xl border border-blue-200/70 bg-blue-50/40 p-3 dark:border-blue-900/30 dark:bg-blue-950/15">\n                <div className="text-[10px] font-bold uppercase tracking-wider text-blue-600 dark:text-blue-400">Today&apos;s Transactions</div>\n                <div className="mt-1 text-lg font-black text-slate-900 dark:text-white">{data.todayMetrics.transactionCount}</div>\n                <div className="mt-0.5 text-[10px] text-slate-400">Avg ticket {inr(data.todayMetrics.avgTicketSize)}</div>\n              </div>\n\n              <div className="rounded-2xl border border-amber-200/70 bg-amber-50/40 p-3 dark:border-amber-900/30 dark:bg-amber-950/15">\n                <div className="text-[10px] font-bold uppercase tracking-wider text-amber-600 dark:text-amber-400">Quick Sales</div>\n                <div className="mt-1 text-lg font-black text-slate-900 dark:text-white">{data.todayMetrics.quickSaleCount}</div>\n                <div className="mt-0.5 text-[10px] text-slate-400">{inr(data.todayMetrics.quickSaleAmount)} booked</div>\n              </div>\n\n              <div className="rounded-2xl border border-slate-200/80 bg-slate-50/70 p-3 dark:border-white/10 dark:bg-white/[0.03]">\n                <div className="text-[10px] font-bold uppercase tracking-wider text-slate-500">Day Close Variance</div>\n                <div className={`mt-1 text-lg font-black ${\n                  Math.abs(data.dayCloseStatus.difference) > 0.01 ? "text-rose-600 dark:text-rose-400" : "text-emerald-600 dark:text-emerald-400"\n                }`}>\n                  {inr(data.dayCloseStatus.difference)}\n                </div>\n                <div className="mt-0.5 truncate text-[10px] text-slate-400">{data.dayCloseStatus.statusLabel || data.dayCloseStatus.status || "No variance"}</div>\n              </div>\n            </div>\n          </div>\n\n          <div className="mt-4 flex flex-wrap items-center justify-between gap-2 border-t border-slate-100 pt-3 text-[11px] dark:border-white/5">\n            <span className="text-slate-400">Internal transfers: <strong className="text-slate-600 dark:text-slate-300">{inr(data.todayMetrics.internalTransfers)}</strong></span>\n            <Link href="/finance/day-close" className="font-bold text-blue-600 hover:underline dark:text-blue-400">Open Control Ledger →</Link>\n          </div>\n        </div>\n      </div>\n\n      {/* ===============================================================================\n          7. RECENT TRANSACTION STREAM\n      =============================================================================== */}'''
          client_text, count = quick_actions_pattern.subn(replacement, client_text, count=1)
          if count != 1:
              raise SystemExit("dashboard-client.tsx: Quick Action Hub section not found")

          modal_pattern = re.compile(r'\n      \{/\* Quick Actions Customization Modal \*/\}[\s\S]*?\n      \)\}\n    </div>\n  \);', re.M)
          client_text, count = modal_pattern.subn('\n    </div>\n  );', client_text, count=1)
          if count != 1:
              raise SystemExit("dashboard-client.tsx: quick action customization modal not found")

          client.write_text(client_text, encoding="utf-8")
          print("Executive dashboard cleanup applied successfully")
          PY

      - name: Commit source changes
        shell: bash
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/ai-exec-dashboard-cleanup.yml
          git add components/dashboard-shell.tsx components/dashboard/dashboard-client.tsx .github/workflows/ai-exec-dashboard-cleanup.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(dashboard): streamline executive dashboard controls"
          git push
