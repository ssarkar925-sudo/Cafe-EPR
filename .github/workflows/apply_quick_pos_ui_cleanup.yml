name: Apply Quick POS UI Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply UI changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          quick = Path("components/pos/quick-sale.tsx")
          pos = Path("components/pos/pos-client.tsx")

          quick_text = quick.read_text(encoding="utf-8")
          pos_text = pos.read_text(encoding="utf-8")

          recent_button = '''                <button
            onClick={() => setRecentOpen(true)}
            className="rounded-xl border border-slate-200 px-3 py-2.5 text-sm font-semibold text-slate-600 transition hover:bg-slate-50"
          >
            Recent Sales (F1)
          </button>\n'''

          # Match the exact lower Recent Sales block without relying on surrounding layout.
          quick_text = re.sub(
              r'''\n\s*<button\n\s*onClick=\{\(\) => setRecentOpen\(true\)\}\n\s*className="rounded-xl border border-slate-200 px-3 py-2\.5 text-sm font-semibold text-slate-600 transition hover:bg-slate-50"\n\s*>\n\s*Recent Sales \(F1\)\n\s*</button>''',
              "",
              quick_text,
              count=1,
          )

          # Remove only the lower Quick Fast-Sale Money Out action; the main POS header keeps its Money Out action.
          quick_text = re.sub(
              r'''\n\s*<button\n\s*onClick=\{\(\) => setShowMoneyOut\(\(v\) => !v\)\}\n\s*className=\{`rounded-xl px-3 py-2\.5 text-sm font-semibold transition \$\{\n\s*showMoneyOut \? "bg-rose-600 text-white" : "border border-rose-200 bg-rose-50 text-rose-600 hover:bg-rose-100"\n\s*\}`\}\n\s*>\n\s*Money Out\n\s*</button>''',
              "",
              quick_text,
              count=1,
          )

          quick.write_text(quick_text, encoding="utf-8")

          if "<span>Recent Sales</span>" not in pos_text:
              anchor = '''          </div>\n\n          <button\n            type="button"\n            onClick={() => {\n              setRecallOpen(true);\n              setHeldBills(loadHeld());\n            }}'''
              recent_top = '''          </div>\n\n          {mode === "quick" && (\n            <button\n              type="button"\n              onClick={() => window.dispatchEvent(new KeyboardEvent("keydown", { key: "F1", bubbles: true }))}\n              className="inline-flex items-center gap-1.5 rounded-xl border border-slate-200 bg-slate-50 px-3 py-1.5 text-xs font-bold text-slate-700 transition hover:bg-slate-100 dark:border-white/10 dark:bg-white/5 dark:text-slate-300 dark:hover:bg-white/10"\n              title="Open Recent Quick Sales (F1)"\n            >\n              <span className="text-sm leading-none">↻</span>\n              <span>Recent Sales</span>\n            </button>\n          )}\n\n          <button\n            type="button"\n            onClick={() => {\n              setRecallOpen(true);\n              setHeldBills(loadHeld());\n            }}'''
              if anchor not in pos_text:
                  raise SystemExit("Could not find POS mode-switcher insertion point")
              pos_text = pos_text.replace(anchor, recent_top, 1)
              pos.write_text(pos_text, encoding="utf-8")

          # This is a one-shot migration; remove the helper workflow after applying the changes.
          Path(".github/workflows/apply_quick_pos_ui_cleanup.yml").unlink(missing_ok=True)

          if subprocess.run(["git", "diff", "--quiet"]).returncode == 0:
              print("No changes needed; nothing to commit.")
              raise SystemExit(0)

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "components/pos/quick-sale.tsx", "components/pos/pos-client.tsx", ".github/workflows/apply_quick_pos_ui_cleanup.yml"], check=True)
          subprocess.run(["git", "commit", "-m", "refactor: streamline quick sale actions"], check=True)
          subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)
          PY
