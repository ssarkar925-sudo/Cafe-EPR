name: One-time POS JSX repair

on:
  push:
    branches:
      - fix/invoice-edit-pos-reset

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/invoice-edit-pos-reset
          fetch-depth: 0

      - name: Remove extra POS customer closing tag
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('components/pos/pos-shell.tsx')
          lines = path.read_text(encoding='utf-8').splitlines()
          matches = [i for i, line in enumerate(lines) if 'data-pos-customer-action="reference"' in line]

          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one POS customer reference line, found {len(matches)}')

          i = matches[0]
          line = lines[i]
          expected = '</div></div></div>'
          if not line.rstrip().endswith(expected):
              raise SystemExit('POS customer line does not have the expected trailing JSX structure')

          lines[i] = line.rstrip()[:-len('</div>')]
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/pos/pos-shell.tsx
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'fix: repair POS JSX customer section'
          git push origin HEAD:fix/invoice-edit-pos-reset
