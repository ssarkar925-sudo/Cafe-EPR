name: One-time POS JSX repair

'on':
  push:
    branches: [fix/invoice-edit-pos-reset]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/invoice-edit-pos-reset
          fetch-depth: 0

      - name: Remove extra POS customer closing tag
        shell: bash
        run: |
          sed -i '/data-pos-customer-action="reference"/ s#</div></div></div>$#</div></div>#' components/pos/pos-shell.tsx
          grep -F 'data-pos-customer-action="reference"' components/pos/pos-shell.tsx | grep -F '</div></div></div>' && exit 1 || true

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/pos/pos-shell.tsx
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'fix: repair POS JSX customer section'
          git push origin HEAD:fix/invoice-edit-pos-reset
