name: Fix Quick POS Recent Sales

'on':
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply UI fix
        run: python3 .github/scripts/fix_quick_pos_recent_sales.py
