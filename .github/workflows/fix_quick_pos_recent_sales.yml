name: Fix Quick POS Recent Sales

'on':
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply UI fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          pos = Path('components/pos/pos-client.tsx')
          quick = Path('components/pos/quick-sale.tsx')
          marker = Path('quick-pos-ui-trigger.txt')

          pos_text = pos.read_text(encoding='utf-8')
          quick_text = quick.read_text(encoding='utf-8')

          # Remove the misplaced Quick-mode Recent Sales button from the top action bar.
          top_pattern = re.compile(
              r'\n\s*\{mode === "quick" && \(\s*<button\s*type="button"\s*onClick=\{\(\) => window\.dispatchEvent\(new KeyboardEvent\("keydown", \{ key: "F1", bubbles: true \}\\)\)\}\s*className="inline-flex[^\n]*"\s*title="Open Recent Quick Sales \(F1\)"\s*>\s*<span className="text-sm leading-none">↻</span>\s*<span>Recent Sales</span>\s*</button>\s*\)\}\n',
              re.S,
          )
          pos_text, removed = top_pattern.subn('\n', pos_text, count=1)

          # Add Recent Sales beside Recall in the Quick Sale Current Sale header.
          recent_button = '''                <button
                  type="button"
                  onClick={() => setRecentOpen(true)}
                  className="rounded-lg border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-semibold text-violet-600 transition hover:bg-violet-50"
                  title="Open recent quick sales"
                >
                  ↻ Recent Sales
                </button>
'''
          if 'title="Open recent quick sales"' not in quick_text:
              start = quick_text.find('/* ── Current Sale')
              end = quick_text.find('<label className={labelClass}>Customer (F3)</label>', start)
              if start < 0 or end < 0:
                  raise SystemExit('Quick Sale Current Sale section not found')
              segment = quick_text[start:end]
              anchor = '''              <div className="flex items-center gap-1.5">
                <button
                  onClick={() => setRecallOpen(true)'''
              if anchor not in segment:
                  raise SystemExit('Quick Sale Recall header anchor not found')
              segment = segment.replace(anchor, '              <div className="flex items-center gap-1.5">\n' + recent_button + '                <button\n                  onClick={() => setRecallOpen(true)', 1)
              quick_text = quick_text[:start] + segment + quick_text[end:]

          # Keep the compact checkout action hierarchy: Hold | Pay, then full-width Pay & Print.
          old_actions = '''              <div className="mt-3 grid grid-cols-2 gap-2">
                <button
                  onClick={holdCart}
                  disabled={payDisabled}
                  className="rounded-xl border border-slate-200 px-3 py-2.5 text-sm font-semibold text-slate-600 transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-50"
                >
                  Hold Sale
                </button>
              </div>
              <div className="mt-2 grid grid-cols-2 gap-2">
                <button
                  onClick={() => record(false)}
                  disabled={payDisabled}
                  className="rounded-xl bg-[#0f172a] px-3 py-2.5 text-sm font-semibold text-white transition hover:bg-slate-800 disabled:cursor-not-allowed disabled:opacity-50"
                >
                  ₹ Pay
                </button>
              </div>
'''
          new_actions = '''              <div className="mt-3 grid grid-cols-2 gap-2">
                <button
                  onClick={holdCart}
                  disabled={payDisabled}
                  className="rounded-xl border border-slate-200 px-3 py-2.5 text-sm font-semibold text-slate-600 transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-50"
                >
                  Hold Sale
                </button>
                <button
                  onClick={() => record(false)}
                  disabled={payDisabled}
                  className="rounded-xl bg-[#0f172a] px-3 py-2.5 text-sm font-semibold text-white transition hover:bg-slate-800 disabled:cursor-not-allowed disabled:opacity-50"
                >
                  ₹ Pay
                </button>
              </div>
'''
          if old_actions in quick_text:
              quick_text = quick_text.replace(old_actions, new_actions, 1)

          pos.write_text(pos_text, encoding='utf-8')
          quick.write_text(quick_text, encoding='utf-8')

          marker.unlink(missing_ok=True)
          Path('.github/workflows/move_quick_recent_sales.yml').unlink(missing_ok=True)
          Path('.github/workflows/fix_quick_pos_recent_sales.yml').unlink(missing_ok=True)

          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', 'components/pos/pos-client.tsx', 'components/pos/quick-sale.tsx', '.github/workflows/move_quick_recent_sales.yml', '.github/workflows/fix_quick_pos_recent_sales.yml', 'quick-pos-ui-trigger.txt'], check=True)
          if subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode == 0:
              print('No UI changes needed')
              raise SystemExit(0)
          subprocess.run(['git', 'commit', '-m', 'fix: place quick POS recent sales in cart header'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
          PY
