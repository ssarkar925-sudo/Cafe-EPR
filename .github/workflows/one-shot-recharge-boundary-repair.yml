name: One-shot recharge boundary repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch recharge workspace to use canonical RPCs
        shell: python
        run: |
          from pathlib import Path

          path = Path('components/business/recharge-workspace.tsx')
          source = path.read_text()

          start_marker = '      // 1. Generate Transaction Number'
          end_marker = '      // 7. Update UI State & Open Celebration Receipt'
          start = source.index(start_marker)
          end = source.index(end_marker)

          replacement = '''      const todayIso = new Date().toISOString();
      const todayDate = todayIso.slice(0, 10);

      // Resolve provider metadata locally; the database remains authoritative for commission/cost.
      const matchedDbProvider = providers.find(
        (p) =>
          p.id === selectedOperatorCode ||
          p.name.toLowerCase().includes(selectedOperatorCode.toLowerCase())
      );
      const operatorName = allOperators.find((o) => o.code === selectedOperatorCode)?.name || 'Mobile Recharge';

      const allocations = customerPaymentAllocations
        .filter((row) => Number(row.amount) > 0)
        .map((row) => ({
          method: row.method,
          amount: Number(row.amount),
          instrument_id: row.instrument_id || null,
        }));

      // All recharge financial writes must cross the SECURITY DEFINER/idempotent RPC boundary.
      const { data: newTxn, error: txnErr } = await supabase.rpc('create_recharge', {
        p_provider_id: matchedDbProvider?.id || null,
        p_transaction_date: todayDate,
        p_transaction_timestamp: todayIso,
        p_customer_id: selectedCustomerId || null,
        p_customer_mobile: cleanMobile,
        p_reference: reference.trim() || null,
        p_remarks: remarks.trim() || `Recharge ${cleanMobile} (${operatorName})`,
        p_status: 'success',
        p_amount: rechargeAmount,
        p_service_fee: custFee,
        p_customer_pay_method: customerPayMethod,
        p_pay_from_instrument_id: fundingInstId,
        p_pay_from_method: selectedFundingAccount.type,
        p_customer_collected_amount: customerCollectionAmount,
        p_customer_due_amount: customerDueAmount,
        p_customer_collection_allocations: allocations,
      });

      if (txnErr) {
        showToast('error', txnErr.message);
        setSubmitting(false);
        return;
      }

'''
          path.write_text(source[:start] + replacement + source[end:])

          # Recharge reversal is also fully delegated to the canonical RPC.
          source = path.read_text()
          start_marker = '      // Offset cash entries'
          end_marker = '      setTransactions((prev) =>'
          start = source.index(start_marker)
          end = source.index(end_marker)
          replacement = '''      // reverse_business_txn now reverses every stored money leg and any outstanding Khata due atomically.
'''
          path.write_text(source[:start] + replacement + source[end:])

      - name: Verify no direct recharge financial table writes remain
        run: |
          ! grep -nE 'from\("(transactions|cash_entries|customer_ledger)"\)\.(insert|update|upsert|delete)' components/business/recharge-workspace.tsx

      - name: Commit source repair and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/business/recharge-workspace.tsx
          git rm -f .github/workflows/one-shot-recharge-boundary-repair.yml
          git commit -m 'fix(finance): route recharge writes through canonical RPC boundary'
          git push origin HEAD:main
