name: Repair Bill Fetch Effect

'on':
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch effect dependency
        run: python scripts/fix_bill_fetch_effect.py
      - name: Commit patch and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-bill-fetch-effect.yml scripts/fix_bill_fetch_effect.py
          git add components/business/utility-bill-workspace.tsx
          git commit -m "fix: stabilize bill auto-fetch effect"
          git push origin HEAD:main
