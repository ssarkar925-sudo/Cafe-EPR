name: Repair build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore accidentally truncated recharge workspace
        run: git checkout 5026d750a4da05371ec4e68d0d091ee8be28aaf0 -- components/business/recharge-workspace.tsx

      - name: Repair Txn type
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/business/recharge-workspace.tsx')
          s = p.read_text()
          anchor = '  pool_credit?: number | string;\n'
          addition = ('  customer_collected_amount?: number | string;\n'
                      '  customer_due_amount?: number | string;\n'
                      '  customer_collection_method?: string | null;\n')
          if addition not in s:
              if anchor not in s:
                  raise SystemExit('Txn type anchor missing')
              s = s.replace(anchor, anchor + addition, 1)
              p.write_text(s)
          PY

      - name: Repair payment instrument type
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/settings/settings-config.ts')
          s = p.read_text()
          anchor = '  balance: number | string;\n'
          addition = '  current_balance?: number | string;\n'
          if addition not in s:
              if anchor not in s:
                  raise SystemExit('InstrumentRow balance anchor missing')
              s = s.replace(anchor, anchor + addition, 1)
              p.write_text(s)
          PY

      - name: Permanently correct dashboard credit facility mapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/(dashboard)/dashboard/page.tsx')
          s = p.read_text()
          old = '''  const creditCardLimit = Number(rawPools.credit_card?.opening || 0);\n  const creditCardUsed = Number(rawPools.credit_card?.movements || 0);\n  const creditCardAvailable = Math.max(0, creditCardLimit - creditCardUsed);'''
          new = '''  const creditCardLimit = Number(rawPools.credit_card?.credit_limit || 0);\n  const creditCardUsed = Number(rawPools.credit_card?.used_credit || 0);\n  const creditCardAvailable = Number(\n    rawPools.credit_card?.available_credit ?? Math.max(0, creditCardLimit - creditCardUsed)\n  );'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Credit facility mapping anchor missing')
          p.write_text(s)
          PY

      - name: Permanently correct digital service performance aggregation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/(dashboard)/dashboard/page.tsx')
          s = p.read_text()
          replacements = {
              '  const aepsTxns = transactions.filter((t) => t.service_type === "aeps");': '  const aepsTxns = transactions.filter((t) => t.service_type === "aeps" && t.status === "success");',
              '  const dmtTxns = transactions.filter((t) => t.service_type === "dmt");': '  const dmtTxns = transactions.filter((t) => t.service_type === "dmt" && t.status === "success");',
              '  const upiTxns = transactions.filter((t) => t.service_type === "upi");': '  const upiTxns = transactions.filter((t) => t.service_type === "upi" && t.status === "success");',
              '  const rechargeTxns = transactions.filter((t) => t.service_type === "recharge");': '  const rechargeTxns = transactions.filter((t) => t.service_type === "recharge" && t.status === "success");',
          }
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new, 1)
              elif new not in s:
                  raise SystemExit(f'Service aggregation anchor missing: {old}')
          p.write_text(s)
          PY

      - name: Correct dashboard service reporting scope label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/dashboard/dashboard-client.tsx')
          s = p.read_text()
          old = 'Real-time throughput, transaction volume, and fee income across digital counters.'
          new = 'Successful transaction throughput, service volume, and earned income — last 30 days.'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Service reporting label anchor missing')
          p.write_text(s)
          PY

      - name: Remove temporary dashboard hardening workflow
        run: rm -f .github/workflows/dashboard-metrics-hardening.yml

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/business/recharge-workspace.tsx components/settings/settings-config.ts 'app/(dashboard)/dashboard/page.tsx' components/dashboard/dashboard-client.tsx .github/workflows/repair-build.yml .github/workflows/dashboard-metrics-hardening.yml
          git diff --cached --quiet || git commit -m 'fix(dashboard): correct liquidity and service performance calculations'
          git push
