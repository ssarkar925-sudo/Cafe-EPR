name: Repair build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore accidentally truncated recharge workspace
        run: git checkout 5026d750a4da05371ec4e68d0d091ee8be28aaf0 -- components/business/recharge-workspace.tsx

      - name: Repair Txn type
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/business/recharge-workspace.tsx')
          s = p.read_text()
          anchor = '  pool_credit?: number | string;\n'
          addition = ('  customer_collected_amount?: number | string;\n'
                      '  customer_due_amount?: number | string;\n'
                      '  customer_collection_method?: string | null;\n')
          if addition not in s:
              if anchor not in s:
                  raise SystemExit('Txn type anchor missing')
              s = s.replace(anchor, anchor + addition, 1)
              p.write_text(s)
          PY

      - name: Repair payment instrument type
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/settings/settings-config.ts')
          s = p.read_text()
          anchor = '  balance: number | string;\n'
          addition = '  current_balance?: number | string;\n'
          if addition not in s:
              if anchor not in s:
                  raise SystemExit('InstrumentRow balance anchor missing')
              s = s.replace(anchor, anchor + addition, 1)
              p.write_text(s)
          PY

      - name: Permanently correct dashboard credit facility mapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/(dashboard)/dashboard/page.tsx')
          s = p.read_text()
          old = '''  const creditCardLimit = Number(rawPools.credit_card?.opening || 0);\n  const creditCardUsed = Number(rawPools.credit_card?.movements || 0);\n  const creditCardAvailable = Math.max(0, creditCardLimit - creditCardUsed);'''
          new = '''  const creditCardLimit = Number(rawPools.credit_card?.credit_limit || 0);\n  const creditCardUsed = Number(rawPools.credit_card?.used_credit || 0);\n  const creditCardAvailable = Number(\n    rawPools.credit_card?.available_credit ?? Math.max(0, creditCardLimit - creditCardUsed)\n  );'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Credit facility mapping anchor missing')
          p.write_text(s)
          PY

      - name: Permanently correct digital service performance aggregation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/(dashboard)/dashboard/page.tsx')
          s = p.read_text()
          replacements = {
              '  const aepsTxns = transactions.filter((t) => t.service_type === "aeps");': '  const aepsTxns = transactions.filter((t) => t.service_type === "aeps" && t.status === "success");',
              '  const dmtTxns = transactions.filter((t) => t.service_type === "dmt");': '  const dmtTxns = transactions.filter((t) => t.service_type === "dmt" && t.status === "success");',
              '  const upiTxns = transactions.filter((t) => t.service_type === "upi");': '  const upiTxns = transactions.filter((t) => t.service_type === "upi" && t.status === "success");',
              '  const rechargeTxns = transactions.filter((t) => t.service_type === "recharge");': '  const rechargeTxns = transactions.filter((t) => t.service_type === "recharge" && t.status === "success");',
          }
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new, 1)
              elif new not in s:
                  raise SystemExit(f'Service aggregation anchor missing: {old}')
          p.write_text(s)
          PY

      - name: Correct dashboard service reporting scope label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/dashboard/dashboard-client.tsx')
          s = p.read_text()
          old = 'Real-time throughput, transaction volume, and fee income across digital counters.'
          new = 'Successful transaction throughput, service volume, and earned income — last 30 days.'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Service reporting label anchor missing')
          p.write_text(s)
          PY

      - name: Make transaction history fit without horizontal scrolling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/business/bill-payment-hub.tsx')
          s = p.read_text()
          old = '''          <div className="overflow-x-auto">\n              <table className="w-full text-left text-xs">'''
          new = '''          <div className="overflow-hidden">\n              <table className="w-full table-fixed text-left text-[10px]">\n                <colgroup>\n                  <col style={{ width: "10%" }} />\n                  <col style={{ width: "11%" }} />\n                  <col style={{ width: "17%" }} />\n                  <col style={{ width: "15%" }} />\n                  <col style={{ width: "8%" }} />\n                  <col style={{ width: "10%" }} />\n                  <col style={{ width: "8%" }} />\n                  <col style={{ width: "8%" }} />\n                  <col style={{ width: "13%" }} />\n                </colgroup>'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('History table anchor missing')

          s = s.replace('className="px-4 py-3.5 whitespace-nowrap"', 'className="px-2.5 py-3 align-middle"')
          s = s.replace('className="px-4 py-3.5"', 'className="px-2.5 py-3 align-middle"')
          s = s.replace('className="px-4 py-3.5 text-right whitespace-nowrap"', 'className="px-2 py-3 align-middle text-right"')
          s = s.replace('className="px-4 py-3.5 whitespace-nowrap"', 'className="px-2.5 py-3 align-middle"')
          s = s.replace('className="font-mono font-bold text-slate-800 dark:text-slate-200">\n                              {t.transaction_number}', 'className="font-mono font-bold text-slate-800 dark:text-slate-200 break-all">\n                              {t.transaction_number}', 1)
          s = s.replace('className="block font-mono font-bold text-slate-800 dark:text-slate-200 truncate">', 'className="block font-mono font-bold text-slate-800 dark:text-slate-200 break-all line-clamp-2">', 1)
          p.write_text(s)
          PY

      - name: Universalize business transaction receipts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/business/receipt/[id]/page.tsx')
          s = p.read_text()

          old_titles = '''const SERVICE_TITLE: Record<string, string> = {\n  aeps: "AEPS CASH WITHDRAWAL",\n  dmt: "DMT MONEY TRANSFER",\n  upi: "UPI CASH OUT",\n};'''
          new_titles = '''const SERVICE_TITLE: Record<string, string> = {\n  aeps: "AEPS CASH WITHDRAWAL",\n  dmt: "DMT MONEY TRANSFER",\n  upi: "UPI COLLECTION",\n  recharge: "MOBILE RECHARGE",\n  recharge_due: "MOBILE RECHARGE",\n  bill_payment: "UTILITY BILL PAYMENT",\n  utility_bill: "UTILITY BILL PAYMENT",\n  utility: "UTILITY BILL PAYMENT",\n  google_play: "GOOGLE PLAY RECHARGE",\n  google_play_recharge: "GOOGLE PLAY RECHARGE",\n};'''
          if old_titles in s:
              s = s.replace(old_titles, new_titles, 1)
          elif new_titles not in s:
              raise SystemExit('Service title anchor missing')

          old_branch = '''          {service === "dmt" && ('''
          if old_branch not in s:
              raise SystemExit('DMT branch anchor missing')

          insert = '''          {(service === "recharge" || service === "recharge_due") && (\n            <>\n              <div className="flex justify-between">\n                <span>Mobile</span>\n                <span>{txn.customer_mobile || "-"}</span>\n              </div>\n              <div className="flex justify-between">\n                <span>Operator</span>\n                <span>{txn.providers?.name || "Telecom Operator"}</span>\n              </div>\n              {txn.reference && (\n                <div className="flex justify-between">\n                  <span>Operator Ref</span>\n                  <span>{txn.reference}</span>\n                </div>\n              )}\n              <div className="my-1 border-t border-dashed border-slate-400" />\n              <div className="flex justify-between text-sm font-bold">\n                <span>RECHARGE AMOUNT</span>\n                <span>{money(txn.amount)}</span>\n              </div>\n              {showCustomerFeeDetails && Number(txn.service_fee || 0) > 0 && (\n                <div className="flex justify-between text-[11px] text-slate-600">\n                  <span>Service Fee</span>\n                  <span>+{money(txn.service_fee)}</span>\n                </div>\n              )}\n              {showCustomerFeeDetails && Number(txn.service_fee || 0) > 0 && (\n                <div className="flex justify-between text-sm font-bold">\n                  <span>TOTAL PAID</span>\n                  <span>{money(Number(txn.amount || 0) + Number(txn.service_fee || 0))}</span>\n                </div>\n              )}\n            </>\n          )}\n\n          {(service === "google_play" || service === "google_play_recharge") && (\n            <>\n              <div className="flex justify-between">\n                <span>Provider</span>\n                <span>Google Play</span>\n              </div>\n              {txn.customer_mobile && (\n                <div className="flex justify-between">\n                  <span>Customer Mobile</span>\n                  <span>{maskedMobile}</span>\n                </div>\n              )}\n              {txn.reference && (\n                <div className="flex justify-between">\n                  <span>Voucher / Ref</span>\n                  <span>{txn.reference}</span>\n                </div>\n              )}\n              <div className="my-1 border-t border-dashed border-slate-400" />\n              <div className="flex justify-between text-sm font-bold">\n                <span>RECHARGE AMOUNT</span>\n                <span>{money(txn.amount)}</span>\n              </div>\n              {showCustomerFeeDetails && Number(txn.service_fee || 0) > 0 && (\n                <div className="flex justify-between text-sm font-bold">\n                  <span>TOTAL PAID</span>\n                  <span>{money(Number(txn.amount || 0) + Number(txn.service_fee || 0))}</span>\n                </div>\n              )}\n            </>\n          )}\n\n          {(service === "bill_payment" || service === "utility_bill" || service === "utility") && (\n            <>\n              <div className="flex justify-between">\n                <span>Biller</span>\n                <span>{txn.providers?.name || txn.remarks?.split(" (")[0] || "BBPS Biller"}</span>\n              </div>\n              <div className="flex justify-between">\n                <span>Consumer / Ref</span>\n                <span>{txn.reference || "-"}</span>\n              </div>\n              <div className="my-1 border-t border-dashed border-slate-400" />\n              <div className="flex justify-between text-sm font-bold">\n                <span>BILL AMOUNT</span>\n                <span>{money(txn.amount)}</span>\n              </div>\n              {showCustomerFeeDetails && Number(txn.service_fee || 0) > 0 && (\n                <div className="flex justify-between text-[11px] text-slate-600">\n                  <span>Service Fee</span>\n                  <span>+{money(txn.service_fee)}</span>\n                </div>\n              )}\n              {showCustomerFeeDetails && (\n                <div className="flex justify-between text-sm font-bold text-emerald-700">\n                  <span>TOTAL PAID</span>\n                  <span>{money(Number(txn.amount || 0) + Number(txn.service_fee || 0))}</span>\n                </div>\n              )}\n            </>\n          )}\n\n'''
          s = s.replace(old_branch, insert + old_branch, 1)

          s = s.replace('''          {txn.remarks && (''', '''          {service !== "aeps" && service !== "dmt" && service !== "upi" && txn.pool_credit_type && (\n            <div className="mt-2 text-[10px] text-slate-500">Service Type: {String(txn.pool_credit_type)}</div>\n          )}\n\n          {txn.remarks && (''', 1)

          p.write_text(s)
          PY

      - name: Remove temporary dashboard hardening workflow
        run: rm -f .github/workflows/dashboard-metrics-hardening.yml

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/business/recharge-workspace.tsx components/settings/settings-config.ts 'app/(dashboard)/dashboard/page.tsx' components/dashboard/dashboard-client.tsx components/business/bill-payment-hub.tsx 'app/business/receipt/[id]/page.tsx' .github/workflows/repair-build.yml .github/workflows/dashboard-metrics-hardening.yml
          git diff --cached --quiet || git commit -m 'fix(receipts): universalize transaction receipts and make history responsive'
          git push
