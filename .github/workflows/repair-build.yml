name: Repair build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore accidentally truncated recharge workspace
        run: git checkout 5026d750a4da05371ec4e68d0d091ee8be28aaf0 -- components/business/recharge-workspace.tsx

      - name: Repair Txn type
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/business/recharge-workspace.tsx')
          s = p.read_text()
          # The shared Txn type is consumed by bill-payment-hub. Keep these fields optional
          # because historical transaction rows may not contain them.
          anchor = '  pool_credit?: number | string;\n'
          addition = ('  customer_collected_amount?: number | string;\n'
                      '  customer_due_amount?: number | string;\n'
                      '  customer_collection_method?: string | null;\n')
          if addition not in s:
              if anchor not in s:
                  raise SystemExit('Txn type anchor missing')
              s = s.replace(anchor, anchor + addition, 1)
              p.write_text(s)
          PY

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/business/recharge-workspace.tsx
          git diff --cached --quiet || git commit -m 'fix(build): restore recharge workspace and transaction typing'
          git push
