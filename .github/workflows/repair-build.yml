name: Repair build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore accidentally truncated recharge workspace
        run: git checkout 5026d750a4da05371ec4e68d0d091ee8be28aaf0 -- components/business/recharge-workspace.tsx

      - name: Repair Txn type
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/business/recharge-workspace.tsx')
          s = p.read_text()
          anchor = '  pool_credit?: number | string;\n'
          addition = ('  customer_collected_amount?: number | string;\n'
                      '  customer_due_amount?: number | string;\n'
                      '  customer_collection_method?: string | null;\n')
          if addition not in s:
              if anchor not in s:
                  raise SystemExit('Txn type anchor missing')
              s = s.replace(anchor, anchor + addition, 1)
              p.write_text(s)
          PY

      - name: Repair payment instrument type
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/settings/settings-config.ts')
          s = p.read_text()
          anchor = '  balance: number | string;\n'
          addition = '  current_balance?: number | string;\n'
          if addition not in s:
              if anchor not in s:
                  raise SystemExit('InstrumentRow balance anchor missing')
              s = s.replace(anchor, anchor + addition, 1)
              p.write_text(s)
          PY

      - name: Set AEPS fee treatment default to separate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/business/aeps-workspace.tsx')
          s = p.read_text()
          old = '  const [feeTreatment, setFeeTreatment] = useState<"deduct" | "separate">("deduct");'
          new = '  const [feeTreatment, setFeeTreatment] = useState<"deduct" | "separate">("separate");'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
          elif new not in s:
              raise SystemExit('AEPS fee treatment default anchor missing')
          PY

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/business/recharge-workspace.tsx components/settings/settings-config.ts components/business/aeps-workspace.tsx
          git diff --cached --quiet || git commit -m 'fix(aeps): make separate fee collection the default'
          git push
