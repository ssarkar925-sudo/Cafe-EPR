name: Repair bill payment build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair transaction number declaration order
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/business/utility-bill-workspace.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''      // 2. Post to Canonical transactions Table\n      const insertPayload = {\n        transaction_number: txnNumber,'''
          new = '''      // 2. Post to Canonical transactions Table\n      const txnNumber = nextNum;\n      const insertPayload = {\n        transaction_number: nextNum,'''
          if old in s:
              s = s.replace(old, new, 1)
          old_decl = '''      // Always use the database record's actual transaction number for every downstream posting/audit.\n      const txnNumber = newTxn.transaction_number || nextNum;\n\n      // 3. Customer Collection Accounting Leg'''
          new_decl = '''      // 3. Customer Collection Accounting Leg'''
          if old_decl in s:
              s = s.replace(old_decl, new_decl, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit repair
        run: |
          if git diff --quiet -- components/business/utility-bill-workspace.tsx; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/business/utility-bill-workspace.tsx
          git commit -m "fix(bill): repair transaction number declaration order"
          git push