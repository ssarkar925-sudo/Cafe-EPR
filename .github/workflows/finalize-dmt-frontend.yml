name: Finalize DMT frontend patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'chore(dmt): apply final frontend atomic posting patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply DMT frontend patch
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('components/business/dmt-workspace.tsx')
          text = path.read_text(encoding='utf-8')
          original = text

          old_call = 'const res = await supabase.rpc("create_business_txn", {'
          new_call = 'const res = await supabase.rpc("create_dmt_business_txn", {'
          if old_call not in text:
              raise SystemExit('Expected DMT create_business_txn call not found')
          text = text.replace(old_call, new_call, 1)

          needle = '        p_receiver_name: receiverName.trim() || null,\n'
          replacement = needle + '        p_portal_charge: numCharge,\n'
          if replacement not in text:
              if needle not in text:
                  raise SystemExit('Expected p_receiver_name argument not found')
              text = text.replace(needle, replacement, 1)

          block = re.compile(
              r'\n      // If portal charge is present, update transaction record and adjust customer collection\n'
              r'      if \(newTxnId && numCharge > 0\) \{.*?\n      \}\n\n      const completedRecord:',
              re.S,
          )
          text, count = block.subn('\n      const completedRecord:', text, count=1)
          if count != 1:
              raise SystemExit(f'Expected portal charge post-processing block once, found {count}')

          old_variance = '''              <div className="mt-0.5 text-xs font-black text-emerald-600 dark:text-emerald-400">₹0.00</div>\n              <span className="text-[9px] text-emerald-600/80">Canonical Match</span>'''
          new_variance = '''              <div className="mt-0.5 text-xs font-black text-emerald-600 dark:text-emerald-400">₹0.00</div>\n              <span className="text-[9px] text-emerald-600/80">Canonical Match</span>'''
          # Keep visual fallback stable; authoritative reconciliation is surfaced by backend RPC.

          if text == original:
              raise SystemExit('No changes made')
          path.write_text(text, encoding='utf-8')

      - name: Commit patched frontend and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-dmt-frontend.yml
          git add components/business/dmt-workspace.tsx
          git commit -m "fix(dmt): use atomic posting RPC and remove duplicate charge adjustment"
          git push
