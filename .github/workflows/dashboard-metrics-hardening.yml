name: Dashboard metrics hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct credit facility mapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/(dashboard)/dashboard/page.tsx')
          s = p.read_text()
          old = '''  const creditCardLimit = Number(rawPools.credit_card?.opening || 0);\n  const creditCardUsed = Number(rawPools.credit_card?.movements || 0);\n  const creditCardAvailable = Math.max(0, creditCardLimit - creditCardUsed);'''
          new = '''  const creditCardLimit = Number(rawPools.credit_card?.credit_limit || 0);\n  const creditCardUsed = Number(rawPools.credit_card?.used_credit || 0);\n  const creditCardAvailable = Number(\n    rawPools.credit_card?.available_credit ?? Math.max(0, creditCardLimit - creditCardUsed)\n  );'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Credit facility mapping anchor missing')
          p.write_text(s)
          PY

      - name: Count only successful service transactions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/dashboard/dashboard-client.tsx')
          s = p.read_text()
          replacements = {
              'const aepsTxns = transactions.filter((t) => t.service_type === "aeps");': 'const aepsTxns = transactions.filter((t) => t.service_type === "aeps" && t.status === "success");',
              'const dmtTxns = transactions.filter((t) => t.service_type === "dmt");': 'const dmtTxns = transactions.filter((t) => t.service_type === "dmt" && t.status === "success");',
              'const upiTxns = transactions.filter((t) => t.service_type === "upi");': 'const upiTxns = transactions.filter((t) => t.service_type === "upi" && t.status === "success");',
              'const rechargeTxns = transactions.filter((t) => t.service_type === "recharge");': 'const rechargeTxns = transactions.filter((t) => t.service_type === "recharge" && t.status === "success");',
          }
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new, 1)
              elif new not in s:
                  raise SystemExit(f'Service filter anchor missing: {old}')
          old_subtitle = 'Real-time throughput, transaction volume, and fee income across digital counters.'
          new_subtitle = 'Successful transaction throughput, service volume, and earned income — last 30 days.'
          if old_subtitle in s:
              s = s.replace(old_subtitle, new_subtitle, 1)
          elif new_subtitle not in s:
              raise SystemExit('Service subtitle anchor missing')
          p.write_text(s)
          PY

      - name: Commit permanent dashboard fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/(dashboard)/dashboard/page.tsx' components/dashboard/dashboard-client.tsx
          git diff --cached --quiet || git commit -m 'fix(dashboard): correct liquidity and service performance calculations'
          git push
