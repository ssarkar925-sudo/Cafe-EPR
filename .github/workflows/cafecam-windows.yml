name: CafeCAM Windows Build

on:
  push:
    branches:
      - release/cafecam-windows-installer
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore native packages
        shell: powershell
        run: nuget restore cafecam/native/CafeCAM.sln -PackagesDirectory cafecam/native/packages

      - name: Build CafeCAM
        shell: powershell
        run: msbuild cafecam/native/CafeCAM.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Verify native payload
        shell: powershell
        run: |
          if (-not (Test-Path cafecam/native/bin/x64/Release/CafeCamManager.exe)) { throw "CafeCamManager.exe missing" }
          if (-not (Test-Path cafecam/native/bin/x64/Release/CafeCamMediaSource.dll)) { throw "CafeCamMediaSource.dll missing" }

      - name: Create self-contained installer script
        shell: powershell
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "cafecam"
          $bin = Join-Path $root "native/bin/x64/Release"
          $managerB64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $bin "CafeCamManager.exe")))
          $dllB64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $bin "CafeCamMediaSource.dll")))
          $installer = @'
# CafeCAM one-click Windows installer
$ErrorActionPreference = "Stop"

function Test-Admin {
  $id = [Security.Principal.WindowsIdentity]::GetCurrent()
  $p = New-Object Security.Principal.WindowsPrincipal($id)
  return $p.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
}

if (-not (Test-Admin)) {
  Start-Process -FilePath $PSCommandPath -Verb RunAs
  exit
}

$installDir = Join-Path $env:ProgramFiles "CafeCAM"
New-Item -ItemType Directory -Force -Path $installDir | Out-Null
[IO.File]::WriteAllBytes((Join-Path $installDir "CafeCamManager.exe"), [Convert]::FromBase64String("__MANAGER_B64__"))
[IO.File]::WriteAllBytes((Join-Path $installDir "CafeCamMediaSource.dll"), [Convert]::FromBase64String("__DLL_B64__"))

$clsid = "{C4E3F6B2-9B63-4C4F-9D7F-1D30E0C65B65}"
$base = [Microsoft.Win32.RegistryKey]::OpenBaseKey([Microsoft.Win32.RegistryHive]::LocalMachine, [Microsoft.Win32.RegistryView]::Registry64)
$clsidKey = $base.CreateSubKey("SOFTWARE\Classes\CLSID\$clsid")
$inproc = $clsidKey.CreateSubKey("InprocServer32")
$clsidKey.SetValue($null, "CafeCAM Virtual Camera")
$inproc.SetValue($null, (Join-Path $installDir "CafeCamMediaSource.dll"))
$inproc.SetValue("ThreadingModel", "Both")
$inproc.Dispose()
$clsidKey.Dispose()
$base.Dispose()

$manager = Join-Path $installDir "CafeCamManager.exe"
$p = Start-Process -FilePath $manager -ArgumentList "install-synthetic" -Wait -PassThru -WindowStyle Hidden
if ($p.ExitCode -ne 0) { exit $p.ExitCode }
exit 0
'@
          $installer = $installer.Replace("__MANAGER_B64__", $managerB64).Replace("__DLL_B64__", $dllB64)
          $script = Join-Path $env:RUNNER_TEMP "CafeCAM-Setup.ps1"
          Set-Content -Path $script -Value $installer -Encoding UTF8
          Write-Output "Installer script prepared."

      - name: Compile installer EXE
        shell: powershell
        run: |
          Install-Module -Name ps2exe -Repository PSGallery -Scope CurrentUser -Force -AllowClobber
          Import-Module ps2exe
          $root = Join-Path $env:GITHUB_WORKSPACE "cafecam"
          $script = Join-Path $env:RUNNER_TEMP "CafeCAM-Setup.ps1"
          $out = Join-Path $root "CafeCAM-Setup.exe"
          Invoke-ps2exe -inputFile $script -outputFile $out -requireAdmin -noConsole -title "CafeCAM Setup" -description "CafeCAM Windows Virtual Camera Installer" -company "CafeCAM" -product "CafeCAM" -version "1.0.0.0"
          if (-not (Test-Path $out)) { throw "CafeCAM-Setup.exe was not created" }

      - name: Package payload
        shell: powershell
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "cafecam"
          $payload = Join-Path $root "release-payload"
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          Copy-Item (Join-Path $root "native/bin/x64/Release/CafeCamManager.exe") $payload -Force
          Copy-Item (Join-Path $root "native/bin/x64/Release/CafeCamMediaSource.dll") $payload -Force

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CafeCAM-Windows-Installer
          path: cafecam/CafeCAM-Setup.exe

      - name: Upload payload
        uses: actions/upload-artifact@v4
        with:
          name: CafeCAM-Payload
          path: cafecam/release-payload/**

  contract-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/test-cafecam-contract.mjs
