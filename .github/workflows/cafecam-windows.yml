name: CafeCAM Windows Build
on:
  push:
    branches: [feat/cafecam-complete-v1, main]
    paths: [cafecam/**, electron/cafecam.js, electron/main.js, electron/preload.js, 'app/(dashboard)/cafecam/**', components/sidebar.tsx, scripts/test-cafecam-contract.mjs]
  pull_request:
    branches: [main]
    paths: [cafecam/**, electron/cafecam.js, electron/main.js, electron/preload.js, 'app/(dashboard)/cafecam/**', components/sidebar.tsx]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Restore native packages
        shell: powershell
        run: nuget restore cafecam/native/CafeCAM.sln -PackagesDirectory cafecam/native/packages
      - name: Build CafeCAM
        shell: powershell
        run: msbuild cafecam/native/CafeCAM.sln /m /p:Configuration=Release /p:Platform=x64
      - name: Verify payload
        shell: powershell
        run: |
          if (-not (Test-Path cafecam/native/bin/x64/Release/CafeCamManager.exe)) { throw 'CafeCamManager.exe missing' }
          if (-not (Test-Path cafecam/native/bin/x64/Release/CafeCamMediaSource.dll)) { throw 'CafeCamMediaSource.dll missing' }
      - name: Build one-click installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'cafecam'
          $package = Join-Path $root 'package'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item (Join-Path $root 'native/bin/x64/Release/CafeCamManager.exe') $package -Force
          Copy-Item (Join-Path $root 'native/bin/x64/Release/CafeCamMediaSource.dll') $package -Force
          Copy-Item (Join-Path $root 'scripts/Install-CafeCAM.ps1') $package -Force
          Copy-Item (Join-Path $root 'scripts/Uninstall-CafeCAM.ps1') $package -Force
          $sed = Join-Path $root 'CafeCAM.sed'
          @(
            '[Version]','Class=IEXPRESS','SEDVersion=3','',
            '[Options]','PackagePurpose=InstallApp','ShowInstallProgramWindow=1','HideExtractAnimation=1','UseLongFileName=1','InsideCompressed=1','CAB_FixedSize=0','CAB_ResvCodeSigning=0','RebootMode=N','InstallPrompt=','DisplayLicense=','FinishMessage=CafeCAM installation completed. Open your camera application and select CafeCAM.','TargetName='+$root+'\CafeCAM-Setup.exe','FriendlyName=CafeCAM','AppLaunched=powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File Install-CafeCAM.ps1','PostInstallCmd=<None>','AdminQuietInstCmd=','UserQuietInstCmd=','SourceFiles=SourceFiles','',
            '[SourceFiles]','SourceFiles0='+$package,'',
            '[SourceFiles0]','CafeCamManager.exe=','CafeCamMediaSource.dll=','Install-CafeCAM.ps1=','Uninstall-CafeCAM.ps1='
          ) | Set-Content -Encoding ASCII $sed
          & "$env:WINDIR\System32\iexpress.exe" /N $sed
          if (-not (Test-Path (Join-Path $root 'CafeCAM-Setup.exe'))) { throw 'CafeCAM-Setup.exe was not created' }
      - uses: actions/upload-artifact@v4
        with:
          name: CafeCAM-Windows-Installer
          path: cafecam/CafeCAM-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: CafeCAM-Payload
          path: |
            cafecam/native/bin/x64/Release/CafeCamManager.exe
            cafecam/native/bin/x64/Release/CafeCamMediaSource.dll
            cafecam/scripts/Install-CafeCAM.ps1
            cafecam/scripts/Uninstall-CafeCAM.ps1
  contract-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/test-cafecam-contract.mjs