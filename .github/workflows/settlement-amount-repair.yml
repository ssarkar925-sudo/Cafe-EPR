name: Settlement Amount Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'chore: trigger settlement amount repair'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch settlement money flow
        env:
          TARGET_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          # 1) Make INR formatting total/robust so malformed DB/API values never render NaN.
          fmt = root / 'lib/format.ts'
          text = fmt.read_text()
          old = '''export function inr(n: number | string) {\n  return (\n    "₹" +\n    Number(n).toLocaleString("en-IN", {\n      minimumFractionDigits: 2,\n      maximumFractionDigits: 2,\n    })\n  );\n}'''
          new = '''export function inr(n: number | string) {\n  const raw = typeof n === "string" ? n.replace(/,/g, "").trim() : n;\n  const value = Number(raw);\n  if (!Number.isFinite(value)) return "₹0.00";\n\n  return (\n    "₹" +\n    value.toLocaleString("en-IN", {\n      minimumFractionDigits: 2,\n      maximumFractionDigits: 2,\n    })\n  );\n}'''
          if old not in text:
              raise SystemExit('format.ts anchor not found')
          fmt.write_text(text.replace(old, new, 1))

          # 2) Settlement form: sync preset amount/type every time a preset/open state changes.
          modal = root / 'components/finance/settlement-form-modal.tsx'
          text = modal.read_text()
          anchor = '''  // Reset source & dest when type changes\n  useEffect(() => {\n    setSourceId("");\n    setDestId("");\n    setAvailableBalance(null);\n    setError("");\n  }, [type]);\n'''
          insert = anchor + '''\n  // Sync parent-provided presets with the persistent modal instance.\n  // Without this, quick presets can open with a stale/blank amount because\n  // the modal stays mounted while closed.\n  useEffect(() => {\n    if (!open) return;\n    setType(initialType ?? "aeps_to_bank");\n    setAmount(\n      initialAmount !== undefined && initialAmount !== null && initialAmount !== ""\n        ? String(initialAmount)\n        : ""\n    );\n  }, [open, initialType, initialAmount]);\n'''
          if anchor not in text:
              raise SystemExit('modal preset anchor not found')
          text = text.replace(anchor, insert, 1)

          # 3) Bank and wallet account balances must include instrument-level settlement legs,
          #    not just cash_entries. This keeps the available-money figure aligned with the journal.
          old_wallet = '''          const { data: ces } = await supabase\n            .from("cash_entries")\n            .select("direction, amount")\n            .eq("instrument_id", sourceId)\n            .gte("entry_date", seedDate);\n\n          const flow = (ces ?? []).reduce((acc, c) => acc + (c.direction === "in" ? Number(c.amount) : -Number(c.amount)), 0);\n          const accountBal = openingBal + flow;\n          setAvailableBalance(Math.max(0, Math.round(accountBal * 100) / 100));'''
          new_wallet = '''          const [{ data: ces }, { data: setts }] = await Promise.all([\n            supabase\n              .from("cash_entries")\n              .select("direction, amount")\n              .eq("instrument_id", sourceId)\n              .gte("entry_date", seedDate),\n            supabase\n              .from("settlements")\n              .select("amount, source_instrument_id, dest_instrument_id")\n              .gte("settlement_date", seedDate)\n              .eq("status", "success"),\n          ]);\n\n          const cashFlow = (ces ?? []).reduce(\n            (acc, c) => acc + (c.direction === "in" ? Number(c.amount || 0) : -Number(c.amount || 0)),\n            0\n          );\n          const settlementFlow = (setts ?? []).reduce((acc, st: any) => {\n            const inflow = st.dest_instrument_id === sourceId ? Number(st.amount || 0) : 0;\n            const outflow = st.source_instrument_id === sourceId ? Number(st.amount || 0) : 0;\n            return acc + inflow - outflow;\n          }, 0);\n          const accountBal = openingBal + cashFlow + settlementFlow;\n          setAvailableBalance(Math.max(0, Math.round(accountBal * 100) / 100));'''
          if old_wallet not in text:
              raise SystemExit('wallet balance anchor not found')
          text = text.replace(old_wallet, new_wallet, 1)

          old_bank = '''          const { data: ces } = await supabase\n            .from("cash_entries")\n            .select("direction, amount")\n            .eq("instrument_id", sourceId)\n            .gte("entry_date", seedDate);\n\n          const flow = (ces ?? []).reduce((acc, c) => acc + (c.direction === "in" ? Number(c.amount) : -Number(c.amount)), 0);\n          const accountBal = openingBal + flow;\n          setAvailableBalance(Math.max(0, Math.round(accountBal * 100) / 100));'''
          new_bank = '''          const [{ data: ces }, { data: setts }] = await Promise.all([\n            supabase\n              .from("cash_entries")\n              .select("direction, amount")\n              .eq("instrument_id", sourceId)\n              .gte("entry_date", seedDate),\n            supabase\n              .from("settlements")\n              .select("amount, source_instrument_id, dest_instrument_id")\n              .gte("settlement_date", seedDate)\n              .eq("status", "success"),\n          ]);\n\n          const cashFlow = (ces ?? []).reduce(\n            (acc, c) => acc + (c.direction === "in" ? Number(c.amount || 0) : -Number(c.amount || 0)),\n            0\n          );\n          const settlementFlow = (setts ?? []).reduce((acc, st: any) => {\n            const inflow = st.dest_instrument_id === sourceId ? Number(st.amount || 0) : 0;\n            const outflow = st.source_instrument_id === sourceId ? Number(st.amount || 0) : 0;\n            return acc + inflow - outflow;\n          }, 0);\n          const accountBal = openingBal + cashFlow + settlementFlow;\n          setAvailableBalance(Math.max(0, Math.round(accountBal * 100) / 100));'''
          if old_bank not in text:
              raise SystemExit('bank balance anchor not found')
          text = text.replace(old_bank, new_bank, 1)
          modal.write_text(text)

          # 4) Settlement client: the RPC is the single source of truth for money movement.
          #    The old browser-side cash_entries inserts were adding extra bank legs and could
          #    make pool/account figures diverge from the settlement journal.
          client = root / 'components/finance/settlements-client.tsx'
          text = client.read_text()
          pattern = re.compile(r'''\n    const sType = payload\.p_settlement_type;\n    const sId = \(data as any\)\?\.id;\n    if \(sId\) \{.*?\n    \}\n\n    logAudit\(\{''', re.S)
          text, count = pattern.subn('''\n    logAudit({''', text, count=1)
          if count != 1:
              raise SystemExit('client cash-entry block not found')

          # Clear preset state after a successful save so a fresh New Settlement never inherits a prior amount.
          old_close = '''    setShowForm(false);\n    showToast("success", `Settlement ${(data as any)?.settlement_number} recorded`);'''
          new_close = '''    setShowForm(false);\n    setFormPreset(null);\n    showToast("success", `Settlement ${(data as any)?.settlement_number} recorded`);'''
          if old_close not in text:
              raise SystemExit('client save-close anchor not found')
          text = text.replace(old_close, new_close, 1)

          old_new_button = '''              onClick={() => setShowForm(true)}'''
          new_new_button = '''              onClick={() => {\n                setFormPreset(null);\n                setShowForm(true);\n              }}'''
          if old_new_button not in text:
              raise SystemExit('client new-settlement button anchor not found')
          text = text.replace(old_new_button, new_new_button, 1)
          client.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/format.ts components/finance/settlement-form-modal.tsx components/finance/settlements-client.tsx .github/workflows/settlement-amount-repair.yml
          git rm -f .github/workflows/settlement-amount-repair.yml
          git commit -m "fix: correct settlement money figures and account flows"
          git push origin HEAD:main