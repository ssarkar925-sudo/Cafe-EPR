# Supabase STAGING backup — encrypted pg_dump uploaded to Google Drive.
#
# SAFETY MODEL (read carefully before touching this file):
# - STAGING ONLY. The guard step requires the database URL to resolve to
#   exactly the expected staging host below (and never the production host).
#   Never add a production URL here.
# - Uploads are cryptographically verified (id/name/size/MD5/trashed) and the
#   run fails hard on any mismatch.
# - All credentials come from GitHub Actions secrets. Nothing is hardcoded.
# - The plaintext dump never leaves the runner disk unencrypted and is
#   shredded immediately after encryption. Secrets are never echoed.
#
# Required secrets (see docs/STAGING_BACKUP.md):
#   STAGING_DATABASE_URL          postgresql://... staging connection string
#   BACKUP_ENCRYPTION_PASSPHRASE  strong random passphrase for openssl
#   GDRIVE_SERVICE_ACCOUNT_JSON   Google service-account key JSON
#   GDRIVE_BACKUP_FOLDER_ID       Google Drive folder ID for uploads

name: Supabase Staging Backup

'on':
  schedule:
    - cron: "30 2 * * *" # daily 02:30 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-staging-backup
  cancel-in-progress: false

env:
  # Expected staging host. The guard step requires an exact match and aborts
  # on anything else. Update only with review.
  STAGING_EXPECTED_HOST: plznnfgupoqhdsfwgqna.supabase.co
  # Production hostname. The guard step additionally refuses to run if the
  # staging connection string resolves to this host. Update only with review.
  PRODUCTION_HOST: tvxehxnvuwojjbhysajp.supabase.co
  BACKUP_RETENTION_DAYS: "14"
  BACKUP_KEEP_MINIMUM: "7"

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Guard staging target (fail closed)
        shell: bash
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          echo "::add-mask::$STAGING_DATABASE_URL"
          if [ -z "${STAGING_DATABASE_URL:-}" ]; then
            echo "::error::STAGING_DATABASE_URL secret is empty. Refusing to run."
            exit 1
          fi
          # Parse without ever printing the URL. Only PASS/FAIL reaches logs.
          PARSED="$(STAGING_DATABASE_URL="$STAGING_DATABASE_URL" python3 - <<'EOF'
          import os, urllib.parse
          u = urllib.parse.urlparse(os.environ.get("STAGING_DATABASE_URL", ""))
          print(u.scheme or "")
          print(u.hostname or "")
          EOF
          )"
          SCHEME="$(echo "$PARSED" | sed -n '1p')"
          HOST="$(echo "$PARSED" | sed -n '2p')"
          if [ "$SCHEME" != "postgresql" ] && [ "$SCHEME" != "postgres" ]; then
            echo "::error::Connection string is not a postgresql:// URL. Refusing to run."
            exit 1
          fi
          if [ -z "$HOST" ]; then
            echo "::error::Could not determine database hostname. Refusing to run."
            exit 1
          fi
          if [ "$HOST" = "$PRODUCTION_HOST" ]; then
            echo "::error::Target hostname matches PRODUCTION. Refusing to run."
            exit 1
          fi
          if [ "$HOST" != "$STAGING_EXPECTED_HOST" ]; then
            echo "::error::Database hostname is not the expected staging host. Refusing to run."
            exit 1
          fi
          echo "Target guard passed: exact staging host confirmed."

      - name: Split connection into libpq env (no secrets in args/logs)
        shell: bash
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          echo "::add-mask::$STAGING_DATABASE_URL"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "BACKUP_STAMP=$STAMP" >> "$GITHUB_ENV"
          PGPASS="$RUNNER_TEMP/pgpass"
          STAGING_DATABASE_URL="$STAGING_DATABASE_URL" PGPASSFILE_OUT="$PGPASS" GITHUB_ENV_OUT="$GITHUB_ENV" python3 - <<'EOF'
          import os, urllib.parse
          u = urllib.parse.urlparse(os.environ["STAGING_DATABASE_URL"])
          db = (u.path or "/postgres").lstrip("/") or "postgres"
          port = str(u.port or 5432)
          with open(os.environ["GITHUB_ENV_OUT"], "a", encoding="utf-8") as f:
              f.write(f"PGHOST={u.hostname or ''}\n")
              f.write(f"PGPORT={port}\n")
              f.write(f"PGUSER={urllib.parse.unquote(u.username or 'postgres')}\n")
              f.write(f"PGDATABASE={db}\n")
              f.write("PGPASSFILE=" + os.environ["PGPASSFILE_OUT"] + "\n")
          line = ":".join([
              u.hostname or "",
              port,
              db,
              urllib.parse.unquote(u.username or "postgres"),
              urllib.parse.unquote(u.password or ""),
          ])
          with open(os.environ["PGPASSFILE_OUT"], "w", encoding="utf-8") as f:
              f.write(line + "\n")
          os.chmod(os.environ["PGPASSFILE_OUT"], 0o600)
          EOF
          echo "Connection split into libpq env; password lives only in a 600 pgpass file."

      - name: Dump staging database (pinned postgres:18 client)
        shell: bash
        run: |
          set -euo pipefail
          DUMP="$RUNNER_TEMP/staging-$BACKUP_STAMP.dump"
          echo "DUMP_PATH=$DUMP" >> "$GITHUB_ENV"
          docker run --rm -i \
            -e PGHOST -e PGPORT -e PGUSER -e PGDATABASE -e PGPASSFILE \
            -v "$PGPASSFILE:/tmp/pgpass:ro" \
            -e PGPASSFILE=/tmp/pgpass \
            postgres:18 pg_dump -Fc -Z6 -d "$PGDATABASE" > "$DUMP"
          test -s "$DUMP"
          echo "Dump complete: $(du -h "$DUMP" | cut -f1)."

      - name: Encrypt dump and shred plaintext
        shell: bash
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          echo "::add-mask::$BACKUP_ENCRYPTION_PASSPHRASE"
          if [ -z "${BACKUP_ENCRYPTION_PASSPHRASE:-}" ]; then
            echo "::error::BACKUP_ENCRYPTION_PASSPHRASE secret is empty. Refusing to upload plaintext."
            exit 1
          fi
          ENC="$DUMP_PATH.enc"
          echo "ENC_PATH=$ENC" >> "$GITHUB_ENV"
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 \
            -in "$DUMP_PATH" -out "$ENC" -pass env:BACKUP_ENCRYPTION_PASSPHRASE
          test -s "$ENC"
          shred -u "$DUMP_PATH"
          echo "SHA256=$(sha256sum "$ENC" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "MD5=$(md5sum "$ENC" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "Encrypted and plaintext shredded."

      - name: Upload to Google Drive and apply retention
        shell: bash
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_BACKUP_FOLDER_ID: ${{ secrets.GDRIVE_BACKUP_FOLDER_ID }}
        run: |
          set -euo pipefail
          echo "::add-mask::$GDRIVE_SERVICE_ACCOUNT_JSON"
          if [ -z "${GDRIVE_BACKUP_FOLDER_ID:-}" ]; then
            echo "::error::GDRIVE_BACKUP_FOLDER_ID secret is empty."
            exit 1
          fi
          python3 -m pip install --quiet google-api-python-client google-auth
          GDRIVE_SERVICE_ACCOUNT_JSON="$GDRIVE_SERVICE_ACCOUNT_JSON" \
          GDRIVE_BACKUP_FOLDER_ID="$GDRIVE_BACKUP_FOLDER_ID" \
          ENC_PATH="$ENC_PATH" BACKUP_STAMP="$BACKUP_STAMP" BACKUP_SHA="$SHA256" BACKUP_MD5="$MD5" \
          RETENTION_DAYS="$BACKUP_RETENTION_DAYS" KEEP_MINIMUM="$BACKUP_KEEP_MINIMUM" \
          python3 - <<'EOF'
          import json, os
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          key = json.loads(os.environ["GDRIVE_SERVICE_ACCOUNT_JSON"])
          folder = os.environ["GDRIVE_BACKUP_FOLDER_ID"]
          enc = os.environ["ENC_PATH"]
          stamp = os.environ["BACKUP_STAMP"]
          sha = os.environ.get("BACKUP_SHA", "")
          local_md5 = os.environ.get("BACKUP_MD5", "")
          retention = int(os.environ.get("RETENTION_DAYS", "14"))
          keep_min = int(os.environ.get("KEEP_MINIMUM", "7"))

          creds = service_account.Credentials.from_service_account_info(
              key, scopes=["https://www.googleapis.com/auth/drive.file"])
          drive = build("drive", "v3", credentials=creds, cache_discovery=False)

          name = f"cafeerp-staging-{stamp}.dump.enc"
          media = MediaFileUpload(enc, mimetype="application/octet-stream", resumable=True)
          created = drive.files().create(
              body={"name": name, "parents": [folder],
                    "description": f"CafeERP staging pg_dump (custom format, AES-256-CBC). SHA256={sha}"},
              media_body=media, fields="id,name,size,md5Checksum,trashed").execute()

          # Cryptographic upload verification: fail hard on any mismatch.
          remote = drive.files().get(
              fileId=created["id"],
              fields="id,name,size,md5Checksum,trashed").execute()
          local_size = str(os.path.getsize(enc))
          checks = {
              "id_present": bool(remote.get("id")),
              "name_match": remote.get("name") == name,
              "size_match": str(remote.get("size")) == local_size,
              "md5_match": bool(local_md5) and (remote.get("md5Checksum") or "").lower() == local_md5.lower(),
              "not_trashed": remote.get("trashed") is False,
          }
          print("Upload verification: " + ", ".join(f"{k}={v}" for k, v in checks.items()))
          if not all(checks.values()):
              raise SystemExit(f"UPLOAD VERIFICATION FAILED: {checks}")
          print(f"Verified {remote['name']} id={remote['id']} bytes={remote['size']}.")

          # Retention: keep newest KEEP_MINIMUM always; delete older than RETENTION_DAYS beyond that.
          from datetime import datetime, timedelta, timezone
          items, token = [], None
          while True:
              resp = drive.files().list(
                  q=f"'{folder}' in parents and trashed=false and name contains 'cafeerp-staging-'",
                  fields="files(id,name,createdTime),nextPageToken",
                  orderBy="createdTime desc", pageSize=100, pageToken=token).execute()
              items.extend(resp.get("files", []))
              token = resp.get("nextPageToken")
              if not token:
                  break
          cutoff = datetime.now(timezone.utc) - timedelta(days=retention)
          removed = 0
          for i, item in enumerate(items):
              if i < keep_min:
                  continue
              created_time = datetime.fromisoformat(item["createdTime"].replace("Z", "+00:00"))
              if created_time < cutoff:
                  drive.files().update(fileId=item["id"], body={"trashed": True}).execute()
                  removed += 1
          print(f"Retention: {len(items)} backups present, {removed} trashed (keep_min={keep_min}, days={retention}).")
          EOF
          shred -u "$ENC_PATH"
          echo "Upload, verification and retention complete; local ciphertext shredded."

      - name: Secure cleanup (always)
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          for f in "$RUNNER_TEMP/pgpass" "$DUMP_PATH" "$ENC_PATH"; do
            if [ -n "${f:-}" ] && [ -f "$f" ]; then shred -u "$f" || rm -f "$f"; fi
          done
          echo "Temporary credential and backup files shredded."

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "Staging backup workflow finished. See per-step logs (no secrets printed)."
