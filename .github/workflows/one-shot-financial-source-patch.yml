name: One-shot financial source patch
on:
  push:
    branches: [chore/financial-hardening-final]
    paths:
      - '.github/workflows/one-shot-financial-source-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch utility financial writes and business fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('components/business/utility-bill-workspace.tsx')
          s = p.read_text()

          if 'supabase.rpc("record_bill_payment"' not in s:
              start = s.index('  // 2. Post to Canonical transactions Table')
              end = s.index('  // 5. Audit Trail Logging', start)
              replacement = '''  // 2. Canonical financial mutation: SECURITY DEFINER RPC.\n  const customerAllocations = customerPaymentAllocations.filter((row) => Number(row.amount) > 0);\n  const effectiveCustomerMethod =\n    customerCollectionAmount > 0\n      ? (customerAllocations.length === 1\n          ? customerAllocations[0].method\n          : (customerPayMethod === "due" ? "cash" : customerPayMethod))\n      : "due";\n\n  const { data: paymentResult, error: paymentError } = await supabase.rpc("record_bill_payment", {\n    p_transaction_date: todayDate,\n    p_transaction_timestamp: todayIso,\n    p_customer_id: selectedCustomerId || null,\n    p_customer_mobile: customerMobile.replace(/\\D/g, "") || null,\n    p_reference: `${reference.trim() || consumerId.trim()}-${txnNumber}`,\n    p_remarks: remarks.trim() || `${currentCategory.name} - ${billerName} (${consumerId.trim()})`,\n    p_status: "success",\n    p_amount: billAmount,\n    p_service_fee: custFee,\n    p_portal_commission: commissionEarned,\n    p_pay_from_instrument_id: fundingInstId,\n    p_pay_from_method: selectedFundingAccount.type,\n    p_customer_pay_method: effectiveCustomerMethod,\n    p_customer_collection_instrument_id:\n      customerAllocations.length === 1 ? (selectedCustomerPaymentAccount?.id || null) : null,\n    p_customer_payment_allocations: customerAllocations,\n  });\n  if (paymentError) throw paymentError;\n  const createdTxnId = paymentResult?.id;\n  if (!createdTxnId) throw new Error("Canonical bill-payment RPC returned no transaction id.");\n\n  const { data: newTxn, error: loadTxnError } = await supabase\n    .from("transactions")\n    .select(`*, customers(name, phone), profiles(full_name)`)\n    .eq("id", createdTxnId)\n    .single();\n  if (loadTxnError || !newTxn) throw loadTxnError || new Error("Bill payment was posted but could not be loaded.");\n\n'''
              s = s[:start] + replacement + s[end:]

          marker = '  // Offset cash entries\n'
          if marker in s:
              start = s.index(marker)
              end = s.index('  setTransactions(', start)
              s = s[:start] + '  // reverse_business_txn owns the append-only reversal accounting; do not mutate financial tables here.\n\n' + s[end:]
          p.write_text(s)

          p = Path('components/business/business-client.tsx')
          if p.exists():
              s = p.read_text()
              s = re.sub(r'\n\s*await syncCashbookForTxn\([^;]+;\s*', '\n', s)
              s = re.sub(r'\n\s*const \{ data: fallbackTxn[\s\S]*?\n\s*if \(fallbackErr\) throw fallbackErr;\n', '\n      throw rpcError;\n', s, count=1)
              p.write_text(s)

          wf = Path('.github/workflows/one-shot-financial-source-patch.yml')
          if wf.exists(): wf.unlink()
          PY
          if git diff --quiet; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/business/utility-bill-workspace.tsx components/business/business-client.tsx .github/workflows/one-shot-financial-source-patch.yml
          git commit -m 'fix(financial): route utility and business mutations through RPCs'
          git push
