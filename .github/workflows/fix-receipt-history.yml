name: Fix receipt history

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch history action column sizing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/business/bill-payment-hub.tsx')
          s = p.read_text()
          s = s.replace('className="px-4 py-3.5 text-right"', 'className="px-2 py-3 align-middle text-right"', 1)
          p.write_text(s)
          PY

      - name: Patch print receipt modal for every service type
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/business/bill-payment-hub.tsx')
          s = p.read_text()
          anchor = '''                <div className="flex justify-between">\n                  <span>Target / Ref:</span>\n                  <span className="font-bold">{printTxn.customer_mobile || printTxn.reference}</span>\n                </div>'''
          addition = anchor + '''\n\n                {classifyTxn(printTxn).isUtility && (\n                  <>\n                    <div className="flex justify-between">\n                      <span>Biller:</span>\n                      <span className="font-bold">{classifyTxn(printTxn).providerName}</span>\n                    </div>\n                    <div className="flex justify-between">\n                      <span>Consumer / Ref:</span>\n                      <span className="font-bold">{printTxn.reference || "—"}</span>\n                    </div>\n                  </>\n                )}\n\n                {classifyTxn(printTxn).isGooglePlay && (\n                  <>\n                    <div className="flex justify-between">\n                      <span>Provider:</span>\n                      <span className="font-bold">Google Play</span>\n                    </div>\n                    {printTxn.reference && (\n                      <div className="flex justify-between">\n                        <span>Voucher / Ref:</span>\n                        <span className="font-bold">{printTxn.reference}</span>\n                      </div>\n                    )}\n                  </>\n                )}\n\n                {classifyTxn(printTxn).isRecharge && !classifyTxn(printTxn).isUtility && !classifyTxn(printTxn).isGooglePlay && (\n                  <div className="flex justify-between">\n                    <span>Operator:</span>\n                    <span className="font-bold">{classifyTxn(printTxn).providerName}</span>\n                  </div>\n                )}'''
          if anchor in s and addition not in s:
              s = s.replace(anchor, addition, 1)
          elif addition not in s:
              raise SystemExit('Print receipt target anchor missing')
          p.write_text(s)
          PY

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/business/bill-payment-hub.tsx
          git diff --cached --quiet || git commit -m 'fix(receipts): universalize history print receipt modal and sizing'
          git push
